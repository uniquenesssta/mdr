name: Stage 2 Atomic Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: stage-02-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ui-foundation:
    name: Verify Stage 2 UI foundation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Stage 1 historical handoff remains intact
        run: node --test tests/stage-01-handoff.test.mjs
      - name: Verify Atomic Task 2.1 frozen DOM inventory
        run: node --test tests/ui/dom-asset-inventory.test.mjs
      - name: Verify Atomic Task 2.2 minimal index and module entry
        run: node --test tests/ui/minimal-index.test.mjs
      - name: Run architecture hard gate
        run: node scripts/verify-architecture.mjs --output=artifacts/stage-02/02-02-architecture-scan.json
      - name: Record Atomic Task 2.2 evidence
        shell: bash
        run: |
          mkdir -p artifacts/stage-02
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { buildHtmlInventory } from './scripts/stage-02/dom-inventory/html-inventory.mjs';
          import { collectInlineEvents } from './scripts/architecture/source-analysis.mjs';
          const indexSource = await readFile('index.html', 'utf8');
          const shellSource = await readFile('public/compatibility/current-shell.html', 'utf8');
          const indexInventory = buildHtmlInventory(indexSource);
          const inlineEvents = collectInlineEvents('public/compatibility/current-shell.html', shellSource)
            .reduce((sum, record) => sum + record.count, 0);
          if (indexInventory.summary.inlineEventCount !== 0 || inlineEvents !== 184) process.exit(1);
          await writeFile('artifacts/stage-02/02-02-minimal-index-evidence.json', `${JSON.stringify({
            node: 'stage-02/02-02',
            status: 'passed',
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            scope: 'minimal-index-and-module-entry',
            nextAtomicTask: '2.3-not-started',
            index: indexInventory.source,
            indexSummary: indexInventory.summary,
            compatibilityShell: {
              path: 'public/compatibility/current-shell.html',
              inlineEvents,
              scriptElements: 0
            },
            guarantees: [
              'index-has-only-head-app-root-and-module-entry',
              'no-index-inline-events-or-business-dom',
              'legacy-dom-remains-single-authoritative-compatibility-shell',
              'vite-tauri-resource-paths-preserved',
              'tasks-2.3-through-2.6-not-started'
            ]
          }, null, 2)}\n`, 'utf8');
          NODE
      - name: Run existing Node regression suite
        run: npm test
      - name: Run browser interaction contract
        run: npm run test:browser:contract
      - name: Build current application
        run: npm run build
      - name: Upload Atomic Task evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-ui-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-02
          if-no-files-found: error
          retention-days: 30
