name: Finalize Stage 2 Atomic Task 2.3

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/finalize-stage-02-03.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - name: Verify clean workspace
        run: test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply completion record
        run: python scripts/tmp-finalize-stage-02-03.py
      - name: Verify documentation closeout
        run: |
          npm run verify:readme-record
          node --test tests/svg-sprite.test.mjs
          git diff --check
          grep -F '当前状态：完成。' docs/rewrite-progress/stage-02/02-03-svg-sprite.md
          grep -F 'Stage 0 Baseline Verification：run `31004015506`，通过。' docs/rewrite-progress/stage-02/02-03-svg-sprite.md
          grep -F 'Atomic Task 2.4 尚未开始' README.md
      - name: Commit completion record
        run: |
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add README.md docs/rewrite-progress/stage-02/02-03-svg-sprite.md
          git diff --cached --check
          git commit -m "docs(stage2): complete Atomic Task 2.3 closeout"
          git push origin HEAD:rewrite/modular-rebuild
