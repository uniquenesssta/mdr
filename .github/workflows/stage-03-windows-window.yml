name: Stage 3 Windows Window Automation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/stage-03-windows-window.yml
      - package.json
      - package-lock.json
      - public/app/events.js
      - src/platform/desktop/window-client.js
      - src/runtime/tauri.js
      - src-tauri/**
      - scripts/stage-03/windows/prepare-embedded-driver-host.ps1
      - tests/e2e/windows/**
      - tests/windows-window-automation.test.mjs
      - README.md
      - docs/README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-03-windows-window-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-window:
    name: Verify native Windows window lifecycle
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      MARKDOWN_EDITOR_BINARY: .windows-driver-host/src-tauri/target/debug/markdown-editor.exe

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install declared Rust toolchain
        shell: pwsh
        run: |
          $manifest = Get-Content src-tauri/Cargo.toml -Raw
          if ($manifest -notmatch 'rust-version\s*=\s*"([^"]+)"') {
            throw 'src-tauri/Cargo.toml does not declare rust-version.'
          }
          $toolchain = $Matches[1]
          rustup toolchain install $toolchain --profile minimal --no-self-update
          rustup default $toolchain
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Windows automation architecture contract
        run: node --test tests/windows-window-automation.test.mjs

      - name: Install pinned transient WebDriver client
        run: npm install --no-save --no-package-lock selenium-webdriver@4.34.0

      - name: Build current frontend
        run: npm run build

      - name: Build current Windows release application
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Prepare isolated embedded WebDriver host
        shell: pwsh
        run: ./scripts/stage-03/windows/prepare-embedded-driver-host.ps1

      - name: Build isolated embedded WebDriver application
        run: cargo build --locked --manifest-path .windows-driver-host/src-tauri/Cargo.toml

      - name: Prepare Windows evidence directory
        shell: pwsh
        run: |
          $evidenceDirectory = 'artifacts/stage-03/windows-window'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          Copy-Item '.windows-driver-host/driver-host.json' "$evidenceDirectory/driver-host.json" -Force
          [pscustomobject]@{
            headSha = '${{ github.event.pull_request.head.sha || github.sha }}'
            runner = '${{ runner.os }}'
            image = '${{ runner.name }}'
            status = 'workflow-started'
            driverProvider = 'embedded-isolated-host'
            releaseBinary = 'src-tauri/target/release/markdown-editor.exe'
            webdriverBinary = $env:MARKDOWN_EDITOR_BINARY
          } | ConvertTo-Json | Set-Content -Path "$evidenceDirectory/workflow-bootstrap.json" -Encoding utf8

      - name: Verify automation inputs
        shell: pwsh
        run: |
          $releaseBinary = 'src-tauri/target/release/markdown-editor.exe'
          if (-not (Test-Path $releaseBinary)) {
            throw "Windows release application binary missing: $releaseBinary"
          }
          if (-not (Test-Path $env:MARKDOWN_EDITOR_BINARY)) {
            throw "Windows embedded WebDriver test binary missing: $env:MARKDOWN_EDITOR_BINARY"
          }
          if ((Get-Content 'src-tauri/Cargo.toml' -Raw) -match 'tauri-plugin-wdio-webdriver') {
            throw 'Production Cargo.toml was modified by the Windows automation preparation.'
          }
          if ((Get-Content 'src-tauri/src/main.rs' -Raw) -match 'tauri_plugin_wdio_webdriver') {
            throw 'Production main.rs was modified by the Windows automation preparation.'
          }
          Get-Item $releaseBinary
          Get-Item $env:MARKDOWN_EDITOR_BINARY

      - name: Run native Windows window automation
        run: node tests/e2e/windows/run-window-automation.mjs

      - name: Upload Windows window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-03-windows-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-03/windows-window
          if-no-files-found: error
          retention-days: 30

  # BEGIN INTERNAL CONCURRENCY REPAIR
  repair-concurrency:
    name: Repair verification concurrency keys
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Patch latest branch and self-clean
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone \
            --branch rewrite/modular-rebuild \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repository
          cd repository
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/stage-00-baseline.yml': (
                  '  group: stage-00-${{ github.event.pull_request.head.ref || github.ref_name }}',
                  '  group: stage-00-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}',
              ),
              '.github/workflows/stage-01-atomic.yml': (
                  '  group: stage-01-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}',
                  '  group: stage-01-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}',
              ),
              '.github/workflows/stage-02-atomic.yml': (
                  '  group: stage-02-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}',
                  '  group: stage-02-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}',
              ),
              '.github/workflows/stage-03-atomic.yml': (
                  '  group: stage-03-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}',
                  '  group: stage-03-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}',
              ),
              '.github/workflows/stage-03-windows-window.yml': (
                  '  group: stage-03-windows-window-${{ github.event.pull_request.head.ref || github.ref_name }}',
                  '  group: stage-03-windows-window-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}',
              ),
          }

          for file_name, (old, new) in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{file_name}: expected exactly one original concurrency key')
              path.write_text(text.replace(old, new), encoding='utf-8')

          windows_path = Path('.github/workflows/stage-03-windows-window.yml')
          windows_text = windows_path.read_text(encoding='utf-8')
          begin = '  # BEGIN INTERNAL CONCURRENCY REPAIR\n'
          end = '  # END INTERNAL CONCURRENCY REPAIR\n'
          if windows_text.count(begin) != 1 or windows_text.count(end) != 1:
              raise SystemExit('Windows workflow repair block markers are missing or ambiguous')
          start_index = windows_text.index(begin)
          end_index = windows_text.index(end, start_index) + len(end)
          windows_text = windows_text[:start_index] + windows_text[end_index:]
          windows_text = windows_text.replace(
              'permissions:\n  contents: write',
              'permissions:\n  contents: read',
              1,
          )
          windows_path.write_text(windows_text, encoding='utf-8')

          temporary_workflow = Path('.github/workflows/internal-isolate-ci-concurrency.yml')
          if temporary_workflow.exists():
              temporary_workflow.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: isolate verification concurrency by commit'
          git push origin HEAD:rewrite/modular-rebuild
  # END INTERNAL CONCURRENCY REPAIR
