name: Stage 3 Windows Window Automation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/stage-03-windows-window.yml
      - package.json
      - package-lock.json
      - public/app/events.js
      - src/platform/desktop/window-client.js
      - src/runtime/tauri.js
      - src-tauri/**
      - tests/e2e/windows/**
      - tests/windows-window-automation.test.mjs
      - README.md
      - docs/README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-03-windows-window-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-window:
    name: Verify native Windows window lifecycle
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      MARKDOWN_EDITOR_BINARY: src-tauri/target/debug/markdown-editor.exe

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install declared Rust toolchain
        shell: pwsh
        run: |
          $manifest = Get-Content src-tauri/Cargo.toml -Raw
          if ($manifest -notmatch 'rust-version\s*=\s*"([^"]+)"') {
            throw 'src-tauri/Cargo.toml does not declare rust-version.'
          }
          $toolchain = $Matches[1]
          rustup toolchain install $toolchain --profile minimal --no-self-update
          rustup default $toolchain
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned transient WebDriver client
        run: npm install --no-save --no-package-lock selenium-webdriver@4.34.0

      - name: Build current frontend
        run: npm run build

      - name: Build current Windows release application
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build embedded WebDriver debug application
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml

      - name: Prepare Windows evidence directory
        shell: pwsh
        run: |
          $evidenceDirectory = 'artifacts/stage-03/windows-window'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          [pscustomobject]@{
            headSha = '${{ github.event.pull_request.head.sha || github.sha }}'
            runner = '${{ runner.os }}'
            image = '${{ runner.name }}'
            status = 'workflow-started'
            driverProvider = 'embedded'
            releaseBinary = 'src-tauri/target/release/markdown-editor.exe'
            webdriverBinary = $env:MARKDOWN_EDITOR_BINARY
          } | ConvertTo-Json | Set-Content -Path "$evidenceDirectory/workflow-bootstrap.json" -Encoding utf8

      - name: Verify automation inputs
        shell: pwsh
        run: |
          $releaseBinary = 'src-tauri/target/release/markdown-editor.exe'
          if (-not (Test-Path $releaseBinary)) {
            throw "Windows release application binary missing: $releaseBinary"
          }
          if (-not (Test-Path $env:MARKDOWN_EDITOR_BINARY)) {
            throw "Windows embedded WebDriver debug binary missing: $env:MARKDOWN_EDITOR_BINARY"
          }
          Get-Item $releaseBinary
          Get-Item $env:MARKDOWN_EDITOR_BINARY

      - name: Run native Windows window automation
        run: node tests/e2e/windows/run-window-automation.mjs

      - name: Upload Windows window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-03-windows-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-03/windows-window
          if-no-files-found: error
          retention-days: 30
