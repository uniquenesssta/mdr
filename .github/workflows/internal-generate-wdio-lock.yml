name: Internal Generate WDIO Lock

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/internal-generate-wdio-lock.yml
      - src-tauri/Cargo.toml

permissions:
  contents: write

concurrency:
  group: internal-generate-wdio-lock-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-lock:
    name: Generate debug WebDriver Cargo lock
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild

      - name: Install declared Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"

      - name: Generate Cargo lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit generated Cargo lock
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'build: lock embedded WebDriver dependency'
          git push origin HEAD:rewrite/modular-rebuild
