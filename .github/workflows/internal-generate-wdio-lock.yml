name: Internal Generate WDIO Lock

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/internal-generate-wdio-lock.yml
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  generate-lock:
    name: Generate debug WebDriver Cargo lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOSITORY_DIRECTORY: repository
    steps:
      - name: Clone branch without marketplace actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone \
            --branch rewrite/modular-rebuild \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$REPOSITORY_DIRECTORY"

      - name: Install declared Rust toolchain
        shell: bash
        working-directory: repository
        run: |
          toolchain="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"

      - name: Generate Cargo lock
        working-directory: repository
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit generated Cargo lock
        shell: bash
        working-directory: repository
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'build: lock embedded WebDriver dependency'
          git push origin HEAD:rewrite/modular-rebuild
