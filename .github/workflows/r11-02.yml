name: R11-02 Document Store Types

on:
  push:
    branches:
      - agent/r11-stage
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved R11-02 facade fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/r11-stage'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src-tauri/src/document_store.rs')
          source_text = source.read_text(encoding='utf-8')
          old_source = '''pub(crate) use types::{
              DocumentChunk, DocumentManifest, DocumentTransaction, LoadedDocument, NativeHeading,
              SaveDocumentRequest, SaveDocumentResponse, SearchDocumentRequest, SearchDocumentResponse,
              TextChange,
          };
          use types::{JournalEntry, SnapshotMeta};
          '''
          new_source = '''pub use types::TextChange;
          pub(crate) use types::{
              DocumentChunk, DocumentManifest, DocumentTransaction, LoadedDocument, NativeHeading,
              SaveDocumentRequest, SaveDocumentResponse, SearchDocumentRequest, SearchDocumentResponse,
          };
          use types::{JournalEntry, SnapshotMeta};
          '''
          if old_source not in source_text:
              raise SystemExit('Expected R11-02 facade block not found; refusing automatic edit')
          source.write_text(source_text.replace(old_source, new_source, 1), encoding='utf-8')

          Path('README.md').write_text('''# Markdown Editor

模块化 Markdown 编辑器。Stage 11 正在执行 R11-02：Serde DTO 已迁入 `document_store/types.rs`；针对 Clippy 暴露的 `TextChange` 未使用 crate re-export，已改为保持既有 `document_store::TextChange` 路径的公开 facade re-export，其余 DTO 仍为 crate 级入口。JSON、Tauri 命令、磁盘/恢复/UTF-16 语义及依赖不变。完整硬门禁重新验证中，全部通过前不收口、不进入 R11-03。详情见 [R11-02](docs/R11-02-DETAILS.md)。
''', encoding='utf-8')

          details = Path('docs/R11-02-DETAILS.md')
          details_text = details.read_text(encoding='utf-8')
          old_details = '- 当前验证：guard 同步后的精确 R11-02 提交树重新执行完整硬门禁；全部通过前不收口，不进入 R11-03。\n'
          new_details = '''- 第三轮精确 CI run `32163214320` 已通过 scope/contracts guard、Rust format、JSON contracts 4/4、R11-01 compatibility 5/5 与完整 Rust tests；全量 `cargo clippy --all-targets -- --deny warnings` 随后仅报 `document_store.rs` 的 `TextChange` crate re-export 未使用。cargo check、Node、architecture、browser、build 与 clean-tree 因 fail-fast 被跳过，不能计为通过。\n- Clippy blocker 修复：不增加 `allow`、不降低 Clippy 门禁，也不删除 DTO。将 `TextChange` 从会触发未使用检查的 `pub(crate) use` 集合拆出为 `pub use types::TextChange;`，保持 R11-01 前既有的 `document_store::TextChange` facade 路径与可见性；其余实际由 crate 调用的 DTO 继续使用 `pub(crate)` re-export。运行时、Serde JSON、磁盘、命令和依赖均不变。\n- 当前验证：修复后的精确提交树重新执行完整硬门禁；全部通过前不收口，不进入 R11-03。\n'''
          if old_details not in details_text:
              raise SystemExit('Expected R11-02 validation record not found; refusing automatic edit')
          details.write_text(details_text.replace(old_details, new_details, 1), encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet -- src-tauri/src/document_store.rs README.md docs/R11-02-DETAILS.md; then
            echo 'R11-02 facade fix already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/document_store.rs README.md docs/R11-02-DETAILS.md
          git commit -m 'fix(r11-02): preserve TextChange facade without unused import'
          git push origin HEAD:agent/r11-stage

      - name: Guard R11-02 scope and contracts
        shell: bash
        run: |
          set -euo pipefail
          base='6cdff0cb98982e7604053d6ec0c0df7c0991e2fd'
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD)"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(README\.md|docs/R11-02-DETAILS\.md|src-tauri/src/document_store\.rs|src-tauri/src/document_store/types\.rs|src-tauri/tests/document_store_compatibility\.rs|\.github/workflows/r11-01\.yml|\.github/workflows/r11-02\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected R11-02 paths:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test -f src-tauri/src/document_store.rs
          test -f src-tauri/src/document_store/types.rs
          grep -Fq 'mod types;' src-tauri/src/document_store.rs
          grep -Fq 'pub use types::TextChange;' src-tauri/src/document_store.rs
          grep -Fq 'pub(crate) use types::{' src-tauri/src/document_store.rs
          ! grep -Fq 'pub struct SaveDocumentRequest {' src-tauri/src/document_store.rs
          grep -Fq 'pub struct SaveDocumentRequest {' src-tauri/src/document_store/types.rs
          grep -Fq '#[serde(rename_all = "camelCase")]' src-tauri/src/document_store/types.rs
          grep -Fq 'SOURCE_DOCUMENT_STORE_TYPES' src-tauri/tests/document_store_compatibility.rs
          git diff --quiet "$base"...HEAD -- \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            package.json \
            package-lock.json \
            src-tauri/src/main.rs \
            src-tauri/tests/fixtures/document_store
          ! grep -q '^  push:' .github/workflows/r11-01.yml
          ! grep -q '^  pull_request:' .github/workflows/r11-01.yml
          grep -Fq 'ref: 6cdff0cb98982e7604053d6ec0c0df7c0991e2fd' .github/workflows/r11-01.yml
          git diff --check

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Pin Rust 1.88 with Clippy and rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.88.0
          rustc --version
          cargo --version

      - name: R11-02 Rust format gate
        run: rustfmt --edition 2021 --check src-tauri/src/document_store/types.rs src-tauri/tests/document_store_compatibility.rs

      - name: R11-02 JSON contracts 4/4
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor document_store::types::tests | tee /tmp/r11_02_types.log
          grep -q 'test result: ok. 4 passed; 0 failed' /tmp/r11_02_types.log

      - name: R11-01 compatibility fixtures 5/5
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test document_store_compatibility | tee /tmp/r11_01_compat.log
          grep -q 'test result: ok. 5 passed; 0 failed' /tmp/r11_01_compat.log

      - name: Full Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: R11-02 Clippy hard gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- --deny warnings

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: R10-12 compatibility 11/11
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-10-remove-legacy-save.test.mjs | tee /tmp/r10_12.log
          grep -q '# tests 11' /tmp/r10_12.log
          grep -q '# pass 11' /tmp/r10_12.log
          grep -q '# fail 0' /tmp/r10_12.log

      - name: Full Node regression 344/344
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test > /tmp/r11_02_node.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- Node regression failing test context ---'
            grep -n -B 20 -A 35 -E '^[[:space:]]*not ok [0-9]+ -' /tmp/r11_02_node.log || true
            echo '--- Node regression assertion context ---'
            grep -n -B 8 -A 16 -E 'failureType:|AssertionError|ERR_|actual:|expected:|operator:' /tmp/r11_02_node.log || true
            echo '--- Node regression totals ---'
            grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' /tmp/r11_02_node.log || true
            exit "$status"
          fi
          grep -q '# tests 344' /tmp/r11_02_node.log
          grep -q '# pass 344' /tmp/r11_02_node.log
          grep -q '# fail 0' /tmp/r11_02_node.log
          grep -E '^# (tests|pass|fail) ' /tmp/r11_02_node.log

      - name: Architecture and documentation gates
        run: |
          npm run verify:architecture
          npm run verify:no-legacy-runtime
          npm run verify:generated-files
          npm run verify:readme-record

      - name: Browser preview contract 10/10
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser:contract | tee /tmp/r11_02_browser_contract.log
          grep -Fq 'Browser tests: 10, passed: 10, failed: 0' /tmp/r11_02_browser_contract.log

      - name: Production build
        run: npm run build

      - name: Built-app browser regression 29/29
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser | tee /tmp/r11_02_browser.log
          grep -Fq 'Browser tests: 29, passed: 29, failed: 0' /tmp/r11_02_browser.log

      - name: Validation must leave tracked tree clean
        run: |
          git diff --check
          git diff --exit-code
