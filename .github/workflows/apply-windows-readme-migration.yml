name: Apply Windows Automation And README Migration

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/apply-windows-readme-migration.yml
      - scripts/stage-03/windows-automation-payload.part-*

permissions:
  contents: write

concurrency:
  group: apply-windows-readme-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rewrite/modular-rebuild

      - name: Expand verified implementation payload
        shell: bash
        run: |
          cat scripts/stage-03/windows-automation-payload.part-* > "$RUNNER_TEMP/windows-readme-payload.b64"
          base64 --decode "$RUNNER_TEMP/windows-readme-payload.b64" > "$RUNNER_TEMP/windows-readme-payload.zip"
          unzip -t "$RUNNER_TEMP/windows-readme-payload.zip"
          unzip -o "$RUNNER_TEMP/windows-readme-payload.zip" -d .

      - name: Apply README migration patch
        run: node scripts/stage-03/apply-windows-readme-migration.mjs

      - name: Verify generated implementation
        run: |
          node --check tests/e2e/windows/run-window-automation.mjs
          node --check tests/e2e/windows/native-window-system.mjs
          node --check tests/e2e/windows/window-evidence.mjs
          node --check scripts/architecture/checks.mjs
          node --check scripts/stage-00/persist-results.mjs
          node --test tests/documentation-layout.test.mjs tests/windows-window-automation.test.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/stage-03-windows-window.yml \
            docs/README.md \
            docs/rewrite-progress/stage-03/03-05-windows-automation.md \
            scripts/architecture/checks.mjs \
            scripts/stage-00/persist-results.mjs \
            scripts/stage-03/apply-windows-readme-migration.mjs \
            scripts/stage-03/windows/install-edge-driver.ps1 \
            tests/documentation-layout.test.mjs \
            tests/windows-window-automation.test.mjs \
            tests/e2e/windows
          git commit -m "test(platform): add Windows window automation"
          git push origin HEAD:rewrite/modular-rebuild
