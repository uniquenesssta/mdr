name: Discover Stage 2 Atomic Task 2.3

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/discover-stage-02-03.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover icon definitions and references
        run: node scripts/tmp-discover-stage-02-03.mjs
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-03-icon-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-02/02-03-icon-discovery.json
          if-no-files-found: error
          retention-days: 7
