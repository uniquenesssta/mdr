name: Finalize Stage 2 Atomic Task 2.5

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/finalize-stage-02-05.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rewrite/modular-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify expected closeout ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor 77ee167155dc3e36915cf8df15dc449dd3191898 HEAD
          test -z "$(git diff --name-only 77ee167155dc3e36915cf8df15dc449dd3191898...HEAD | grep -v '^\.github/workflows/finalize-stage-02-05.yml$' || true)"
      - name: Install locked dependencies
        run: npm ci
      - name: Apply completion record
        shell: bash
        run: |
          cat > /tmp/stage-02-05-final-record.b64 <<'RECORD'

RECORD
          test "$(wc -c < /tmp/stage-02-05-final-record.b64)" = "8929"
          tr -d '\n' < /tmp/stage-02-05-final-record.b64 > /tmp/stage-02-05-final-record.compact.b64
          test "$(sha256sum /tmp/stage-02-05-final-record.compact.b64 | cut -d' ' -f1)" = "cf942ee6c27ae84fdf4c138c315001f4c6d0aeba084fa85cc83ed9e437ea1770"
          base64 -d /tmp/stage-02-05-final-record.compact.b64 > docs/rewrite-progress/stage-02/02-05-dom-primitives.md
          test "$(sha256sum docs/rewrite-progress/stage-02/02-05-dom-primitives.md | cut -d' ' -f1)" = "7143af64da360de9fa6ac7839594d5735a836b274bf89ccbd9ffee633430c0e9"
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          old = '- 2026-08-05：阶段 2 Atomic Task 2.5（DOM 原语）已实施并进入正式复验：新增 `src/ui/dom/index.js` 及安全元素创建、必需引用校验、事件作用域、焦点作用域、过渡可见性 5 个职责模块；App Shell、兼容挂载链和链接预览只经公共入口使用这些原语，链接预览新增焦点约束/恢复与过时关闭结果取消。生产模块记录为 85；未实现 Modal Shell、CSS 分层或业务表单行为，未修改 Rust、依赖、锁文件、冻结模型或持久化，Atomic Task 2.6 尚未开始。'
          new = '- 2026-08-05：阶段 2 Atomic Task 2.5（DOM 原语）完成：新增 `src/ui/dom/index.js` 及安全元素创建、必需引用校验、事件作用域、焦点作用域、过渡可见性 5 个职责模块；App Shell、兼容挂载链和链接预览只经公共入口使用这些原语，链接预览增加初始焦点、Tab 约束、焦点恢复与过时隐藏结果取消。实现提交 `9f3f4cbbdba992944cf93e0b275da9634d59007f`，清理验证头 `77ee167155dc3e36915cf8df15dc449dd3191898` 的 Stage 2 run `31016721386`、Stage 1 run `31016721135`、Stage 0 run `31016724092` 全部通过；生产模块记录为 85，未实现 Modal Shell、CSS 分层或业务表单行为，未修改 Rust、依赖、锁文件、冻结模型或持久化，Atomic Task 2.6 尚未开始。'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('README Atomic Task 2.5 pending record mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify completion record
        shell: bash
        run: |
          npm run verify:readme-record
          node --test tests/ui/dom-primitives.test.mjs
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "README.md docs/rewrite-progress/stage-02/02-05-dom-primitives.md "
      - name: Commit completion record
        shell: bash
        run: |
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add README.md docs/rewrite-progress/stage-02/02-05-dom-primitives.md
          git commit -m "docs(stage2): complete Atomic Task 2.5 closeout"
          git push origin HEAD:rewrite/modular-rebuild
