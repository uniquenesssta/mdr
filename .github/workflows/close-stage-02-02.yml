name: Close Stage 2 Atomic Task 2.2

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/close-stage-02-02.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 2

      - name: Verify clean workspace
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -f scripts/tmp-close-stage-02-02.py
          test -f scripts/tmp-close-stage-02-02-followup.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply closeout patches
        run: |
          python scripts/tmp-close-stage-02-02.py
          python scripts/tmp-close-stage-02-02-followup.py

      - name: Verify closeout change set
        run: |
          set -euo pipefail
          npm test
          npm run verify:architecture
          npm run verify:no-legacy-runtime
          npm run verify:generated-files
          npm run verify:readme-record
          npm run test:browser:contract
          npm run build
          npm run test:browser
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            README.md
            docs/rewrite-progress/stage-02/02-02-minimal-index.md
            tests/built-application-assets.test.mjs
            tests/e2e/lib/built-application-assets.mjs
            tests/e2e/run-browser-tests.mjs
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Commit verified closeout fix
        run: |
          set -euo pipefail
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md docs/rewrite-progress/stage-02/02-02-minimal-index.md tests/built-application-assets.test.mjs tests/e2e/lib/built-application-assets.mjs tests/e2e/run-browser-tests.mjs
          git commit -m "fix(stage2): close Atomic Task 2.2 browser regression"
          git push origin HEAD:rewrite/modular-rebuild
