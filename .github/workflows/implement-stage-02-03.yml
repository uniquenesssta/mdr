name: Implement Stage 2 Atomic Task 2.3

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/implement-stage-02-03.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - name: Verify expected branch head and clean workspace
        shell: bash
        run: |
          test "$(git branch --show-current)" = "rewrite/modular-rebuild"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Atomic Task 2.3 implementation
        run: python scripts/tmp-implement-stage-02-03.py
      - name: Verify focused contracts
        run: |
          node --test tests/svg-sprite.test.mjs
          node --test tests/ui/minimal-index.test.mjs
      - name: Run Node regression suite
        run: npm test
      - name: Run architecture gates
        run: |
          npm run verify:architecture
          npm run verify:no-legacy-runtime
          npm run verify:generated-files
          npm run verify:readme-record
      - name: Run browser contract
        run: npm run test:browser:contract
      - name: Build production application
        run: npm run build
      - name: Run complete built application regression
        run: npm run test:browser
      - name: Review formal diff
        shell: bash
        run: |
          git diff --check
          git status --short
          test -f public/assets/icons.svg
          test -f src/ui/components/icon-view.js
          test -f docs/rewrite-progress/stage-02/02-03-svg-sprite.md
          test -z "$(git diff --name-only | grep -E '^(package(-lock)?\.json|src-tauri/|src/styles/)' || true)"
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add README.md \
            docs/rewrite-progress/stage-02/02-03-svg-sprite.md \
            public/assets/icons.svg \
            public/compatibility/current-shell.html \
            public/app/core.js \
            public/app/events.js \
            scripts/stage-02/icon-sprite/inspect-svg-sprite.mjs \
            src/runtime/link-preview.js \
            src/sidebar/folder-file-tree.js \
            src/ui/components/icon-view.js \
            tests/architecture/fixtures/production-modules.json \
            tests/e2e/run-browser-tests.mjs \
            tests/stage-01-handoff.test.mjs \
            tests/svg-sprite.test.mjs \
            tests/ui/minimal-index.test.mjs
          git diff --cached --check
          git commit -m "feat(stage2): implement Atomic Task 2.3 SVG sprite"
          git push origin HEAD:rewrite/modular-rebuild
