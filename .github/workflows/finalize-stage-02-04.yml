name: Finalize Stage 2 Atomic Task 2.4

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/finalize-stage-02-04.yml

permissions:
  contents: write

concurrency:
  group: finalize-stage-02-04
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify expected closeout ancestry
        run: |
          git merge-base --is-ancestor b5bc87719e71b9ac27c0bc2512ba9121a4e24d07 HEAD
          test -f scripts/stage-02/tmp-finalize-stage-02-04.py
      - name: Install locked dependencies
        run: npm ci
      - name: Apply completion record
        run: python scripts/stage-02/tmp-finalize-stage-02-04.py
      - name: Verify completion record
        run: |
          npm run verify:readme-record
          node --test tests/ui/app-shell.test.mjs
          grep -F '当前状态：完成。' docs/rewrite-progress/stage-02/02-04-app-shell.md
          grep -F 'Atomic Task 2.5 尚未开始' README.md
          git diff --check
      - name: Commit completion record
        run: |
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add README.md docs/rewrite-progress/stage-02/02-04-app-shell.md
          git commit -m "docs(stage2): complete Atomic Task 2.4 closeout"
          git push origin HEAD:rewrite/modular-rebuild
