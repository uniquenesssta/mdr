name: Apply Stage 1 Atomic Task 1.4

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-apply-01-04.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply disposer registry
        shell: bash
        run: |
          cat > src/app/disposer-registry.js <<'EOF'
          const DISPOSER_REGISTRY_STATES = Object.freeze({
            OPEN: 'open',
            DISPOSING: 'disposing',
            FAILED: 'failed'
          });

          function assertDisposer(disposer) {
            if (typeof disposer !== 'function') {
              throw new TypeError('Registered disposer must be a function.');
            }
          }

          export { DISPOSER_REGISTRY_STATES };

          export function createDisposerRegistry() {
            let state = DISPOSER_REGISTRY_STATES.OPEN;
            let entries = [];
            let transitionPromise = null;

            function removeEntry(entry) {
              const index = entries.indexOf(entry);
              if (index >= 0) entries.splice(index, 1);
            }

            function runEntry(entry) {
              if (!entry.active) return Promise.resolve();
              if (entry.promise) return entry.promise;

              let operation;
              operation = Promise.resolve()
                .then(() => entry.disposer())
                .then(() => {
                  entry.active = false;
                  removeEntry(entry);
                  if (state === DISPOSER_REGISTRY_STATES.FAILED && entries.length === 0) {
                    state = DISPOSER_REGISTRY_STATES.OPEN;
                  }
                })
                .finally(() => {
                  if (entry.promise === operation) entry.promise = null;
                });
              entry.promise = operation;
              return operation;
            }

            function register(disposer) {
              assertDisposer(disposer);
              if (state === DISPOSER_REGISTRY_STATES.DISPOSING) {
                throw new Error('Cannot register a disposer while registry disposal is in progress.');
              }
              if (state === DISPOSER_REGISTRY_STATES.FAILED) {
                throw new Error('Cannot register a disposer while previous cleanup is incomplete.');
              }

              const entry = {
                disposer,
                active: true,
                promise: null
              };
              entries.push(entry);

              return function disposeRegisteredResource() {
                if (state === DISPOSER_REGISTRY_STATES.DISPOSING && !entry.promise) {
                  return Promise.reject(
                    new Error('Registered resources cannot be disposed out of order during registry cleanup.')
                  );
                }
                return runEntry(entry);
              };
            }

            function dispose() {
              if (state === DISPOSER_REGISTRY_STATES.DISPOSING) return transitionPromise;
              if (entries.length === 0) {
                state = DISPOSER_REGISTRY_STATES.OPEN;
                return Promise.resolve();
              }

              state = DISPOSER_REGISTRY_STATES.DISPOSING;
              let transition;
              transition = (async () => {
                const errors = [];
                const activeEntries = [...entries].reverse();

                for (const entry of activeEntries) {
                  if (!entry.active) continue;
                  try {
                    await runEntry(entry);
                  } catch (error) {
                    errors.push(error);
                  }
                }

                state = errors.length === 0
                  ? DISPOSER_REGISTRY_STATES.OPEN
                  : DISPOSER_REGISTRY_STATES.FAILED;

                if (errors.length > 0) {
                  throw new AggregateError(
                    errors,
                    'Disposer registry cleanup completed with errors.'
                  );
                }
              })().finally(() => {
                if (transitionPromise === transition) transitionPromise = null;
              });
              transitionPromise = transition;
              return transition;
            }

            return Object.freeze({
              get state() {
                return state;
              },
              get size() {
                return entries.length;
              },
              register,
              dispose,
              destroy: dispose
            });
          }
          EOF

          cat > tests/architecture/disposer-registry.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import test from 'node:test';
          import { fileURLToPath } from 'node:url';
          import {
            DISPOSER_REGISTRY_STATES,
            createDisposerRegistry
          } from '../../src/app/disposer-registry.js';
          import { createApplicationLifecycle } from '../../src/app/application-lifecycle.js';

          const root = fileURLToPath(new URL('../..', import.meta.url));

          function deferred() {
            let resolvePromise;
            const promise = new Promise(resolve => {
              resolvePromise = resolve;
            });
            return { promise, resolve: resolvePromise };
          }

          test('registry disposes synchronous and asynchronous resources in strict reverse order', async () => {
            const calls = [];
            const registry = createDisposerRegistry();

            registry.register(() => calls.push('first'));
            registry.register(async () => {
              await Promise.resolve();
              calls.push('second');
            });
            registry.register(() => calls.push('third'));

            assert.ok(Object.isFrozen(registry));
            assert.equal(registry.state, DISPOSER_REGISTRY_STATES.OPEN);
            assert.equal(registry.size, 3);

            await registry.dispose();

            assert.deepEqual(calls, ['third', 'second', 'first']);
            assert.equal(registry.size, 0);
            assert.equal(registry.state, DISPOSER_REGISTRY_STATES.OPEN);
          });

          test('registered disposer supports early idempotent cleanup and is removed from global disposal', async () => {
            let calls = 0;
            const registry = createDisposerRegistry();
            const disposeResource = registry.register(() => {
              calls += 1;
            });

            await disposeResource();
            await disposeResource();
            await registry.dispose();

            assert.equal(calls, 1);
            assert.equal(registry.size, 0);
          });

          test('concurrent registry disposal shares one transition and runs each disposer once', async () => {
            const gate = deferred();
            let calls = 0;
            const registry = createDisposerRegistry();
            registry.register(async () => {
              calls += 1;
              await gate.promise;
            });

            const first = registry.dispose();
            const second = registry.dispose();

            assert.equal(registry.state, DISPOSER_REGISTRY_STATES.DISPOSING);
            assert.strictEqual(first, second);
            gate.resolve();
            await first;
            assert.equal(calls, 1);
          });

          test('cleanup failures do not stop later cleanup and only failed entries are retried', async () => {
            const calls = [];
            const firstFailure = new Error('first cleanup failed');
            const thirdFailure = new Error('third cleanup failed');
            let firstAttempts = 0;
            let thirdAttempts = 0;
            const registry = createDisposerRegistry();

            registry.register(() => {
              firstAttempts += 1;
              calls.push(`first:${firstAttempts}`);
              if (firstAttempts === 1) throw firstFailure;
            });
            registry.register(() => calls.push('second'));
            registry.register(() => {
              thirdAttempts += 1;
              calls.push(`third:${thirdAttempts}`);
              if (thirdAttempts === 1) throw thirdFailure;
            });

            await assert.rejects(registry.dispose(), error => {
              assert.ok(error instanceof AggregateError);
              assert.deepEqual(error.errors, [thirdFailure, firstFailure]);
              return true;
            });

            assert.equal(registry.state, DISPOSER_REGISTRY_STATES.FAILED);
            assert.equal(registry.size, 2);
            assert.deepEqual(calls, ['third:1', 'second', 'first:1']);
            assert.throws(
              () => registry.register(() => {}),
              /previous cleanup is incomplete/
            );

            await registry.dispose();

            assert.equal(registry.state, DISPOSER_REGISTRY_STATES.OPEN);
            assert.equal(registry.size, 0);
            assert.deepEqual(calls, ['third:1', 'second', 'first:1', 'third:2', 'first:2']);
          });

          test('registration is blocked during cleanup and direct disposal cannot violate LIFO order', async () => {
            const gate = deferred();
            const registry = createDisposerRegistry();
            const disposeFirst = registry.register(() => {});
            registry.register(() => gate.promise);

            const disposal = registry.dispose();
            assert.throws(
              () => registry.register(() => {}),
              /disposal is in progress/
            );
            await assert.rejects(
              disposeFirst(),
              /cannot be disposed out of order/
            );

            gate.resolve();
            await disposal;
          });

          test('registry can own multiple lifecycle generations without accumulating cleanup', async () => {
            const calls = [];
            const registry = createDisposerRegistry();
            let generation = 0;
            const lifecycle = createApplicationLifecycle([{
              async start() {
                generation += 1;
                const current = generation;
                registry.register(() => calls.push(`listener:${current}`));
                registry.register(() => calls.push(`worker:${current}`));
              },
              async destroy() {
                await registry.destroy();
              }
            }]);

            await lifecycle.start();
            await lifecycle.destroy();
            await lifecycle.start();
            await lifecycle.destroy();

            assert.deepEqual(calls, [
              'worker:1', 'listener:1',
              'worker:2', 'listener:2'
            ]);
            assert.equal(registry.size, 0);
          });

          test('invalid disposer contracts are rejected without changing registry state', () => {
            const registry = createDisposerRegistry();

            assert.throws(
              () => registry.register(null),
              { name: 'TypeError', message: 'Registered disposer must be a function.' }
            );
            assert.equal(registry.size, 0);
            assert.equal(registry.state, DISPOSER_REGISTRY_STATES.OPEN);
          });

          test('disposer registry remains platform-free and disconnected from the legacy bootstrap', async () => {
            const source = await readFile(resolve(root, 'src/app/disposer-registry.js'), 'utf8');
            const legacyBootstrap = await readFile(resolve(root, 'src/main.js'), 'utf8');
            const forbiddenRuntimeAccess = /\b(?:document|window|localStorage|sessionStorage|Worker|SharedWorker|MutationObserver|ResizeObserver|setTimeout|setInterval)\b|@tauri-apps|\binvoke\s*\(/;

            assert.doesNotMatch(source, forbiddenRuntimeAccess);
            assert.doesNotMatch(legacyBootstrap, /(?:import|export)[^;]*app\/disposer-registry\.js|import\([^)]*app\/disposer-registry\.js/);
          });
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('tests/architecture/fixtures/production-modules.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          module_path = 'src/app/disposer-registry.js'
          if not any(record[0] == module_path for record in manifest['modules']):
              manifest['modules'].append([
                  module_path,
                  'esm-module',
                  'composition',
                  'LIFO ownership and retryable cleanup of registered resource disposers.',
                  'disposer-registry',
                  'explicit-instance',
                  'retain',
                  False
              ])
          manifest['modules'].sort(key=lambda record: record[0])
          path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit disposer registry implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/disposer-registry.js tests/architecture/disposer-registry.test.mjs tests/architecture/fixtures/production-modules.json
          git diff --cached --check
          git commit -m "feat(stage1): add disposer registry"
          git push origin "HEAD:${{ github.head_ref }}"
