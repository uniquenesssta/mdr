name: Stage 2.6 Repository Snapshot

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-02-06-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package repository
        shell: bash
        run: tar -C .. -czf "${RUNNER_TEMP}/repository.tar.gz" mdr
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-06-repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository.tar.gz
          if-no-files-found: error
          retention-days: 1
