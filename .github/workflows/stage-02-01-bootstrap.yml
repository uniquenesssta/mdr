name: Stage 2 Atomic Task 2.1 Bootstrap
# Retry after aligning the deterministic trailing-newline line count.

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-02-01-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Materialize and verify DOM inventory implementation
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode .github/stage-02-01-bootstrap.payload.b64 | tar -xzf -
          node scripts/stage-02/collect-dom-asset-inventory.mjs --write-fixtures
          node --test tests/ui/dom-asset-inventory.test.mjs
          npm run verify:architecture
          npm test

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add \
            scripts/stage-02/collect-dom-asset-inventory.mjs \
            scripts/stage-02/dom-inventory/html-inventory.mjs \
            scripts/stage-02/dom-inventory/repository-references.mjs \
            scripts/stage-02/dom-inventory/migration-map.mjs \
            tests/ui/dom-asset-inventory.test.mjs \
            tests/ui/fixtures/dom-region-manifest.json \
            tests/ui/fixtures/dom-asset-inventory.json \
            tests/ui/fixtures/dom-migration-map.json
          git diff --cached --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const actual = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = [
            'scripts/stage-02/collect-dom-asset-inventory.mjs',
            'scripts/stage-02/dom-inventory/html-inventory.mjs',
            'scripts/stage-02/dom-inventory/repository-references.mjs',
            'scripts/stage-02/dom-inventory/migration-map.mjs',
            'tests/ui/dom-asset-inventory.test.mjs',
            'tests/ui/fixtures/dom-region-manifest.json',
            'tests/ui/fixtures/dom-asset-inventory.json',
            'tests/ui/fixtures/dom-migration-map.json'
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected staged files: ${JSON.stringify(actual)}`);
          }
          NODE
          git commit -m "test(stage2): inventory legacy DOM assets"
          git push origin HEAD:rewrite/modular-rebuild
