name: Stage 2 Atomic Task 2.2 Bootstrap

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-02-02-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Materialize Atomic Task 2.2 implementation
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode .github/stage-02-02.payload.b64 | tar -xzf -
          node .github/stage-02-02/bootstrap.mjs

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add \
            index.html \
            public/compatibility/current-shell.html \
            src/bootstrap/module-entry.js \
            src/ui/compatibility/mount-current-shell.js \
            tests/ui/dom-asset-inventory.test.mjs \
            tests/ui/minimal-index.test.mjs \
            tests/architecture/fixtures/production-modules.json \
            tests/stage-01-handoff.test.mjs \
            .github/workflows/stage-01-atomic.yml \
            .github/workflows/stage-02-atomic.yml \
            README.md \
            docs/rewrite-progress/stage-02/02-02-minimal-index.md
          git diff --cached --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const actual = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = [
            '.github/workflows/stage-01-atomic.yml',
            '.github/workflows/stage-02-atomic.yml',
            'README.md',
            'docs/rewrite-progress/stage-02/02-02-minimal-index.md',
            'index.html',
            'public/compatibility/current-shell.html',
            'src/bootstrap/module-entry.js',
            'src/ui/compatibility/mount-current-shell.js',
            'tests/architecture/fixtures/production-modules.json',
            'tests/stage-01-handoff.test.mjs',
            'tests/ui/dom-asset-inventory.test.mjs',
            'tests/ui/minimal-index.test.mjs'
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected staged files: ${JSON.stringify(actual)}`);
          }
          NODE
          git commit -m "refactor(stage2): establish minimal HTML entry"

          node scripts/verify-no-legacy-runtime.mjs --write-baseline
          node --test tests/ui/dom-asset-inventory.test.mjs tests/ui/minimal-index.test.mjs
          node --test tests/architecture/module-inventory.test.mjs tests/stage-01-handoff.test.mjs
          npm run verify:architecture
          npm test
          npm run test:browser:contract
          npm run build

          sed -i "s/BOOTSTRAP_PENDING/passed/g; s/BOOTSTRAP_RUN_ID/${GITHUB_RUN_ID}/g" README.md docs/rewrite-progress/stage-02/02-02-minimal-index.md
          git add tests/architecture/fixtures/architecture-baseline.json README.md docs/rewrite-progress/stage-02/02-02-minimal-index.md
          git diff --cached --check
          git commit -m "test(stage2): verify minimal HTML entry"
          git push origin HEAD:rewrite/modular-rebuild
