name: Finalize Stage 2 Atomic Task 2.2

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/finalize-stage-02-02.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 2

      - name: Verify clean workspace
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -f scripts/tmp-finalize-stage-02-02.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply completion record
        run: python scripts/tmp-finalize-stage-02-02.py

      - name: Verify documentation closeout
        run: |
          set -euo pipefail
          npm run verify:readme-record
          npm test
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          expected=(README.md docs/rewrite-progress/stage-02/02-02-minimal-index.md)
          test "${changed[*]}" = "${expected[*]}"

      - name: Commit completion record
        run: |
          set -euo pipefail
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md docs/rewrite-progress/stage-02/02-02-minimal-index.md
          git commit -m "docs(stage2): complete Atomic Task 2.2 closeout"
          git push origin HEAD:rewrite/modular-rebuild
