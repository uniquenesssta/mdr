name: R9-04 validation v2

on:
  push:
    branches:
      - agent/r9-04-runner2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-04:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate R9-04
        shell: bash
        run: bash .agent/r9_04_validate.sh
