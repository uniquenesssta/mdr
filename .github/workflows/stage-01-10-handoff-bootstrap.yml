name: Stage 1 Atomic Task 1.10 Handoff Bootstrap

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-01-10-handoff-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-handoff:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply Stage 1 handoff contract
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          workflow_path = Path('.github/workflows/stage-01-atomic.yml')
          payload_path = Path('.github/stage-01-10-handoff-test.payload.mjs')
          test_path = Path('tests/stage-01-handoff.test.mjs')

          readme = readme_path.read_text(encoding='utf-8')
          readme_anchor = '## Change Log\n'
          handoff = '''## Stage 1 架构交接

阶段 1 已完成，只交付可执行的架构基础与迁移门禁；阶段 2 尚未开始，不得宣称业务功能已经迁移。当前生产应用仍由 `src/main.js` 与 9 个经典脚本启动，其中包括 `public/app/*.js` 和 `public/i18n.js`；阶段 1 清单仍覆盖 67 个生产模块。

### 阶段 2 可依赖的公共架构 API

- `src/app/create-application.js`：`createApplication(dependencies)`，公开冻结的 `commands`、`events`、`start()` 与 `destroy()`。
- `src/app/application-lifecycle.js`：`LIFECYCLE_STATES`、`createApplicationLifecycle(participants)`。
- `src/app/disposer-registry.js`：`DISPOSER_REGISTRY_STATES`、`createDisposerRegistry()`。
- `src/app/commands/command-ids.js`：`assertCommandId()`、`defineCommandIds()`。
- `src/app/commands/command-registry.js`：`createCommandRegistry()`、`DuplicateCommandRegistrationError`、`CommandNotRegisteredError`。
- `src/app/commands/command-bus.js`：`createCommandBus()`。
- `src/app/events/event-types.js`：`assertEventType()`、`defineEventTypes()`。
- `src/app/events/event-bus.js`：`createEventBus()`、`EventBusDestroyedError`、`InvalidEventPayloadError`。
- `src/model-kernel/index.js`：冻结 JavaScript 模型能力的唯一公共入口，精确公开 26 个既有符号；非模型模块不得绕过该入口导入冻结实现。

### 状态所有权与依赖边界

- `application-lifecycle.js` 唯一拥有应用生命周期状态与活动参与者栈。
- `disposer-registry.js` 唯一拥有单个模块登记的资源清理状态。
- `command-registry.js` 唯一拥有命令 ID 到处理器的映射；`command-bus.js` 只负责路由。
- `event-bus.js` 唯一拥有事件订阅状态，并只发布深层冻结的普通数据快照。
- Feature 不得反向依赖 `src/app/` 内部；跨 Feature 只能依赖目标 Feature 的公共 `index.js`；Platform 不得导入 Feature；Model Kernel 不得导入高层模块；生产 JavaScript 模块不得形成循环依赖。

### 迁移基线与删除候选

当前精确迁移基线锁定 9 个经典脚本、184 个内联事件、38 个业务全局写入和 4 个跟踪运行产物，且不允许通配豁免。`public/app/*.js`、`public/i18n.js` 和旧 `src/main.js` 启动链是后续分阶段迁移与删除候选，不得提前删除；每次移除遗留事实时必须在同一受审变更中同步缩减精确基线并完成回归。

### 验证入口

```bash
npm run verify:architecture
npm run verify:no-legacy-runtime
npm run verify:generated-files
npm run verify:readme-record
npm test
npm run test:browser:contract
npm run build
npm run check
```

涉及桌面或 Rust 链路时继续执行锁文件约束下的 `cargo test`、`cargo check` 与 Tauri release build。架构检查只读取仓库源码和本地 Git 事实，不依赖构建产物或联网。

### 已知限制

- 新组合根、生命周期、命令和事件基础设施尚未接入生产启动链。
- 真实业务命令、事件目录和 Feature 迁移必须在对应后续 Atomic Task 中逐条建立和验证。
- 当前完整桌面基线在 Ubuntu 22.04 验证；Windows 原生窗口、文件关联和系统拖放仍需在涉及这些路径的阶段执行真实平台验证。

'''

          if readme.count(readme_anchor) != 1:
              raise SystemExit('README Change Log anchor is not unique')
          if '## Stage 1 架构交接\n' in readme:
              raise SystemExit('README already contains Stage 1 handoff')
          readme_path.write_text(readme.replace(readme_anchor, handoff + readme_anchor, 1), encoding='utf-8')

          workflow = workflow_path.read_text(encoding='utf-8')
          test_anchor = '''      - name: Run architecture hard gate
        run: node scripts/verify-architecture.mjs --output=artifacts/stage-01/01-08-architecture-scan.json
'''
          test_insert = '''      - name: Verify Stage 1 handoff contract
        run: node --test tests/stage-01-handoff.test.mjs
      - name: Run architecture hard gate
        run: node scripts/verify-architecture.mjs --output=artifacts/stage-01/01-08-architecture-scan.json
'''
          evidence_anchor = '''      - name: Run existing Node regression suite
        run: npm test
'''
          evidence_insert = '''      - name: Record Stage 1 handoff evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const baseline = JSON.parse(await readFile('tests/architecture/fixtures/architecture-baseline.json', 'utf8'));
          const modules = JSON.parse(await readFile('tests/architecture/fixtures/production-modules.json', 'utf8'));
          const packageJson = JSON.parse(await readFile('package.json', 'utf8'));
          await writeFile('artifacts/stage-01/01-10-stage-01-handoff.json', `${JSON.stringify({
            node: 'stage-01/01-10',
            status: 'passed',
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            handoffScope: 'architecture-foundation-only',
            stage2: 'not-started',
            productionBootstrap: 'legacy-src-main-and-classic-scripts',
            productionModules: modules.length,
            exactMigrationBaseline: {
              wildcardExemptions: baseline.policy.wildcardExemptions,
              classicScripts: baseline.legacyClassicScripts.reduce((sum, item) => sum + item.count, 0),
              inlineEvents: baseline.inlineEvents.reduce((sum, item) => sum + item.count, 0),
              businessGlobals: baseline.businessGlobalWrites.reduce((sum, item) => sum + item.count, 0),
              trackedGeneratedFiles: baseline.trackedGeneratedFiles.length
            },
            packageVerificationEntries: [
              'verify:architecture',
              'verify:no-legacy-runtime',
              'verify:generated-files',
              'verify:readme-record'
            ].map(name => ({ name, command: packageJson.scripts[name] }))
          }, null, 2)}\n`, 'utf8');
          NODE
      - name: Run existing Node regression suite
        run: npm test
'''

          if workflow.count(test_anchor) != 1:
              raise SystemExit('Stage 1 architecture hard-gate anchor is not unique')
          if workflow.count(evidence_anchor) != 1:
              raise SystemExit('Stage 1 Node regression anchor is not unique')
          if 'Verify Stage 1 handoff contract' in workflow:
              raise SystemExit('Stage 1 workflow already contains handoff contract')
          workflow = workflow.replace(test_anchor, test_insert, 1)
          workflow = workflow.replace(evidence_anchor, evidence_insert, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          if not payload_path.is_file():
              raise SystemExit('Stage 1 handoff test payload is missing')
          if test_path.exists():
              raise SystemExit('Stage 1 handoff test already exists')
          test_path.write_bytes(payload_path.read_bytes())
          PY

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md .github/workflows/stage-01-atomic.yml tests/stage-01-handoff.test.mjs
          git diff --cached --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const actual = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = [
            '.github/workflows/stage-01-atomic.yml',
            'README.md',
            'tests/stage-01-handoff.test.mjs'
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected staged files: ${JSON.stringify(actual)}`);
          }
          NODE
          node --test tests/stage-01-handoff.test.mjs
          npm run verify:architecture
          npm test
          git commit -m "docs(stage1): establish Stage 1 architecture handoff"
          git push origin HEAD:rewrite/modular-rebuild
