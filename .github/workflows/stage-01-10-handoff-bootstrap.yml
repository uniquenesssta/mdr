name: Stage 1 Atomic Task 1.10 Handoff Bootstrap

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-01-10-handoff-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-handoff:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply Stage 1 README and handoff contract test
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          test_payload_path = Path('.github/stage-01-10-handoff-test.payload.mjs')
          readme_payload_path = Path('.github/stage-01-10-readme.payload.md')
          test_path = Path('tests/stage-01-handoff.test.mjs')

          missing = [
              str(path)
              for path in (test_payload_path, readme_payload_path)
              if not path.is_file()
          ]
          if missing:
              raise SystemExit(f'Missing Stage 1.10 payloads: {missing}')

          readme = readme_path.read_text(encoding='utf-8')
          anchor = '## Change Log\n'
          if readme.count(anchor) != 1:
              raise SystemExit('README Change Log anchor is not unique')
          if '## Stage 1 架构交接\n' in readme:
              raise SystemExit('README already contains Stage 1 handoff')
          handoff = readme_payload_path.read_text(encoding='utf-8')
          readme_path.write_text(
              readme.replace(anchor, handoff + anchor, 1),
              encoding='utf-8',
          )

          if test_path.exists():
              raise SystemExit('Stage 1 handoff test already exists')
          test_path.write_bytes(test_payload_path.read_bytes())
          PY

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md tests/stage-01-handoff.test.mjs
          git diff --cached --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const actual = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = ['README.md', 'tests/stage-01-handoff.test.mjs'].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected staged files: ${JSON.stringify(actual)}`);
          }
          NODE
          node --test tests/stage-01-handoff.test.mjs
          npm run verify:architecture
          npm test
          git commit -m "docs(stage1): establish Stage 1 architecture handoff"
          git push origin HEAD:rewrite/modular-rebuild
