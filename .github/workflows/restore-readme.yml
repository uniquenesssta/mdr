name: Restore README

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/restore-readme.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2
      - name: Restore README from previous commit
        shell: bash
        run: |
          git show HEAD^:README.md > README.md
          git diff --check
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "fix(docs): restore README after accidental replacement"
          git push origin "HEAD:${{ github.head_ref }}"
