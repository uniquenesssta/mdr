name: R12-10 candidate object transfer (temporary)
on:
  push:
    branches: [agent/r12-stage]
    paths: ['.github/workflows/r12-candidate.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db46e1b26eac069e3534831bcfd25c311bfa3050
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize and verify immutable candidate blobs without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          base = 'db46e1b26eac069e3534831bcfd25c311bfa3050'
          prefix = 'https://api.github.com/repos/uniquenesssta/mdr/git/blobs'
          def git_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          def request(url, body=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          elements = []
          seen = set()
          for packed_sha in ['f8b0965fc0c6d04401668db8b6c4263f139d2aca', '673a28bde11bba2bb139d1f03ce6834bb72394af', '2be50b56c1afd5176da542b3583e62879c1f014d']:
              packed = base64.b64decode(request(prefix + '/' + packed_sha)['content'])
              assert git_sha(packed) == packed_sha
              manifest = json.loads(gzip.decompress(packed))
              assert manifest['base'] == base
              for item in manifest['files']:
                  path = item['path']
                  assert path not in seen and not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
                  seen.add(path)
                  if 'content' in item:
                      data = item['content'].encode()
                  else:
                      old = subprocess.check_output(['git', 'show', base + ':' + item.get('base_path', path)])
                      assert git_sha(old) == item['base_sha'], path
                      if 'inventory' in item:
                          document = json.loads(old)
                          replacements = {row[0]: row for row in item['inventory']}
                          document['modules'] = [replacements.pop(row[0], row) for row in document['modules']] + list(replacements.values())
                          data = (json.dumps(document, ensure_ascii=False, separators=(',', ':')) + '\n').encode()
                      else:
                          lines = old.decode().splitlines(keepends=True)
                          for start, end, replacement in reversed(item['edits']):
                              assert 0 <= start <= end <= len(lines)
                              lines[start:end] = replacement
                          data = ''.join(lines).encode()
                  assert git_sha(data) == item['sha'], path
                  result = request(prefix, {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
                  assert result['sha'] == item['sha'], path
                  elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': result['sha']})
          assert len(elements) == 24
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r12-10-transfer'
          out.mkdir()
          (out / 'tree-elements.json').write_text(json.dumps(elements, ensure_ascii=False, indent=2))
          print('Verified 24 candidate blobs; no branch or commit was modified by this job.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r12-10-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/r12-10-transfer/
          if-no-files-found: error
          retention-days: 1
