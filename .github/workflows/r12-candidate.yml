name: R12-09 candidate transfer (temporary)
on:
  push:
    branches: [agent/r12-stage]
    paths: ['.github/workflows/r12-candidate.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact preparation parent and clean workspace
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 5a296257535ebf2222f8b0345ffda89f9a346310
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', 'HEAD^', 'HEAD']).decode().strip('\0').split('\0')
          assert sorted(paths) == ['.github/workflows/r12-candidate.yml', 'README.md'], paths
          PY
      - name: Reconstruct and verify the reviewed candidate without updating a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '5a296257535ebf2222f8b0345ffda89f9a346310'
          assert os.environ['GITHUB_REPOSITORY'] == 'uniquenesssta/mdr'
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          archive = bytearray()
          for sha in ['9f9abda10bb88824029fe01da9f5139c42bac6a9', '4f413194a19a07674467b110900be4807ba54ee1']:
              request = urllib.request.Request('https://api.github.com/repos/uniquenesssta/mdr/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.load(response)
              data = base64.b64decode(result['content'])
              assert result['sha'] == sha and blob_sha(data) == sha
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest() == 'db49cb78a15a7332af6e7cea4bd3bc83c236daf1f6182c749130cf575155d37a'
          patch = lzma.decompress(archive)
          assert hashlib.sha256(patch).hexdigest() == '023c4f4b4e04eb6e024fbce93904abaf690bda6c8c397c795a8cef1b9bdd397e'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'r12-09.patch').write_bytes(patch)
          # Only undo this isolated, guarded preparation note before applying its exact base.
          pathlib.Path('README.md').write_bytes(subprocess.check_output(['git', 'show', base + ':README.md']))
          inventory_path = pathlib.Path('tests/architecture/fixtures/production-modules.json')
          original = inventory_path.read_bytes()
          assert blob_sha(original) == '704f170b4d419bdb50c59956b0c239ad64252f1c'
          inventory = json.loads(original)
          record = next(row for row in inventory['modules'] if row[0] == 'src-tauri/src/external_link.rs')
          record[3] = 'External-link command and unchanged operating-system launch boundary; validation delegates to its private policy module.'
          inventory['modules'].insert(inventory['modules'].index(record) + 1, ['src-tauri/src/external_link/validation.rs', 'rust-module', 'desktop-platform', 'Pure external-link trimming, URL parsing, four-scheme admission and stable validation errors.', 'none', 'pure-call', 'retain', False])
          assert len(inventory['modules']) == 437
          updated = (json.dumps(inventory, ensure_ascii=False, separators=(',', ':')) + ('\n' if original.endswith(b'\n') else '')).encode()
          assert blob_sha(updated) == '49f54c549f7bd2106899b53f3af7ceeb9d25e70f'
          inventory_path.write_bytes(updated)
          PY
          git add README.md tests/architecture/fixtures/production-modules.json
          git apply --index --check "$RUNNER_TEMP/r12-09.patch"
          git apply --index "$RUNNER_TEMP/r12-09.patch"
          git rm .github/workflows/r12-candidate.yml
          git diff --cached --check
          test "$(git write-tree)" = f3d8352026554c17c7b83cb19ac1bceb9352f095
      - name: Recheck source contracts on the exact candidate tree
        run: |
          node --test tests/stage-12-*.test.mjs tests/historical-workflow-routing.test.mjs tests/documentation-layout.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-09-preflight.log"
          grep -Fq '# pass 64' "$RUNNER_TEMP/r12-09-preflight.log"
      - name: Publish immutable file blobs only and retain the verified manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          expected = 'f3d8352026554c17c7b83cb19ac1bceb9352f095'
          assert git('write-tree') == expected
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z', 'HEAD']).decode().strip('\0').split('\0')
          assert len(changed) == 27, changed
          entries = []
          for name in changed:
              path = pathlib.Path(name)
              if not path.exists():
                  assert name == '.github/workflows/r12-candidate.yml'
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              data = path.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert git('rev-parse', ':' + name) == sha
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/uniquenesssta/mdr/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.load(response)
              assert result['sha'] == sha, name
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          record = {'parent_head': os.environ['GITHUB_SHA'], 'base_commit': '5a296257535ebf2222f8b0345ffda89f9a346310', 'tree_sha': expected, 'entries': entries, 'preflight': '64 source contracts passed; real Rust and frontend verification pending R12-09'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'r12-09-transfer.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(record, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-09-transfer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/r12-09-transfer.json
            ${{ runner.temp }}/r12-09-preflight.log
          retention-days: 1
          if-no-files-found: error
