name: R12-11 candidate object transfer (temporary)
on:
  push:
    branches: [agent/r12-stage]
    paths: ['.github/workflows/r12-candidate.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and hash-check immutable candidate objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '3f1233585dd5359fe2a7168be8206074b30627ec'
          payload_sha = '3e69b701226d092335723ebaa98acb0eb5662324'
          expected_tree = '80d22409c0fcc0b320455e7d88fcdbf784812a77'
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'uniquenesssta/mdr'
          def api(path, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          obj = api('/git/blobs/' + payload_sha)
          packed = base64.b64decode(obj['content'])
          assert obj['encoding'] == 'base64' and blob_sha(packed) == payload_sha
          records = json.loads(lzma.decompress(packed))
          assert len(records) == 28 and len({r['path'] for r in records}) == 28
          elements = []
          for record in records:
              path = record['path']
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              original = subprocess.run(['git', 'show', base + ':' + path], capture_output=True)
              if record['before'] is None:
                  assert original.returncode != 0
                  data = record['text'].encode()
              else:
                  assert original.returncode == 0 and blob_sha(original.stdout) == record['before'], path
                  data = original.stdout
                  if 'inventory' in record:
                      inventory = json.loads(data)
                      entry = record['inventory']['entry']
                      assert sum(row[0] == entry[0] for row in inventory['modules']) == 1
                      inventory['modules'] = [entry if row[0] == entry[0] else row for row in inventory['modules']]
                      inventory['modules'].append(record['inventory']['append'])
                      data = (json.dumps(inventory, ensure_ascii=False, separators=(',', ':')) + '\n').encode()
                  else:
                      previous_end = 0
                      for start, end, text in record['edits']:
                          assert previous_end <= start <= end <= len(original.stdout)
                          previous_end = end
                      for start, end, text in reversed(record['edits']):
                          data = data[:start] + text.encode() + data[end:]
              assert blob_sha(data) == record['after'], path
              created = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert created['sha'] == record['after'], path
              elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': created['sha']})
          tree = api('/git/trees', {'base_tree': '50ecc2beb24fa9edc7870294a2a5e194655f5df1', 'tree': elements})
          assert tree['sha'] == expected_tree
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r12-11-transfer'
          evidence.mkdir()
          (evidence / 'objects.json').write_text(json.dumps({'base': base, 'tree': tree['sha'], 'elements': elements}, ensure_ascii=False, indent=2))
          print('Verified 28 candidate files; tree ' + tree['sha'] + '; no branch or tag updated')
          PY
      - name: Retain object map
        uses: actions/upload-artifact@v4
        with:
          name: r12-11-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/r12-11-transfer/
          if-no-files-found: error
          retention-days: 1
