name: R10-06 Native Snapshot Uploader

on:
  push:
    branches:
      - agent/r10-stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard R10-06 frozen contracts and uploader ownership
        shell: bash
        run: |
          set -euo pipefail
          base='bb8115614c6ccce27f3c4fcfee78b199fb971760'
          git merge-base --is-ancestor "$base" HEAD
          git diff --quiet "$base"...HEAD -- \
            src/model-kernel/index.js \
            src/document/document-model.js \
            src/sync/selection-mapping.js \
            src/preview/incremental-preview.js \
            src/preview/math-source.js \
            src/editor/hybrid/block-registry.js \
            src/editor/hybrid/math-ranges.js \
            src/editor/hybrid/ranges.js \
            src/editor/hybrid/table-model.js \
            src-tauri/src/document_store.rs \
            package.json package-lock.json
          test ! -e .agent/r10_06_apply.py
          test ! -e .github/workflows/r10-06-bootstrap.yml
          test -f src/features/persistence/native-document-store/native-save-session.js
          test -f src/features/persistence/native-document-store/native-save-queue.js
          test -f src/features/persistence/native-document-store/native-snapshot-uploader.js
          test ! -e src/features/persistence/native-document-store/native-segmented-loader.js
          test ! -e src/features/persistence/native-document-store/native-search-adapter.js
          test ! -e src/features/persistence/browser/browser-document-repository.js
          node - <<'NODE'
          const fs = require('node:fs');
          const fixture = JSON.parse(fs.readFileSync('tests/architecture/fixtures/production-modules.json', 'utf8'));
          if (!Array.isArray(fixture.modules) || fixture.modules.length !== 391) {
            throw new Error(`R10-06 production module inventory mismatch: expected 391, got ${fixture.modules?.length}`);
          }
          const required = [
            'src/features/persistence/native-document-store/native-save-session.js',
            'src/features/persistence/native-document-store/native-save-queue.js',
            'src/features/persistence/native-document-store/native-snapshot-uploader.js'
          ];
          for (const path of required) {
            if (!fixture.modules.some(record => record[0] === path)) throw new Error(`Missing Stage 10 native persistence inventory record: ${path}`);
          }
          NODE
          grep -q 'createNativeSnapshotUploader' src/storage/native-document-store.js
          ! grep -q 'saveSnapshotInChunks' src/storage/native-document-store.js
          ! grep -q 'getSafeSnapshotChunkEnd' src/storage/native-document-store.js
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: R10-06 targeted gate 11/11
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-10-native-snapshot-uploader.test.mjs | tee /tmp/r10_06_targeted.log
          grep -q '# tests 11' /tmp/r10_06_targeted.log
          grep -q '# pass 11' /tmp/r10_06_targeted.log
          grep -q '# fail 0' /tmp/r10_06_targeted.log

      - name: R10-05 queue compatibility 9/9
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-10-native-save-queue.test.mjs | tee /tmp/r10_05_compat.log
          grep -q '# tests 9' /tmp/r10_05_compat.log
          grep -q '# pass 9' /tmp/r10_05_compat.log
          grep -q '# fail 0' /tmp/r10_05_compat.log

      - name: Full Node regression 285/285
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/r10_06_node.log
          grep -q '# tests 285' /tmp/r10_06_node.log
          grep -q '# pass 285' /tmp/r10_06_node.log
          grep -q '# fail 0' /tmp/r10_06_node.log

      - name: Architecture and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          npm run verify:no-legacy-runtime
          npm run verify:generated-files
          npm run verify:readme-record

      - name: Browser preview contract 10/10
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser:contract | tee /tmp/r10_06_browser_contract.log
          grep -Fq 'Browser tests: 10, passed: 10, failed: 0' /tmp/r10_06_browser_contract.log

      - name: Production build
        run: npm run build

      - name: Built-app browser regression 29/29
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser | tee /tmp/r10_06_browser.log
          grep -Fq 'Browser tests: 29, passed: 29, failed: 0' /tmp/r10_06_browser.log

      - name: Validation must leave tracked tree clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
