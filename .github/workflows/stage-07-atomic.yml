name: R9-08 authoritative validation

on:
  push:
    branches:
      - agent/r9-08-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-08:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish clean R9-08 candidate
        shell: bash
        run: bash .agent/r9_08_validate.sh
