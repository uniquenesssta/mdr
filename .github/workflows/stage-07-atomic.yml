name: R9-09 authoritative validation

on:
  push:
    branches:
      - agent/r9-09-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-09:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish clean R9-09 candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --cached --ignore-unmatch .agent/r9_09_failure.log >/dev/null 2>&1 || true
          rm -f .agent/r9_09_failure.log
          python .agent/r9_09_prepare_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.agent/r9_09_validate.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace('R9-09：SelectionHighlightSession接管CSS多Range', 'R9-09：HighlightSession接管CSS多Range', 1)
          text = text.replace('R9-09/R9-08 16/16', 'R9-09 16/16，R9-08 16/16', 1)
          path.write_text(text, encoding='utf-8')
          PY
          set +e
          bash .agent/r9_09_validate.sh 2>&1 | tee /tmp/r9-09-validation.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .agent
            {
              echo '=== MATCHED FAILURE CONTEXT ==='
              grep -n -B 24 -A 48 -E '^not ok|failureType:|AssertionError|ERR_[A-Z_]+|^# fail [1-9]|RuntimeError|Traceback|Error:' /tmp/r9-09-validation.log || true
              echo
              echo '=== VALIDATION TAIL ==='
              tail -n 260 /tmp/r9-09-validation.log
            } > .agent/r9_09_failure.log
            git reset
            git add -f .agent/r9_09_failure.log
            GIT_AUTHOR_NAME='atomic-runner' GIT_AUTHOR_EMAIL='atomic-runner@users.noreply.github.com' \
            GIT_COMMITTER_NAME='atomic-runner' GIT_COMMITTER_EMAIL='atomic-runner@users.noreply.github.com' \
              git commit -m 'ci: capture R9-09 terminal validation failure [skip ci]'
            git push origin HEAD:refs/heads/agent/r9-09-runner
            exit "$status"
          fi
