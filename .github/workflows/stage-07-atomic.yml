name: R9-08 authoritative validation

on:
  push:
    branches:
      - agent/r9-08-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-08:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish clean R9-08 candidate
        shell: bash
        run: |
          set +e
          {
            python .agent/r9_08_prepare_fix.py
            bash .agent/r9_08_validate.sh
          } 2>&1 | tee /tmp/r9-08-validation.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .agent
            tail -n 220 /tmp/r9-08-validation.log > .agent/r9_08_failure.log
            git reset
            git add -f .agent/r9_08_failure.log
            GIT_AUTHOR_NAME='atomic-runner' GIT_AUTHOR_EMAIL='atomic-runner@users.noreply.github.com' \
            GIT_COMMITTER_NAME='atomic-runner' GIT_COMMITTER_EMAIL='atomic-runner@users.noreply.github.com' \
              git commit -m 'ci: capture R9-08 terminal validation failure [skip ci]'
            git push origin HEAD:refs/heads/agent/r9-08-runner
            exit "$status"
          fi
