name: Stage 1 Atomic Task 1.8 Documentation Commit

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-01-08-docs-commit.yml

permissions:
  contents: write

jobs:
  commit-documentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply exact README and detailed record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          payload_path = Path('.github/stage-01-08-record.payload.md')
          record_path = Path('docs/rewrite-progress/stage-01/01-08-architecture-scripts.md')
          data = readme_path.read_bytes()
          tree_anchor = 'logs/                       # 开发者性能日志目录\n'.encode('utf-8')
          changelog_anchor = b'## Change Log\n'
          tree_insert = (
              'logs/                       # 开发者性能日志目录\n'
              'scripts/\n'
              '  architecture/             # 架构事实提取、规则检查、仓库读取与 CLI 基础模块\n'
              '  verify-architecture.mjs   # 全量架构硬门禁\n'
              '  verify-no-legacy-runtime.mjs\n'
              '  verify-generated-files.mjs\n'
              '  verify-readme-record.mjs\n'
          ).encode('utf-8')
          changelog_insert = (
              '## Change Log\n'
              '<!-- stage-01-node:01-08 -->\n'
              '- 2026-08-05：阶段 1 Atomic Task 1.8（架构脚本）完成：新增模块化架构扫描器与四个独立执行入口，建立无通配豁免的精确迁移基线，逐项锁定 9 个经典脚本、184 个内联事件、38 个业务全局和 4 个既有跟踪运行产物；新增依赖方向、跨 Feature 内部导入、循环依赖、模块导入副作用、生成文件、旧后缀和 README 记录门禁。专项 run 30970380961 与完整基线 run 30970380963 全部通过，生产模块仍为 67 个，生产实现、冻结契约、依赖和用户行为未改变；Atomic Task 1.9 尚未开始。\n'
          ).encode('utf-8')

          if data.count(tree_anchor) != 1:
              raise SystemExit('README logs anchor is not unique')
          if data.count(changelog_anchor) != 1:
              raise SystemExit('README Change Log anchor is not unique')
          if b'stage-01-node:01-08' in data:
              raise SystemExit('README already contains Atomic Task 1.8 record')
          if not payload_path.is_file():
              raise SystemExit('Atomic Task 1.8 documentation payload is missing')
          if record_path.exists():
              raise SystemExit('Atomic Task 1.8 detailed record already exists')

          updated = data.replace(tree_anchor, tree_insert, 1)
          updated = updated.replace(changelog_anchor, changelog_insert, 1)
          readme_path.write_bytes(updated)
          record_path.parent.mkdir(parents=True, exist_ok=True)
          record_path.write_bytes(payload_path.read_bytes())
          payload_path.unlink()
          PY

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md docs/rewrite-progress/stage-01/01-08-architecture-scripts.md .github/stage-01-08-record.payload.md
          git diff --cached --check
          test "$(git diff --cached --name-only)" = $'.github/stage-01-08-record.payload.md\nREADME.md\ndocs/rewrite-progress/stage-01/01-08-architecture-scripts.md'
          test "$(git diff --cached --numstat README.md)" = $'8\t0\tREADME.md'
          node scripts/verify-readme-record.mjs
          node scripts/verify-architecture.mjs
          git commit -m "docs(stage1): record Atomic Task 1.8 completion"
          git push origin HEAD:rewrite/modular-rebuild
