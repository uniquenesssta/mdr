name: Sync Stage 1 Atomic Task 1.2 README

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-readme-01-02.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Update README record
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          source = path.read_text(encoding='utf-8')
          marker = '<!-- stage-01-node:01-02 -->'
          entry = (
              f'{marker}\n'
              '- 2026-08-04：阶段 1 Atomic Task 1.2（最小组合根）完成：新增纯依赖注入的 `src/app/application-context.js` 与 `src/app/create-application.js`，公开 `start()`、`destroy()`、`commands` 和 `events`，构造期间不访问 DOM、Storage、Tauri 或 Worker，也未接入现有启动链；专项验证 run 30906897816 与完整基线回归 run 30906897895 全部通过。Atomic Task 1.3 尚未开始。\n'
          )
          source = re.sub(r'<!-- stage-01-node:01-02 -->\n- [^\n]*\n', '', source)
          heading = '## Change Log'
          index = source.find(heading)
          if index < 0:
              source = source.rstrip() + '\n\n' + heading + '\n' + entry
          else:
              insert_at = source.find('\n', index + len(heading))
              insert_at = len(source) if insert_at < 0 else insert_at + 1
              source = source[:insert_at] + entry + source[insert_at:]
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit README record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "README record is already synchronized."
          else
            git commit -m "docs(stage1): record minimal composition root"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
