name: Stage 0 Caret Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-00-caret-diagnostic.yml
      - scripts/stage-00/diagnose-trailing-caret.mjs
      - scripts/stage-00/apply-trailing-active-line-boundary-fix.mjs
      - src/editor/**
      - tests/e2e/**
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: stage-00-caret-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply trailing active-line boundary fix
        run: node scripts/stage-00/apply-trailing-active-line-boundary-fix.mjs
      - name: Commit trailing active-line boundary fix
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/hybrid/inline-presentation.js
          if git diff --cached --quiet; then
            echo "Trailing active-line fix is already committed."
          else
            git diff --cached --check
            git commit -m "fix(stage0): isolate final empty caret line"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Resolve Chromium executable
        shell: bash
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo "No Chromium executable found" >&2
          exit 1
      - run: npm ci
      - run: npm run build
      - run: node scripts/stage-00/diagnose-trailing-caret.mjs
      - run: npm run test:browser
