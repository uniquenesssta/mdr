name: R12-08 candidate assembly (temporary)
on:
  push:
    branches: [agent/r12-stage]
    paths: ['.github/workflows/r12-source-snapshot.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the exact preparation parent and scope
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 0fad7178bfa83496a4774ee3ce46316c3904ea6b
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', 'HEAD^', 'HEAD']).decode().strip('\0').split('\0')
          assert sorted(changed) == ['.github/workflows/r12-source-snapshot.yml', 'README.md'], changed
          PY
      - name: Reconstruct the reviewed patch and verify the complete candidate tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'uniquenesssta/mdr'
          parts = ['bf0fa6baadc28891745a53c6cb63f761765e348f', '4253bed572bb34df3e270b19acf0c7f3e087e588', 'b6e4a16bb9cd1a72809a76660d1d05c2b0eeead8', '4647fc0305fb6de8e7c72464721b1f7dfbb0d7a5']
          archive = bytearray()
          for sha in parts:
              request = urllib.request.Request('https://api.github.com/repos/uniquenesssta/mdr/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              archive.extend(data)
          assert hashlib.sha256(archive).hexdigest() == 'b5841ce91e5cd354e8fe59de8ac775c5a06fe7bb3f4180fe5037cfcb7d13b2e2'
          patch = lzma.decompress(archive)
          assert hashlib.sha256(patch).hexdigest() == '55393dcbb3bd0a8f3e84b830586018629e5c7d706633537e0fefc857a7360435'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'r12-08.patch').write_bytes(patch)
          # Remove only the preceding, guarded preparation note before applying its exact base.
          readme = subprocess.check_output(['git', 'show', '0fad7178bfa83496a4774ee3ce46316c3904ea6b:README.md'])
          pathlib.Path('README.md').write_bytes(readme)
          PY
          git add README.md
          git apply --index --check "$RUNNER_TEMP/r12-08.patch"
          git apply --index "$RUNNER_TEMP/r12-08.patch"
          git rm .github/workflows/r12-source-snapshot.yml
          git diff --cached --check
          test "$(git write-tree)" = 5e61867039d6eeb3ccfd6f0801957b6acb062e42
      - name: Run the available source and command contract checks
        run: |
          node --test tests/stage-12-*.test.mjs tests/historical-workflow-routing.test.mjs tests/documentation-layout.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-08-preflight.log"
      - name: Publish immutable candidate objects without moving any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          expected_tree = '5e61867039d6eeb3ccfd6f0801957b6acb062e42'
          def git(*arguments):
              return subprocess.check_output(['git', *arguments]).decode().strip()
          def post(endpoint, payload):
              request = urllib.request.Request('https://api.github.com/repos/uniquenesssta/mdr/git/' + endpoint, data=json.dumps(payload).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          assert git('write-tree') == expected_tree
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z', 'HEAD']).decode().strip('\0').split('\0')
          entries = []
          for name in changed:
              path = pathlib.Path(name)
              if not path.exists():
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              data = path.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert git('rev-parse', ':' + name) == sha
              result = post('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == sha, name
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = post('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == expected_tree
          parent = os.environ['GITHUB_SHA']
          commit = post('commits', {'message': 'refactor(r12-08): isolate local file command boundary', 'tree': expected_tree, 'parents': [parent]})
          record = {'parent_head': parent, 'commit_sha': commit['sha'], 'tree_sha': expected_tree, 'branch': 'agent/r12-stage', 'patch_sha256': '55393dcbb3bd0a8f3e84b830586018629e5c7d706633537e0fefc857a7360435', 'source_contract_preflight': 'passed', 'rust_and_full_frontend_verification': 'pending R12-08 combined workflow'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'r12-08-candidate.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-08-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/r12-08-candidate.json
            ${{ runner.temp }}/r12-08-preflight.log
          retention-days: 1
          if-no-files-found: error
