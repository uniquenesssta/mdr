name: R12 source snapshot and pinned formatter (temporary)
on:
  push:
    branches: [agent/r12-stage]
    paths: ['.github/workflows/r12-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9405ab44d6bb5f05eb755a2341e3ba76b4831ed8
          fetch-depth: 1
          persist-credentials: false
      - name: Package exact baseline without credentials
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = 9405ab44d6bb5f05eb755a2341e3ba76b4831ed8
          test -z "$(git status --porcelain)"
          if git config --local --get-regexp 'http.*extraheader' >/dev/null; then exit 1; fi
          tar -czf "$RUNNER_TEMP/mdr-r12-baseline.tar.gz" .
          sha256sum "$RUNNER_TEMP/mdr-r12-baseline.tar.gz" > "$RUNNER_TEMP/mdr-r12-baseline.sha256"
      - name: Package the pinned formatter without changing the application
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          formatter="$(rustup which --toolchain 1.88.0 rustfmt)"
          toolchain="$(dirname "$(dirname "$formatter")")"
          mkdir -p "$RUNNER_TEMP/rustfmt-1.88/bin" "$RUNNER_TEMP/rustfmt-1.88/lib"
          cp "$formatter" "$RUNNER_TEMP/rustfmt-1.88/bin/rustfmt"
          while read -r library; do
            case "$library" in
              "$toolchain"/*) cp -L "$library" "$RUNNER_TEMP/rustfmt-1.88/lib/" ;;
            esac
          done < <(ldd "$formatter" | awk '/=> \/.* / {print $3}')
          LD_LIBRARY_PATH="$RUNNER_TEMP/rustfmt-1.88/lib" "$RUNNER_TEMP/rustfmt-1.88/bin/rustfmt" --version
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/mdr-rustfmt-1.88.tar.gz" rustfmt-1.88
          sha256sum "$RUNNER_TEMP/mdr-rustfmt-1.88.tar.gz" > "$RUNNER_TEMP/mdr-rustfmt-1.88.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mdr-r12-baseline-and-rustfmt-9405ab4
          path: |
            ${{ runner.temp }}/mdr-r12-baseline.tar.gz
            ${{ runner.temp }}/mdr-r12-baseline.sha256
            ${{ runner.temp }}/mdr-rustfmt-1.88.tar.gz
            ${{ runner.temp }}/mdr-rustfmt-1.88.sha256
          retention-days: 1
          if-no-files-found: error
