name: R10-09 Browser Repository

on:
  push:
    branches:
      - agent/r10-stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard R10-09 frozen contracts and browser repository ownership
        shell: bash
        run: |
          set -euo pipefail
          base='a9255cccee05fdb14e1a3a3dd3d81ca3b2b7094d'
          git merge-base --is-ancestor "$base" HEAD
          git diff --quiet "$base"...HEAD -- \
            src/model-kernel/index.js \
            src/document/document-model.js \
            src/sync/selection-mapping.js \
            src/preview/incremental-preview.js \
            src/preview/math-source.js \
            src/editor/hybrid/block-registry.js \
            src/editor/hybrid/math-ranges.js \
            src/editor/hybrid/ranges.js \
            src/editor/hybrid/table-model.js \
            src-tauri/src/document_store.rs \
            package.json package-lock.json
          test ! -e .agent/r10-09-finalize.sh
          test ! -e .github/workflows/r10-09-bootstrap.yml
          test -f src/features/persistence/browser/browser-document-repository.js
          test ! -e src/features/persistence/application/close-save-controller.js
          grep -q 'createBrowserDocumentRepository' src/features/persistence/index.js
          grep -q 'createBrowserDocumentRepository' src/main.js
          grep -q 'browserRepository: browserDocumentRepository' src/main.js
          grep -q 'browserDocumentRepository.destroy()' src/main.js
          ! grep -Eq 'md_editor_documents|md_editor_content|localStorage|storage\.setItem|bodyCache[[:space:]]*=[[:space:]]*new Map' src/features/documents/infrastructure/session-document-repository.js
          node - <<'NODE'
          const fs = require('node:fs');
          const fixture = JSON.parse(fs.readFileSync('tests/architecture/fixtures/production-modules.json', 'utf8'));
          if (!Array.isArray(fixture.modules) || fixture.modules.length < 394) {
            throw new Error(`R10-09 production module inventory regressed: expected at least 394, got ${fixture.modules?.length}`);
          }
          const path = 'src/features/persistence/browser/browser-document-repository.js';
          if (!fixture.modules.some(record => record[0] === path)) throw new Error(`Missing inventory record: ${path}`);
          NODE
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: R10-09 targeted gate 10/10
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-10-browser-document-repository.test.mjs | tee /tmp/r10_09_targeted.log
          grep -q '# tests 10' /tmp/r10_09_targeted.log
          grep -q '# pass 10' /tmp/r10_09_targeted.log
          grep -q '# fail 0' /tmp/r10_09_targeted.log

      - name: R10-08 search adapter compatibility 8/8
        run: node --test tests/stage-10-native-search-adapter.test.mjs

      - name: R10-07 segmented loader compatibility 10/10
        run: node --test tests/stage-10-native-segmented-loader.test.mjs

      - name: R10-06 snapshot uploader compatibility 11/11
        run: node --test tests/stage-10-native-snapshot-uploader.test.mjs

      - name: R10-05 save queue compatibility 9/9
        run: node --test tests/stage-10-native-save-queue.test.mjs

      - name: Documents Session Controller compatibility
        run: node --test tests/unit/documents/document-session-controller.test.mjs

      - name: Full Node regression remains green
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/r10_09_node.log
          grep -q '# fail 0' /tmp/r10_09_node.log
          pass_count="$(sed -n 's/^# pass //p' /tmp/r10_09_node.log | tail -1)"
          test "${pass_count:-0}" -ge 313

      - name: Architecture and documentation gates
        run: |
          npm run verify:architecture
          npm run verify:no-legacy-runtime
          npm run verify:generated-files
          npm run verify:readme-record

      - name: Browser preview contract 10/10
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser:contract | tee /tmp/r10_09_browser_contract.log
          grep -Fq 'Browser tests: 10, passed: 10, failed: 0' /tmp/r10_09_browser_contract.log

      - name: Production build
        run: npm run build

      - name: Built-app browser regression 29/29
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser | tee /tmp/r10_09_browser.log
          grep -Fq 'Browser tests: 29, passed: 29, failed: 0' /tmp/r10_09_browser.log

      - name: Validation must leave tracked tree clean
        run: |
          git diff --check
          git diff --exit-code
