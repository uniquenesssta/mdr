name: R12-02 Path Policy
run-name: R12-02 path policy · ${{ github.sha }}

on:
  push:
    branches: [agent/r12-stage]
    paths:
      - 'src-tauri/src/local_file.rs'
      - 'src-tauri/src/local_file/path_policy.rs'
      - 'src-tauri/tests/stage_12_security_compatibility.rs'
      - 'src-tauri/tests/fixtures/stage_12_security/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src/platform/desktop/file-system-client.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/stage-12-security-contract.test.mjs'
      - 'tests/stage-12-path-policy.test.mjs'
      - 'tests/unit/platform/file-system-client.test.mjs'
      - 'tests/historical-workflow-routing.test.mjs'
      - 'tests/architecture/**'
      - 'docs/R12-01-DETAILS.md'
      - 'docs/R12-02-DETAILS.md'
      - 'docs/README.md'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/13-*'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  frontend:
    name: Path contracts and frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-02"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 28a21e6caaa384366553663262417de2a726f8a5 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-02/commit.txt"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm run deps:prepare 2>&1 | tee "$RUNNER_TEMP/r12-02/dependencies.log"
      - name: Dependency audit hard gate
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/r12-02/npm-audit.log"
      - name: R12-02 path and adapter contracts
        run: |
          node --test \
            tests/stage-12-security-contract.test.mjs \
            tests/stage-12-path-policy.test.mjs \
            tests/unit/platform/file-system-client.test.mjs \
            tests/historical-workflow-routing.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-02/path-contracts.log"
      - name: Full Node regression
        run: npm test 2>&1 | tee "$RUNNER_TEMP/r12-02/node.log"
      - name: Architecture and documentation hard gates
        run: |
          npm run verify:architecture 2>&1 | tee "$RUNNER_TEMP/r12-02/architecture.log"
          npm run verify:no-legacy-runtime 2>&1 | tee "$RUNNER_TEMP/r12-02/no-legacy.log"
          npm run verify:generated-files 2>&1 | tee "$RUNNER_TEMP/r12-02/generated.log"
          npm run verify:readme-record 2>&1 | tee "$RUNNER_TEMP/r12-02/readme.log"
      - name: Browser preview contract
        run: npm run test:browser:contract 2>&1 | tee "$RUNNER_TEMP/r12-02/browser-contract.log"
      - name: Production build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/r12-02/build.log"
      - name: Built-app browser regression
        run: npm run test:browser 2>&1 | tee "$RUNNER_TEMP/r12-02/browser-app.log"
      - name: Validation leaves tracked sources unchanged
        run: |
          git diff --check
          git diff --exit-code
      - name: Retain frontend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-02-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-02/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Real Rust Path Policy and hard gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-02"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 28a21e6caaa384366553663262417de2a726f8a5 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-02/commit.txt"
      - name: Guard R12-02 scope provenance and dependencies
        run: |
          base='28a21e6caaa384366553663262417de2a726f8a5'
          git diff --quiet "$base"...HEAD -- \
            src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json \
            src-tauri/src/main.rs src-tauri/src/external_link.rs \
            src-tauri/src/web_fetch.rs src-tauri/src/performance_log.rs \
            src/platform/desktop/file-system-client.js
          test -f src-tauri/src/local_file.rs
          test -f src-tauri/src/local_file/path_policy.rs
          grep -Fq 'mod path_policy;' src-tauri/src/local_file.rs
          test "$(grep -El 'fn resolve_local_image_path' src-tauri/src/local_file.rs src-tauri/src/local_file/path_policy.rs | wc -l)" -eq 1
          git diff --check
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pin Rust 1.88 with Clippy and rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo --version
      - name: Rust formatting
        run: |
          sed -n '/^\/\/ R12-01 rustfmt boundary/,$p' src-tauri/src/local_file.rs \
            > "$RUNNER_TEMP/r12-02/local-file-stage-12.rs"
          rustfmt --edition 2021 --check --config max_width=120 \
            src-tauri/src/local_file/path_policy.rs \
            src-tauri/tests/stage_12_security_compatibility.rs \
            "$RUNNER_TEMP/r12-02/local-file-stage-12.rs" \
            2>&1 | tee "$RUNNER_TEMP/r12-02/rustfmt.log"
      - name: R12-02 direct Path Policy tests 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor path_policy::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-02/rust-path-policy.log"
          grep -Fq 'test result: ok. 10 passed; 0 failed' "$RUNNER_TEMP/r12-02/rust-path-policy.log"
      - name: R12-01 direct behavior regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor stage_12_ \
            2>&1 | tee "$RUNNER_TEMP/r12-02/rust-production-contracts.log"
          grep -Fq 'test result: ok. 10 passed; 0 failed' "$RUNNER_TEMP/r12-02/rust-production-contracts.log"
      - name: R12-01 independent compatibility fixture 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test stage_12_security_compatibility \
            2>&1 | tee "$RUNNER_TEMP/r12-02/rust-fixture.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-02/rust-fixture.log"
      - name: Full Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-02/rust-tests.log"
      - name: Full Clippy warnings-denied gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/r12-02/clippy.log"
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-02/cargo-check.log"
      - name: Validation leaves tracked sources unchanged
        run: |
          git diff --check
          git diff --exit-code
      - name: Retain Rust evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-02-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-02/
          if-no-files-found: error
          retention-days: 14
