name: Apply Atomic 3.4

on:
  push:
    branches:
      - rewrite/modular-rebuild

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: apply-atomic-3-4
  cancel-in-progress: false

jobs:
  apply-or-finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_NAME: rewrite/modular-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Decode Atomic Task implementation
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/stage-03/atomic-3-4-payload/*.part > /tmp/atomic-3-4-payload.b64
          echo 'f6a00c69eedc3a9e8a37ef66c269864ad8f99c62274da6b234aaf9caec9468de  /tmp/atomic-3-4-payload.b64' | sha256sum -c -
          base64 -d /tmp/atomic-3-4-payload.b64 > /tmp/atomic-3-4-payload.gz
          echo 'bf5302507df7033afb77f5e314d162083519115f6c44d5521edd57d7ad9c9871  /tmp/atomic-3-4-payload.gz' | sha256sum -c -
          gzip -d -c /tmp/atomic-3-4-payload.gz > /tmp/apply-atomic-3-4.mjs
          echo 'e7e117e950ff4586eaa28544c5d1e137baac732464b0d25a34a6aa979c916640  /tmp/apply-atomic-3-4.mjs' | sha256sum -c -
          node --check /tmp/apply-atomic-3-4.mjs
      - name: Inspect Atomic Task state
        id: state
        shell: bash
        run: |
          STATE=$(node /tmp/apply-atomic-3-4.mjs status)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "$STATE"
      - name: Install frontend dependencies for implementation
        if: ${{ !contains(steps.state.outputs.state, '"implemented":true') }}
        run: npm ci
      - name: Apply Atomic Task 3.4 source changes
        if: ${{ !contains(steps.state.outputs.state, '"implemented":true') }}
        run: node /tmp/apply-atomic-3-4.mjs apply
      - name: Verify implementation before commit
        if: ${{ !contains(steps.state.outputs.state, '"implemented":true') }}
        shell: bash
        run: |
          set -euo pipefail
          node --check src/platform/desktop/dialog-client.js
          node --check src/runtime/tauri.js
          node --check tests/unit/platform/dialog-client.test.mjs
          node --check scripts/stage-03/record-platform-evidence.mjs
          node --test --test-name-pattern='^(Atomic Task 3\.4 normalizes|file and directory cancellation|save-file normalization|confirmation delegates|native dialog errors|invalid dialog client|the desktop dialog client|legacy runtime delegates)' tests/unit/platform/dialog-client.test.mjs
          git diff --check
      - name: Commit and push Atomic Task implementation
        if: ${{ !contains(steps.state.outputs.state, '"implemented":true') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/stage-03/record-platform-evidence.mjs \
            src/platform/index.js \
            src/platform/desktop/dialog-client.js \
            src/runtime/tauri.js \
            tests/architecture/fixtures/production-modules.json \
            tests/stage-01-handoff.test.mjs \
            tests/unit/platform/platform-ports.test.mjs \
            tests/unit/platform/platform-detection.test.mjs \
            tests/unit/platform/invoke-client.test.mjs \
            tests/unit/platform/dialog-client.test.mjs
          git diff --cached --check
          git commit -m "feat(platform): complete atomic task 3.4 dialog client"
          git push origin HEAD:"$BRANCH_NAME"
      - name: Check whether Stage 3 workflow is ready
        if: ${{ contains(steps.state.outputs.state, '"implemented":true') && !contains(steps.state.outputs.state, '"documented":true') }}
        id: workflow
        shell: bash
        run: |
          if grep -q "Verify Atomic Task 3.4 dialog client" .github/workflows/stage-03-atomic.yml; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for Stage 0 through Stage 3 verification
        if: ${{ steps.workflow.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          REQUIRED=(
            "Stage 0 Baseline Verification"
            "Stage 1 Atomic Verification"
            "Stage 2 Atomic Verification"
            "Stage 3 Atomic Verification"
          )
          for attempt in $(seq 1 180); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" > /tmp/all-runs.json
            set +e
            node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/all-runs.json', 'utf8'));
          const required = new Set([
            'Stage 0 Baseline Verification',
            'Stage 1 Atomic Verification',
            'Stage 2 Atomic Verification',
            'Stage 3 Atomic Verification'
          ]);
          const latest = new Map();
          for (const run of data.workflow_runs) {
            if (!required.has(run.name)) continue;
            const previous = latest.get(run.name);
            if (!previous || run.id > previous.id) latest.set(run.name, run);
          }
          const failures = [...latest.values()].filter(run => run.status === 'completed' && run.conclusion !== 'success');
          if (failures.length) {
            console.error(JSON.stringify(failures.map(run => ({ name: run.name, id: run.id, conclusion: run.conclusion }))));
            process.exit(2);
          }
          const ready = required.size === latest.size && [...latest.values()].every(run => run.status === 'completed' && run.conclusion === 'success');
          if (!ready) process.exit(1);
          fs.writeFileSync('/tmp/atomic-3-4-runs.json', JSON.stringify([...latest.values()]));
          NODE
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              break
            fi
            if [ "$STATUS" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done
          test -s /tmp/atomic-3-4-runs.json
          STAGE3_ID=$(node -e "const r=require('/tmp/atomic-3-4-runs.json'); console.log(r.find(x=>x.name==='Stage 3 Atomic Verification').id)")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE3_ID/artifacts" > /tmp/stage3-artifacts.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/stage3-artifacts.json', 'utf8'));
          const artifact = data.artifacts.find(item => item.name.startsWith('stage-03-platform-foundation-'));
          if (!artifact) process.exit(1);
          fs.writeFileSync('/tmp/atomic-3-4-artifact.json', JSON.stringify(artifact));
          NODE
      - name: Finalize README and progress record
        if: ${{ steps.workflow.outputs.ready == 'true' }}
        run: node /tmp/apply-atomic-3-4.mjs finalize /tmp/atomic-3-4-runs.json /tmp/atomic-3-4-artifact.json
      - name: Commit finalized verification record
        if: ${{ steps.workflow.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/rewrite-progress/stage-03/03-04-dialog-client.md
          git diff --cached --check
          git commit -m "docs(platform): record atomic task 3.4 verification [skip ci]"
          git push origin HEAD:"$BRANCH_NAME"
