name: Finalize Atomic 3.3 Record

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/apply-atomic-3-3.yml

permissions:
  contents: write

concurrency:
  group: finalize-atomic-3-3-record
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      BRANCH_NAME: rewrite/modular-rebuild
      IMPLEMENTATION_SHA: 9f0fd626b4641a2ff65f290c03db66b8aebbce41
      STAGE0_RUN_ID: '31099246681'
      STAGE1_RUN_ID: '31099246710'
      STAGE2_RUN_ID: '31099246709'
      STAGE3_RUN_ID: '31099246731'
      STAGE3_ARTIFACT_NAME: stage-03-platform-foundation-31099246731-1
      STAGE3_ARTIFACT_ID: '8966773990'
      STAGE3_ARTIFACT_DIGEST: sha256:2f268facc4a9ddc1a820bcc2850f8f1907769b6dba1a6e2d23b7b82cd0b00d50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - name: Decode finalizer
        run: cat scripts/stage-03/atomic-3-3-payload/*.part | base64 -d | gzip -d > /tmp/apply-atomic-3-3.mjs
      - name: Finalize verified record
        run: node /tmp/apply-atomic-3-3.mjs finalize
      - name: Preserve temporary transport until connector cleanup
        run: git restore --source=HEAD --worktree .github/workflows/apply-atomic-3-3.yml scripts/stage-03/atomic-3-3-payload
      - name: Commit README and progress record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/rewrite-progress/stage-03/03-03-invoke-client.md
          git diff --cached --check
          git commit -m "docs(platform): record atomic task 3.3 verification [skip ci]"
          git push origin HEAD:"$BRANCH_NAME"
