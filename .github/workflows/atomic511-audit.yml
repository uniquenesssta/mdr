name: Atomic 5.11 Audit

on:
  push:
    branches:
      - agent/atomic511-candidate

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Atomic 5.10 baseline
        run: |
          node --test tests/unit/editor/editor-command-service.test.mjs
          node --test tests/architecture/stage-05-basic-command-boundary.test.mjs
          node --test tests/unit/editor/editor-history-adapter.test.mjs
          node --test tests/architecture/stage-05-history-authority.test.mjs
      - name: Verify Atomic 5.11 Find Replace
        run: |
          node --test tests/unit/editor/find-replace-command.test.mjs
          node --test tests/architecture/stage-05-find-replace-boundary.test.mjs
      - name: Locate legacy Find Replace ownership
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Find/Replace symbols ==='
          grep -RniE 'openFindModal|closeFindModal|findNext|findPrevious|replaceCurrent|replaceAll|find-modal|find-input|replace-input|find-count|findMatches|findIndex' public src tests || true
          echo '=== Candidate function blocks ==='
          grep -nE 'function .*([Ff]ind|[Rr]eplace)|let .*([Ff]ind|[Rr]eplace)|const .*([Ff]ind|[Rr]eplace)' public/app/*.js || true
          echo '=== Existing editor adapter search-capable API ==='
          grep -RniE 'sliceText|getTextLength|getSelection|setSelection|replaceRange|replaceAllText|findText' src/features/editor src/editor/virtual-editor.js | head -n 240 || true
      - name: Verify frozen DocumentModel hash
        run: test "$(git hash-object src/document/document-model.js)" = "d767d9025be05a6f6b87d7cd3527782db1c3303a"
