name: Atomic 5.11 Audit

on:
  push:
    branches:
      - agent/atomic511-candidate

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Materialize Atomic 5.11 cutover
        run: node .github/scripts/atomic511-materialize.mjs
      - name: Commit materialized candidate when needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add public/app/web-clipper.js tests/architecture/fixtures/production-modules.json tests/stage-01-handoff.test.mjs
          if git diff --cached --quiet; then
            echo 'Atomic 5.11 candidate already materialized.'
            exit 0
          fi
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git commit -m 'materialize Atomic 5.11 Find Replace cutover'
          git push origin HEAD:agent/atomic511-candidate
      - name: Verify Atomic 5.10 baseline
        run: |
          node --test tests/unit/editor/editor-command-service.test.mjs
          node --test tests/architecture/stage-05-basic-command-boundary.test.mjs
          node --test tests/unit/editor/editor-history-adapter.test.mjs
          node --test tests/architecture/stage-05-history-authority.test.mjs
      - name: Verify Atomic 5.11 Find Replace
        run: |
          node --test tests/unit/editor/find-replace-command.test.mjs
          node --test tests/architecture/stage-05-find-replace-boundary.test.mjs
      - name: Verify frozen DocumentModel hash
        run: test "$(git hash-object src/document/document-model.js)" = "d767d9025be05a6f6b87d7cd3527782db1c3303a"
      - name: Run architecture gate
        run: npm run verify:architecture
      - name: Run Node regression
        run: npm test
      - name: Verify candidate diff cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
