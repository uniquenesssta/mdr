name: Apply Atomic 3.5

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/apply-atomic-3-5.yml

permissions:
  contents: write

concurrency:
  group: apply-atomic-3-5
  cancel-in-progress: false

jobs:
  fix-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Correct and verify Stage 3 window evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          path = 'scripts/stage-03/record-platform-evidence.mjs'
          source = open(path, encoding='utf-8').read()
          old_count = "if (windowCalls.length !== 10 || windowDisposals.join(',') !== 'close,resize') process.exit(1);"
          new_count = "if (windowCalls.length !== 9 || windowDisposals.join(',') !== 'close,resize') process.exit(1);"
          old_handlers = "if (windowCalls[4].handler !== resizeHandler || windowCalls[5].handler !== closeHandler) process.exit(1);"
          new_handlers = "if (windowCalls[5].handler !== resizeHandler || windowCalls[6].handler !== closeHandler) process.exit(1);"
          if source.count(old_count) != 1 or source.count(old_handlers) != 1:
              raise SystemExit('Atomic 3.5 evidence assertions no longer match the analyzed source')
          source = source.replace(old_count, new_count).replace(old_handlers, new_handlers)
          open(path, 'w', encoding='utf-8').write(source)
          PY
          node --check scripts/stage-03/record-platform-evidence.mjs
          rm -rf artifacts/stage-03
          node scripts/stage-03/record-platform-evidence.mjs
          test -f artifacts/stage-03/03-05-window-client-evidence.json
          git diff --check
      - name: Commit evidence correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage-03/record-platform-evidence.mjs
          git diff --cached --check
          git commit -m "fix(platform): correct atomic 3.5 evidence sample"
          git push origin HEAD:rewrite/modular-rebuild
