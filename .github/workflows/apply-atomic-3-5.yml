name: Apply Atomic 3.5

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/apply-atomic-3-5.yml

permissions:
  contents: write

concurrency:
  group: apply-atomic-3-5
  cancel-in-progress: false

jobs:
  finalize-record:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - name: Write verified documentation
        run: node scripts/stage-03/finalize-atomic-3-5.mjs
      - name: Commit verified documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/rewrite-progress/stage-03/03-05-window-client.md
          git diff --cached --check
          git commit -m "docs(platform): record atomic task 3.5 verification [skip ci]"
          git push origin HEAD:rewrite/modular-rebuild
