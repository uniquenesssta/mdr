name: Finalize Atomic 3.2 Record

on:
  push:
    branches:
      - rewrite/modular-rebuild

permissions:
  contents: write

concurrency:
  group: finalize-atomic-3-2-record
  cancel-in-progress: false

jobs:
  finalize-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - name: Finalize README and progress record
        run: node scripts/stage-03/finalize-atomic-3-2-record.mjs
      - name: Commit finalized record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/rewrite-progress/stage-03/03-02-runtime-capabilities.md
          git diff --cached --check
          git commit -m "docs(platform): finalize atomic task 3.2 verification"
          git push origin HEAD:rewrite/modular-rebuild
