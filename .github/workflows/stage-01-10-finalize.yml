name: Stage 1 Atomic Task 1.10 Finalize

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-01-10-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply exact completion record and contract
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          test_path = Path('tests/stage-01-handoff.test.mjs')
          record_path = Path('docs/rewrite-progress/stage-01/01-10-stage-01-handoff.md')

          if not record_path.is_file():
              raise SystemExit('Atomic Task 1.10 detailed record is missing')

          readme = readme_path.read_text(encoding='utf-8')
          anchor = '## Change Log\n'
          marker = '<!-- stage-01-node:01-10 -->'
          entry = (
              '## Change Log\n'
              '<!-- stage-01-node:01-10 -->\n'
              '- 2026-08-05：阶段 1 Atomic Task 1.10（README 与架构交接）完成：新增 `## Stage 1 架构交接`，公开阶段 2 可依赖的组合根、生命周期、资源清理、命令、事件与冻结模型入口，明确单一状态所有者、依赖方向、精确迁移基线、删除候选和已知限制；新增交接契约测试与结构化 CI 证据。专项 run 30986994815 与完整基线 run 30986994863 全部通过，生产模块仍为 67 个，生产启动链、业务行为、冻结契约、依赖和锁文件未改变；阶段 1 已完成，阶段 2 尚未开始。\n'
          )
          if readme.count(anchor) != 1:
              raise SystemExit('README Change Log anchor is not unique')
          if marker in readme:
              raise SystemExit('README already contains Atomic Task 1.10 marker')
          readme_path.write_text(readme.replace(anchor, entry, 1), encoding='utf-8')

          test_text = test_path.read_text(encoding='utf-8')
          contract_name = "test('Stage 1 completion record is grounded in verified artifacts'"
          if contract_name in test_text:
              raise SystemExit('Stage 1 completion contract already exists')
          append = r'''

test('Stage 1 completion record is grounded in verified artifacts', async () => {
  const readme = await readText('README.md');
  assert.equal((readme.match(/<!-- stage-01-node:01-10 -->/g) || []).length, 1);
  assert.match(readme, /30986994815/);
  assert.match(readme, /30986994863/);
  assert.match(readme, /阶段 1 已完成，阶段 2 尚未开始/);

  const record = await readText('docs/rewrite-progress/stage-01/01-10-stage-01-handoff.md');
  for (const statement of [
    '结果：**通过**',
    '阶段 1 已完成；阶段 2 尚未开始',
    '30986994815',
    '8922490798',
    'sha256:8b8f93b82d14ee49b8b8cd9e586299f82ac74acb34cd0697954da66174e80e15',
    '30986994863',
    '8922713210',
    'sha256:07e4037f5d63bf7b42c5d2b3f7970e5e2ad6e51f7a4e6c2e40bb2cf15fdb4109',
    'Windows 原生路径仍需要真实平台回归',
    '2 个 audit advisory'
  ]) {
    assert.match(record, new RegExp(statement.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
  }
});
'''
          test_path.write_text(test_text.rstrip() + append, encoding='utf-8')
          PY

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md tests/stage-01-handoff.test.mjs
          git diff --cached --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const actual = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = ['README.md', 'tests/stage-01-handoff.test.mjs'].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected staged files: ${JSON.stringify(actual)}`);
          }
          const readmeStat = execFileSync('git', ['diff', '--cached', '--numstat', '--', 'README.md'], { encoding: 'utf8' }).trim();
          if (readmeStat !== '2\t0\tREADME.md') {
            throw new Error(`Unexpected README numstat: ${JSON.stringify(readmeStat)}`);
          }
          NODE
          node --test tests/stage-01-handoff.test.mjs
          npm run verify:readme-record
          npm run verify:architecture
          npm test
          git commit -m "docs(stage1): complete Atomic Task 1.10 handoff"
          git push origin HEAD:rewrite/modular-rebuild
