name: Apply Stage 1 Atomic Task 1.5 Source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-apply-01-05-source.yml

permissions:
  contents: write

jobs:
  apply-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Reuse generated source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/stage-01-apply-01-05.yml').read_text(encoding='utf-8')
          task = '      - name: Apply command infrastructure\n'
          start = source.index(task)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('      - name: Commit command infrastructure\n', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          Path('/tmp/apply-command-infrastructure.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-command-infrastructure.sh
          git checkout -- .github/workflows/stage-01-atomic.yml
      - name: Commit source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/commands tests/architecture/command-bus.test.mjs tests/architecture/fixtures/production-modules.json
          git diff --cached --check
          git commit -m "feat(stage1): add command registry and command bus"
          git push origin "HEAD:${{ github.head_ref }}"
