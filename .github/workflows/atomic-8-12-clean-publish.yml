name: Atomic 8.12 Clean Publish

on:
  push:
    branches:
      - agent/atomic-8.12-runner

permissions:
  contents: write

jobs:
  verify-candidate:
    if: ${{ !contains(github.event.head_commit.message, 'test: validate Atomic 8.12 candidate') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard formal Atomic 8.11 baseline
        shell: bash
        run: |
          set -euo pipefail
          expected='d65c49ea9115045bce631858680d622f1838b0cd'
          actual="$(git ls-remote origin refs/heads/rewrite/stage-08 | awk '{print $1}')"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$expected" HEAD
          grep -q 'class MermaidBlockWidget' src/editor/hybrid/widgets.js
          test ! -e src/features/hybrid-editor/widgets/mermaid/mermaid-widget.js
          test ! -e src/features/hybrid-editor/widgets/mermaid/mermaid-render-state.js
          test ! -e src/features/hybrid-editor/widgets/mermaid/mermaid-actions.js
          test ! -e src/features/hybrid-editor/widgets/html/html-block-widget.js
          test ! -e src/features/hybrid-editor/widgets/html/html-block-view.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Reconstruct Atomic 8.12 patch helper
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/atomic_8_12_apply.b64.* > /tmp/atomic_8_12_apply.b64
          echo 'f8246c5e93a57313be8d3d6a0053b9a284ed1040dac0693adfeef109e39d25fa  /tmp/atomic_8_12_apply.b64' | sha256sum -c -
          base64 -d /tmp/atomic_8_12_apply.b64 > /tmp/atomic_8_12_apply.py
          echo 'dd8c32289b8b2c049b5eef60532f88024f3c69e9772aca7532afbe416b28ce5c  /tmp/atomic_8_12_apply.py' | sha256sum -c -
          python -m py_compile /tmp/atomic_8_12_apply.py

      - name: Apply Atomic 8.12 candidate
        run: python /tmp/atomic_8_12_apply.py

      - name: Candidate diff integrity
        shell: bash
        run: |
          set -euo pipefail
          baseline='d65c49ea9115045bce631858680d622f1838b0cd'
          git diff --check
          ! grep -q 'class MermaidBlockWidget' src/editor/hybrid/widgets.js
          ! grep -q 'renderHybridMermaid' src/editor/hybrid/widgets.js
          grep -q 'createMermaidBlockWidgetType' src/editor/hybrid/controller.js
          grep -q 'renderMermaidDiagram' src/editor/hybrid/controller.js
          grep -q 'getMermaidTheme' src/editor/hybrid/controller.js
          test -e src/features/hybrid-editor/widgets/mermaid/mermaid-widget.js
          test -e src/features/hybrid-editor/widgets/mermaid/mermaid-render-state.js
          test -e src/features/hybrid-editor/widgets/mermaid/mermaid-actions.js
          test ! -e src/features/hybrid-editor/widgets/html/html-block-widget.js
          test ! -e src/features/hybrid-editor/widgets/html/html-block-view.js
          test -z "$(git diff --name-only "$baseline" -- package.json package-lock.json src-tauri src/document/document-model.js src/editor/hybrid/math-ranges.js src/editor/hybrid/table-model.js src/editor/hybrid/block-registry.js src/model-kernel/index.js src/features/preview/render/presentation/mermaid-presentation.js)"
          node -e "const x=require('./tests/architecture/fixtures/production-modules.json'); if(x.modules.length!==363) process.exit(1)"

      - name: Atomic 8.12 behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-08-hybrid-mermaid.test.mjs | tee /tmp/atomic-8-12-behavior.tap
          grep -q '# tests 7' /tmp/atomic-8-12-behavior.tap
          grep -q '# pass 7' /tmp/atomic-8-12-behavior.tap
          grep -q '# fail 0' /tmp/atomic-8-12-behavior.tap

      - name: Atomic 8.12 architecture tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/architecture/stage-08-hybrid-mermaid.test.mjs | tee /tmp/atomic-8-12-architecture.tap
          grep -q '# tests 6' /tmp/atomic-8-12-architecture.tap
          grep -q '# pass 6' /tmp/atomic-8-12-architecture.tap
          grep -q '# fail 0' /tmp/atomic-8-12-architecture.tap

      - name: Stage 8 regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-08*.test.mjs tests/architecture/stage-08*.test.mjs | tee /tmp/stage-08.tap
          grep -q '# tests 140' /tmp/stage-08.tap
          grep -q '# pass 140' /tmp/stage-08.tap
          grep -q '# fail 0' /tmp/stage-08.tap

      - name: Node regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/node-regression.tap
          grep -q '# tests 130' /tmp/node-regression.tap
          grep -q '# pass 130' /tmp/node-regression.tap
          grep -q '# fail 0' /tmp/node-regression.tap

      - name: Architecture hard gate
        run: npm run verify:architecture

      - name: Browser interaction contract
        run: npm run test:browser:contract

      - name: Production build
        run: npm run build

      - name: Built-app browser regression
        run: npm run test:browser

      - name: Final diff and scope audit
        shell: bash
        run: |
          set -euo pipefail
          baseline='d65c49ea9115045bce631858680d622f1838b0cd'
          git diff --check
          test -z "$(git diff --name-only "$baseline" -- package.json package-lock.json src-tauri src/document/document-model.js src/editor/hybrid/math-ranges.js src/editor/hybrid/table-model.js src/editor/hybrid/block-registry.js src/model-kernel/index.js src/features/preview/render/presentation/mermaid-presentation.js)"
          test ! -e src/features/hybrid-editor/widgets/html/html-block-widget.js
          test ! -e src/features/hybrid-editor/widgets/html/html-block-view.js
          while IFS= read -r path; do
            case "$path" in
              .agent/atomic_8_12_apply.b64.*|.github/workflows/atomic-8-12-clean-publish.yml|README.md|src/editor/hybrid/controller.js|src/editor/hybrid/widgets.js|src/features/hybrid-editor/index.js|src/features/hybrid-editor/widgets/mermaid/mermaid-widget.js|src/features/hybrid-editor/widgets/mermaid/mermaid-render-state.js|src/features/hybrid-editor/widgets/mermaid/mermaid-actions.js|tests/architecture/fixtures/production-modules.json|tests/architecture/stage-08-*.test.mjs|tests/browser-e2e-contract.test.mjs|tests/hybrid-component-contract.test.mjs|tests/presentation-renderer-contract.test.mjs|tests/stage-01-handoff.test.mjs|tests/stage-08-hybrid-state-machine-freeze.test.mjs|tests/stage-08-hybrid-mermaid.test.mjs)
                ;;
              *)
                echo "Unexpected Atomic 8.12 path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$baseline")
          grep -q 'Atomic 8.12' README.md
          grep -q '13/13' README.md
          grep -q 'Stage 8 140/140' README.md
          grep -q 'Node 130/130' README.md

      - name: Commit validated candidate on runner branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name atomic-runner
          git config user.email atomic-runner@users.noreply.github.com
          git add -A
          git commit -m 'test: validate Atomic 8.12 candidate'
          git push origin HEAD:agent/atomic-8.12-runner
