name: R12-06 Local File Directory Tree
run-name: R12-06 local file directory tree · ${{ github.sha }}

on:
  push:
    branches: [agent/r12-stage]
    paths:
      - 'src-tauri/src/local_file.rs'
      - 'src-tauri/src/local_file/binary_writer.rs'
      - 'src-tauri/src/local_file/directory_tree.rs'
      - 'src-tauri/src/local_file/file_kind.rs'
      - 'src-tauri/src/local_file/image_reader.rs'
      - 'src-tauri/src/local_file/path_policy.rs'
      - 'src-tauri/src/local_file/text_reader.rs'
      - 'src-tauri/src/local_file/text_writer.rs'
      - 'src-tauri/tests/stage_12_security_compatibility.rs'
      - 'src-tauri/tests/fixtures/stage_12_security/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src/platform/desktop/file-system-client.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/stage-12-security-contract.test.mjs'
      - 'tests/stage-12-path-policy.test.mjs'
      - 'tests/stage-12-file-kind.test.mjs'
      - 'tests/stage-12-readers.test.mjs'
      - 'tests/stage-12-writers.test.mjs'
      - 'tests/stage-12-directory-tree.test.mjs'
      - 'tests/unit/platform/file-system-client.test.mjs'
      - 'tests/historical-workflow-routing.test.mjs'
      - 'tests/architecture/**'
      - 'docs/R12-01-DETAILS.md'
      - 'docs/R12-02-DETAILS.md'
      - 'docs/R12-03-DETAILS.md'
      - 'docs/R12-04-DETAILS.md'
      - 'docs/R12-05-DETAILS.md'
      - 'docs/R12-06-DETAILS.md'
      - 'docs/README.md'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/13-*'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  frontend:
    name: Directory Tree contracts and frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-06"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 50a827359705577bc978cf5e421bcb2930a44f13 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-06/commit.txt"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm run deps:prepare 2>&1 | tee "$RUNNER_TEMP/r12-06/dependencies.log"
      - name: Dependency audit hard gate
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/r12-06/npm-audit.log"
      - name: R12-06 Directory Tree and compatibility contracts
        run: |
          node --test \
            tests/stage-12-security-contract.test.mjs \
            tests/stage-12-path-policy.test.mjs \
            tests/stage-12-file-kind.test.mjs \
            tests/stage-12-readers.test.mjs \
            tests/stage-12-writers.test.mjs \
            tests/stage-12-directory-tree.test.mjs \
            tests/unit/platform/file-system-client.test.mjs \
            tests/historical-workflow-routing.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-06/directory-tree-contracts.log"
      - name: Full Node regression
        run: npm test 2>&1 | tee "$RUNNER_TEMP/r12-06/node.log"
      - name: Architecture and documentation hard gates
        run: |
          npm run verify:architecture 2>&1 | tee "$RUNNER_TEMP/r12-06/architecture.log"
          npm run verify:no-legacy-runtime 2>&1 | tee "$RUNNER_TEMP/r12-06/no-legacy.log"
          npm run verify:generated-files 2>&1 | tee "$RUNNER_TEMP/r12-06/generated.log"
          npm run verify:readme-record 2>&1 | tee "$RUNNER_TEMP/r12-06/readme.log"
      - name: Browser preview contract
        run: npm run test:browser:contract 2>&1 | tee "$RUNNER_TEMP/r12-06/browser-contract.log"
      - name: Production build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/r12-06/build.log"
      - name: Built-app browser regression
        run: npm run test:browser 2>&1 | tee "$RUNNER_TEMP/r12-06/browser-app.log"
      - name: Validation leaves tracked sources unchanged
        run: |
          git diff --check
          git diff --exit-code
      - name: Retain frontend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-06-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-06/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Real Rust Directory Tree and hard gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-06"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 50a827359705577bc978cf5e421bcb2930a44f13 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-06/commit.txt"
      - name: Guard R12-06 scope provenance dependencies and ownership
        run: |
          base='50a827359705577bc978cf5e421bcb2930a44f13'
          git diff --quiet "$base"...HEAD -- \
            src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json \
            src-tauri/src/main.rs src-tauri/src/external_link.rs \
            src-tauri/src/web_fetch.rs src-tauri/src/performance_log.rs \
            src-tauri/src/local_file/path_policy.rs src-tauri/src/local_file/file_kind.rs \
            src-tauri/src/local_file/text_reader.rs src-tauri/src/local_file/image_reader.rs \
            src-tauri/src/local_file/text_writer.rs src-tauri/src/local_file/binary_writer.rs \
            src/platform/desktop/file-system-client.js
          test -f src-tauri/src/local_file.rs
          test -f src-tauri/src/local_file/directory_tree.rs
          test ! -e src-tauri/src/local_file/tree_limits.rs
          grep -Fq 'mod directory_tree;' src-tauri/src/local_file.rs
          grep -Fq 'const MAX_FILE_TREE_DEPTH: usize = 24;' src-tauri/src/local_file.rs
          grep -Fq 'const MAX_FILE_TREE_ENTRIES: usize = 12_000;' src-tauri/src/local_file.rs
          sed '/^#\[cfg(test)\]/,$d' src-tauri/src/local_file.rs \
            > "$RUNNER_TEMP/r12-06/local-file-production.rs"
          sed '/^#\[cfg(test)\]/,$d' src-tauri/src/local_file/directory_tree.rs \
            > "$RUNNER_TEMP/r12-06/directory-tree-production.rs"
          ! grep -Eq 'fs::read_dir|File::open|fn compare_tree_nodes|fn scan_text_file_tree_directory' \
            "$RUNNER_TEMP/r12-06/local-file-production.rs"
          ! grep -Eq '#\[tauri::command\]|performance_log|measure_sync|tauri_plugin_dialog|dialog::|FileDialog|fs::write|base64|general_purpose' \
            "$RUNNER_TEMP/r12-06/directory-tree-production.rs"
          ! grep -Eq 'const MAX_FILE_TREE|12_000|\b24\b' \
            "$RUNNER_TEMP/r12-06/directory-tree-production.rs"
          grep -Fq 'TreeEntryPolicy::Skip => continue' \
            "$RUNNER_TEMP/r12-06/directory-tree-production.rs"
          test "$(grep -El 'fn build_text_file_tree' src-tauri/src/local_file.rs \
            src-tauri/src/local_file/directory_tree.rs | wc -l)" -eq 1
          test "$(grep -El 'fn scan_text_file_tree_directory' src-tauri/src/local_file.rs \
            src-tauri/src/local_file/directory_tree.rs | wc -l)" -eq 1
          git diff --check
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pin Rust 1.88 with Clippy and rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo --version
      - name: Rust formatting
        run: |
          sed -n '/^\/\/ R12-01 rustfmt boundary/,$p' src-tauri/src/local_file.rs \
            > "$RUNNER_TEMP/r12-06/local-file-stage-12.rs"
          rustfmt --edition 2021 --check --config max_width=120 \
            src-tauri/src/local_file/binary_writer.rs \
            src-tauri/src/local_file/directory_tree.rs \
            src-tauri/src/local_file/file_kind.rs \
            src-tauri/src/local_file/image_reader.rs \
            src-tauri/src/local_file/path_policy.rs \
            src-tauri/src/local_file/text_reader.rs \
            src-tauri/src/local_file/text_writer.rs \
            src-tauri/tests/stage_12_security_compatibility.rs \
            "$RUNNER_TEMP/r12-06/local-file-stage-12.rs" \
            2>&1 | tee "$RUNNER_TEMP/r12-06/rustfmt.log"
      - name: R12-06 direct Directory Tree tests 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::directory_tree::tests 2>&1 | tee "$RUNNER_TEMP/r12-06/rust-directory-tree.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-directory-tree.log"
      - name: R12-05 direct Writer regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::text_writer::tests 2>&1 | tee "$RUNNER_TEMP/r12-06/rust-text-writer.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-text-writer.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::binary_writer::tests 2>&1 | tee "$RUNNER_TEMP/r12-06/rust-binary-writer.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-binary-writer.log"
      - name: R12-04 direct Reader regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::text_reader::tests 2>&1 | tee "$RUNNER_TEMP/r12-06/rust-text-reader.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-text-reader.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::image_reader::tests 2>&1 | tee "$RUNNER_TEMP/r12-06/rust-image-reader.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-image-reader.log"
      - name: R12-03 direct File Kind regression 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor file_kind::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-06/rust-file-kind.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-file-kind.log"
      - name: R12-02 direct Path Policy regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor path_policy::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-06/rust-path-policy.log"
          grep -Fq 'test result: ok. 10 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-path-policy.log"
      - name: R12-01 direct behavior regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor stage_12_ \
            2>&1 | tee "$RUNNER_TEMP/r12-06/rust-production-contracts.log"
          grep -Fq 'test result: ok. 10 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-production-contracts.log"
      - name: R12-01 independent compatibility fixture 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test stage_12_security_compatibility \
            2>&1 | tee "$RUNNER_TEMP/r12-06/rust-fixture.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-06/rust-fixture.log"
      - name: Full Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-06/rust-tests.log"
      - name: Full Clippy warnings-denied gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/r12-06/clippy.log"
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-06/cargo-check.log"
      - name: Validation leaves tracked sources unchanged
        run: |
          git diff --check
          git diff --exit-code
      - name: Retain Rust evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-06-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-06/
          if-no-files-found: error
          retention-days: 14
