# Atomic Task 4.12 legacy I18n removal validation node.
name: Stage 4 Atomic Verification

on:
  push:
    branches:
      - rewrite/stage-04
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-04-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  legacy-i18n-removal:
    name: Verify Stage 4 Legacy I18n Removal
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm run deps:prepare
      - name: Verify Stage 3 handoff remains intact
        run: node --test tests/unit/platform/classic-platform-port.test.mjs tests/unit/platform/platform-cutover.test.mjs
      - name: Verify Atomic Task 4.1 historical locale audit contracts
        run: node --test tests/unit/i18n/locale-key-audit.test.mjs
      - name: Verify Atomic Task 4.2 locale split and registry
        run: node --test tests/unit/i18n/locale-registry.test.mjs
      - name: Verify Atomic Task 4.3 I18n Service
        run: node --test tests/unit/i18n/i18n-service.test.mjs
      - name: Verify Atomic Task 4.4 Translation Bindings
        run: node --test tests/unit/i18n/translation-bindings.test.mjs
      - name: Verify Atomic Task 4.5 Help Content/Controller
        run: node --test tests/unit/help/help-feature.test.mjs
      - name: Verify Atomic Task 4.6 Settings Schema
        run: node --test tests/unit/settings/settings-schema.test.mjs
      - name: Verify Atomic Task 4.7 Settings Repository
        run: node --test tests/unit/settings/settings-repository.test.mjs
      - name: Verify Atomic Task 4.8 Settings Store
        run: node --test tests/unit/settings/settings-store.test.mjs tests/unit/settings/classic-settings-store-port.test.mjs
      - name: Verify Atomic Task 4.9 Section Modules
        run: node --test tests/unit/settings/settings-sections.test.mjs
      - name: Verify Atomic Task 4.10 Settings UI
        run: node --test tests/unit/settings/settings-ui.test.mjs
      - name: Verify Atomic Task 4.11 Theme Service
        run: node --test tests/unit/theme/theme-service.test.mjs tests/ui/themes.test.mjs
      - name: Verify Atomic Task 4.12 legacy I18n removal
        run: node --test tests/unit/i18n/settings-locale-controller.test.mjs
      - name: Verify Stage 4 taskbook file contracts
        run: node --test tests/architecture/stage-04-taskbook-conformance.test.mjs
      - name: Record current locale audit
        run: node scripts/stage-04/locale-key-audit.mjs --output=artifacts/stage-04/04-12-legacy-i18n-removal-audit.json
      - name: Run architecture hard gate
        run: npm run verify:architecture
      - name: Run existing Node regression suite
        run: npm test
      - name: Run browser interaction contract
        env:
          E2E_ARTIFACT_DIR: artifacts/stage-04/browser-contract
        run: npm run test:browser:contract
      - name: Build current application
        run: npm run build
      - name: Verify built application regression
        env:
          E2E_ARTIFACT_DIR: artifacts/stage-04/browser-app
        run: npm run test:browser
      - name: Upload Atomic Task 4.12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-04-legacy-i18n-removal-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-04
          if-no-files-found: error
          retention-days: 30
