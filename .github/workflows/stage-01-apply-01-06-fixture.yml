name: Apply Stage 1 Atomic Task 1.6 Fixture

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-apply-01-06-fixture.yml

permissions:
  contents: write

jobs:
  apply-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Register event infrastructure modules
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('tests/architecture/fixtures/production-modules.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          records = {
              'src/app/events/event-bus.js': [
                  'src/app/events/event-bus.js',
                  'esm-module',
                  'composition',
                  'Immutable event snapshot publication, subscription ownership, once delivery, listener-error isolation and terminal destruction.',
                  'event-bus',
                  'explicit-instance',
                  'retain',
                  False
              ],
              'src/app/events/event-types.js': [
                  'src/app/events/event-types.js',
                  'esm-module',
                  'composition',
                  'Event-type validation and immutable centralized event catalog declaration.',
                  'none',
                  'pure',
                  'retain',
                  False
              ]
          }
          existing = {record[0]: record for record in manifest['modules']}
          existing.update(records)
          manifest['modules'] = sorted(existing.values(), key=lambda record: record[0])
          path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Verify event infrastructure and inventory
        shell: bash
        run: |
          node --test tests/architecture/event-bus.test.mjs
          node --test tests/architecture/module-inventory.test.mjs
      - name: Commit module ownership fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture/fixtures/production-modules.json
          git diff --cached --check
          git commit -m "test(stage1): register event infrastructure modules"
          git push origin "HEAD:${{ github.head_ref }}"
