name: Stage 1 Atomic Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-atomic.yml
      - scripts/stage-01/**
      - src/app/**
      - tests/architecture/**
      - docs/rewrite-progress/stage-01/**
      - README.md

permissions:
  contents: read

concurrency:
  group: stage-01-atomic-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  architecture-foundation:
    name: Verify Stage 1 architecture foundation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify production module ownership fixture
        run: node --test tests/architecture/module-inventory.test.mjs
      - name: Verify minimal composition root
        run: node --test tests/architecture/application-composition.test.mjs
      - name: Verify application lifecycle state machine
        run: node --test tests/architecture/application-lifecycle.test.mjs
      - name: Verify disposer registry
        run: node --test tests/architecture/disposer-registry.test.mjs
      - name: Verify command registry and command bus
        run: node --test tests/architecture/command-bus.test.mjs
      - name: Verify event types and event bus
        run: node --test tests/architecture/event-bus.test.mjs
      - name: Collect machine-readable module inventory
        run: node scripts/stage-01/collect-module-inventory.mjs --output=artifacts/stage-01/01-01-module-inventory.json
      - name: Record composition-root evidence
        shell: bash
        run: |
          mkdir -p artifacts/stage-01
          node -e "const fs=require('node:fs');fs.writeFileSync('artifacts/stage-01/01-02-composition-root.json',JSON.stringify({node:'stage-01/01-02',status:'passed',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT},null,2)+'\n')"
      - name: Record lifecycle evidence
        shell: bash
        run: |
          mkdir -p artifacts/stage-01
          node -e "const fs=require('node:fs');fs.writeFileSync('artifacts/stage-01/01-03-application-lifecycle.json',JSON.stringify({node:'stage-01/01-03',status:'passed',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,states:['idle','starting','running','stopping','failed'],startupOrder:'registration',rollbackOrder:'reverse',shutdownOrder:'reverse'},null,2)+'\n')"
      - name: Record disposer-registry evidence
        shell: bash
        run: |
          mkdir -p artifacts/stage-01
          node -e "const fs=require('node:fs');fs.writeFileSync('artifacts/stage-01/01-04-disposer-registry.json',JSON.stringify({node:'stage-01/01-04',status:'passed',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,states:['open','disposing','failed'],cleanupOrder:'lifo',retryPolicy:'failed-only',concurrentDispose:'shared-transition'},null,2)+'\n')"
      - name: Record command-infrastructure evidence
        shell: bash
        run: |
          mkdir -p artifacts/stage-01
          node -e "const fs=require('node:fs');fs.writeFileSync('artifacts/stage-01/01-05-command-infrastructure.json',JSON.stringify({node:'stage-01/01-05',status:'passed',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,registryOwnership:'unique-handler',duplicatePolicy:'reject',unregisterPolicy:'exact-idempotent',dispatchResult:'promise',missingCommand:'reject',handlerErrors:'preserve'},null,2)+'\n')"
      - name: Record event-infrastructure evidence
        shell: bash
        run: |
          mkdir -p artifacts/stage-01
          node -e "const fs=require('node:fs');fs.writeFileSync('artifacts/stage-01/01-06-event-infrastructure.json',JSON.stringify({node:'stage-01/01-06',status:'passed',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,payloadPolicy:'deep-frozen-plain-data-snapshot',deliveryOrder:'registration',oncePolicy:'remove-before-invoke',unsubscribePolicy:'exact-idempotent',listenerErrors:'isolated-reported',publishResult:'void',destroyedUse:'reject'},null,2)+'\n')"
      - name: Run existing Node regression suite
        run: npm test
      - name: Run browser interaction contract
        run: npm run test:browser:contract
      - name: Build current application
        run: npm run build
      - name: Upload Atomic Task evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-01-architecture-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-01
          if-no-files-found: error
          retention-days: 30
