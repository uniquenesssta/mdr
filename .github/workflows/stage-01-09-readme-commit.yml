name: Stage 1 Atomic Task 1.9 README Commit

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-01-09-readme-commit.yml

permissions:
  contents: write

jobs:
  commit-readme:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply exact Atomic Task 1.9 README record
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          record_path = Path('docs/rewrite-progress/stage-01/01-09-package-scripts.md')
          data = readme_path.read_bytes()
          anchor = b'## Change Log\n'
          insert = (
              '## Change Log\n'
              '<!-- stage-01-node:01-09 -->\n'
              '- 2026-08-05：阶段 1 Atomic Task 1.9（package scripts）完成：在 `package.json` 新增 `verify:architecture`、`verify:no-legacy-runtime`、`verify:generated-files` 和 `verify:readme-record` 四个本地 Node 验证入口，并新增独立契约测试，精确锁定既有 9 个 package 命令语义、目标脚本路径以及无构建产物、包安装或联网依赖。专项 run 30973431231 与完整基线 run 30973431241 全部通过，`package-lock.json`、依赖、生产模块、冻结契约和用户行为未改变；Atomic Task 1.10 尚未开始。\n'
          ).encode('utf-8')

          if data.count(anchor) != 1:
              raise SystemExit('README Change Log anchor is not unique')
          if b'stage-01-node:01-09' in data:
              raise SystemExit('README already contains Atomic Task 1.9 record')
          if not record_path.is_file():
              raise SystemExit('Atomic Task 1.9 detailed record is missing')

          readme_path.write_bytes(data.replace(anchor, insert, 1))
          PY

          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add README.md
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "README.md"
          test "$(git diff --cached --numstat -- README.md)" = $'2\t0\tREADME.md'
          npm run verify:readme-record
          npm run verify:architecture
          git commit -m "docs(stage1): record Atomic Task 1.9 completion"
          git push origin HEAD:rewrite/modular-rebuild
