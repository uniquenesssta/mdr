name: R10-01 bootstrap

on:
  push:
    branches:
      - agent/r10-stage

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard Stage 10 baseline and helper-only prestate
        shell: bash
        run: |
          set -euo pipefail
          base='1c90fe1ae9cdb315352585a2e04729f9f4b975ee'
          git merge-base --is-ancestor "$base" HEAD
          test -z "$(git status --porcelain)"
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected=$'.agent/r10_01_apply.py\n.github/workflows/r10-01.yml'
          test "$changed" = "$expected"

      - name: Apply Atomic R10-01
        run: python .agent/r10_01_apply.py

      - name: Check generated atomic diff
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const fixture = JSON.parse(fs.readFileSync('tests/architecture/fixtures/production-modules.json', 'utf8'));
          if (fixture.modules.length !== 384) throw new Error(`Expected 384 production modules after R10-01, got ${fixture.modules.length}`);
          NODE
          test ! -e src/features/persistence/application/save-controller.js
          test ! -e src/features/persistence/application/autosave-controller.js
          test ! -e src/features/persistence/native-document-store/native-save-session.js
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: R10-01 targeted gate 5/5
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-10-save-status-store.test.mjs | tee /tmp/r10_01_targeted.log
          grep -q '# tests 5' /tmp/r10_01_targeted.log
          grep -q '# pass 5' /tmp/r10_01_targeted.log
          grep -q '# fail 0' /tmp/r10_01_targeted.log

      - name: Full Node regression
        run: npm test

      - name: Architecture and documentation gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture
          npm run verify:no-legacy-runtime
          npm run verify:generated-files
          npm run verify:readme-record

      - name: Browser preview contract 10/10
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser:contract | tee /tmp/r10_01_browser_contract.log
          grep -Fq 'Browser tests: 10, passed: 10, failed: 0' /tmp/r10_01_browser_contract.log

      - name: Production build
        run: npm run build

      - name: Built-app browser regression 29/29
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser | tee /tmp/r10_01_browser.log
          grep -Fq 'Browser tests: 29, passed: 29, failed: 0' /tmp/r10_01_browser.log

      - name: Write factual R10-01 detail record
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/R10-01-DETAILS.md <<EOF
          # R10-01 — Save Status Store

          Atomic 10.1 将保存/加载状态从经典脚本的局部变量与 DOM 反推中迁出，建立 \`src/features/persistence/state/save-status-store.js\` 作为唯一状态权威，并通过 \`src/features/persistence/index.js\` 暴露公共契约。状态集合冻结为 \`idle / queued / saving / saved / error / loading\`；\`destroy()\` 为不可逆终态，销毁后读、写、订阅均拒绝继续执行。Store 只保存状态元数据，不复制 manifest、正文、DocumentModel 或 native session 数据。

          ## 实际实现与影响范围

          新增 SaveStatusStore、最小 Persistence 公共入口及 scoped classic compatibility port。\`src/main.js\` 在组合根创建 Store，把现有 NativeDocumentStore 的状态事件归一化后提交给 Store，并负责取消订阅、销毁 bridge 与 Store。\`public/app/core.js\` 删除 \`saveStatusState\` 与 \`setSaveStatus()\` 权威实现；保存提示、分段加载提示只订阅 Store，原 raw native 监听仅保留 manifest 的 Outline/统计数据处理。\`public/app/export.js\` 的自动保存、手动保存和当前文件保存只通过 scoped port 提交状态意图。未修改冻结模型、Rust \`document_store.rs\`、持久化格式、平台 DTO、依赖或锁文件，也未提前实施 R10-02 及后续 Controller/Queue/Loader 职责。

          外部可观察保存文案、自动保存关闭提示、native 分块保存进度、加载索引/正文进度、保存失败和加载失败提示保持既有语义。Native save/load 的异步过时与取消仍由现有 NativeDocumentStore 的 load sequence/session queue 保证；R10-01 Store 只接收已归一化事件并携带 documentId、targetVersion/backendVersion/version、pending、progress 与单调 revision，不新增第二套异步调度。

          ## 验证记录

          Bootstrap workflow run \`${GITHUB_RUN_ID}\` 在最终提交前对同一工作树实际执行并通过：\`npm audit --audit-level=high\`；R10-01 targeted **5/5**；完整 \`npm test\`；\`verify:architecture\`、\`verify:no-legacy-runtime\`、\`verify:generated-files\`、\`verify:readme-record\`；Browser contract **10/10**；\`npm run build\`；built-app browser **29/29**；\`git diff --check\`。生产模块清单由 381 增至 384，新增的 3 个 production modules 均已分类。

          \`npm run test:integration\` 未执行，因为当前 \`package.json\` 没有该脚本；已用完整 Node 回归、Browser contract 与 built-app browser 真实链路替代。Rust test/clippy/check 未执行，因为本 Atomic 未修改 Rust、Rust 接口、DTO 或持久化格式，并由 frozen diff guard 明确验证 \`src-tauri/src/document_store.rs\` 未变化。后续最终 HEAD 的独立 R10-01 workflow 结果将在收口记录中补充。
          EOF
          git diff --check

      - name: Guard scope and squash helpers into one Atomic commit
        shell: bash
        run: |
          set -euo pipefail
          base='1c90fe1ae9cdb315352585a2e04729f9f4b975ee'
          git diff --quiet "$base" -- \
            src/model-kernel/index.js \
            src/document/document-model.js \
            src/sync/selection-mapping.js \
            src/preview/incremental-preview.js \
            src/preview/math-source.js \
            src/editor/hybrid/block-registry.js \
            src/editor/hybrid/math-ranges.js \
            src/editor/hybrid/ranges.js \
            src/editor/hybrid/table-model.js \
            src-tauri/src/document_store.rs \
            package.json package-lock.json
          rm .agent/r10_01_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset --soft "$base"
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement R10-01 save status store'
          git push --force-with-lease origin HEAD:agent/r10-stage
