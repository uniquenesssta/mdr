name: Stage 1 Atomic Task 1.8 Baseline Export

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-01-08-baseline-export.yml

permissions:
  contents: write

jobs:
  commit-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate exact migration regression baseline
        run: node scripts/verify-architecture.mjs --write-baseline
      - name: Validate and commit only the baseline fixture
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const path = 'tests/architecture/fixtures/architecture-baseline.json';
          const baseline = JSON.parse(await readFile(path, 'utf8'));
          if (baseline.kind !== 'stage-01-exact-migration-regression-baseline') process.exit(1);
          if (baseline.legacyClassicScripts.length !== 9) process.exit(1);
          if (baseline.inlineEvents.reduce((sum, item) => sum + item.count, 0) !== 184) process.exit(1);
          if (baseline.businessGlobalWrites.reduce((sum, item) => sum + item.count, 0) !== 38) process.exit(1);
          if (baseline.trackedGeneratedFiles.length !== 4) process.exit(1);
          if (baseline.policy.wildcardExemptions !== false) process.exit(1);
          NODE
          git config user.name "uniquenesssta"
          git config user.email "uniquenesssta@live.com"
          git add tests/architecture/fixtures/architecture-baseline.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "tests/architecture/fixtures/architecture-baseline.json"
          git commit -m "test(stage1): lock exact architecture migration baseline"
          git push origin HEAD:rewrite/modular-rebuild
