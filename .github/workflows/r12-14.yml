  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  frontend:
    name: HTML boundary baseline and frontend regression
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-14"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3692eb913473a8be3a45f326f5d93656d6cf1fb2 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-14/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/r12-14/source.tar.gz" HEAD
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm run deps:prepare 2>&1 | tee "$RUNNER_TEMP/r12-14/dependencies.log"
      - name: Dependency audit hard gate
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/r12-14/npm-audit.log"
      - name: R12-08 command boundaries and R12-07 compatibility contracts
        run: |
          node --test \
            tests/stage-12-security-contract.test.mjs tests/architecture/model-kernel-contract.test.mjs tests/architecture/module-inventory.test.mjs \
            tests/stage-12-path-policy.test.mjs \
            tests/stage-12-file-kind.test.mjs \
            tests/stage-12-readers.test.mjs \
            tests/stage-12-writers.test.mjs \
            tests/stage-12-directory-tree.test.mjs \
            tests/stage-12-tree-limits.test.mjs \
            tests/stage-12-local-commands.test.mjs \
            tests/stage-12-external-link-validation.test.mjs \
            tests/stage-12-opener.test.mjs tests/stage-12-web-validation.test.mjs tests/stage-12-web-client.test.mjs tests/stage-12-web-response.test.mjs tests/stage-12-log-redaction.test.mjs tests/stage-12-log-writer.test.mjs tests/stage-12-log-lifecycle.test.mjs tests/stage-12-command-registry.test.mjs \
            tests/unit/platform/link-client.test.mjs \
            tests/unit/platform/web-fetch-client.test.mjs \
            tests/unit/platform/file-system-client.test.mjs \
            tests/historical-workflow-routing.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/tree-limits-contracts.log"
      - name: R12-19 save commit fault contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-12-save-commit.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/save-commit-js.log"
      - name: Full Node regression
        if: ${{ !cancelled() }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/r12-14/node.log"
      - name: Architecture and documentation hard gates
        if: ${{ !cancelled() }}
        run: |
          npm run verify:architecture 2>&1 | tee "$RUNNER_TEMP/r12-14/architecture.log"
      - name: Legacy runtime hard gate
        if: ${{ !cancelled() }}
        run: |
          npm run verify:no-legacy-runtime 2>&1 | tee "$RUNNER_TEMP/r12-14/no-legacy.log"
      - name: Generated files hard gate
        if: ${{ !cancelled() }}
        run: |
          npm run verify:generated-files 2>&1 | tee "$RUNNER_TEMP/r12-14/generated.log"
      - name: Documentation record hard gate
        if: ${{ !cancelled() }}
        run: |
          npm run verify:readme-record 2>&1 | tee "$RUNNER_TEMP/r12-14/readme.log"
      - name: Browser preview contract
        if: ${{ !cancelled() }}
        run: npm run test:browser:contract 2>&1 | tee "$RUNNER_TEMP/r12-14/browser-contract.log"
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/r12-14/build.log"
      - name: Built-app browser regression
        if: ${{ !cancelled() }}
        run: npm run test:browser 2>&1 | tee "$RUNNER_TEMP/r12-14/browser-app.log"
      - name: Validation leaves tracked sources unchanged
        if: ${{ !cancelled() }}
        run: |
          git status --short --untracked-files=all | tee "$RUNNER_TEMP/r12-14/workspace.log"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain frontend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-14-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-14/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Safe file writes and cumulative Rust hard gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CARGO_TERM_COLOR: never
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-14"
          test -z "$(git status --porcelain)"
          printf 'CARGO_TARGET_DIR=%s/r12-14-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MARKDOWN_EDITOR_LOG_DIR=%s/r12-14/performance-logs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 9b6d6369fce3f2b36a33cdd12dd28c4d0460d927 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-14/commit.txt"
      - name: Setup Node for the actual frontend to Rust log regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin Rust 1.88 with Clippy and rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo --version
      - name: Guard current model and interface contracts
        run: |
          node scripts/ci/verify-windows-test-imports.mjs
          node --test tests/architecture/module-inventory.test.mjs tests/stage-12-command-registry.test.mjs tests/stage-12-log-redaction.test.mjs
          git diff --check
      - name: Rust formatting
        run: |
          rustfmt --edition 2021 --check --config max_width=120 \
            src-tauri/src/external_link/mod.rs \
            src-tauri/src/external_link/command.rs \
            src-tauri/src/performance_log/mod.rs \
            src-tauri/src/performance_log/command.rs \
            src-tauri/src/performance_log/redaction.rs \
            src-tauri/src/performance_log/paths.rs \
            src-tauri/src/performance_log/writer.rs \
            src-tauri/src/performance_log/lifecycle.rs \
            src-tauri/tests/performance_log/lifecycle_contract.rs \
            src-tauri/tests/performance_log/writer_contract.rs \
            src-tauri/tests/performance_log/release_writer.rs \
            src-tauri/tests/performance_log/redaction_pipeline.rs \
            src-tauri/src/web_fetch/mod.rs \
            src-tauri/src/web_fetch/command.rs \
            src-tauri/src/web_fetch/client.rs \
            src-tauri/src/web_fetch/response.rs \
            src-tauri/src/web_fetch/validation.rs \
            src-tauri/tests/web_fetch/validation.rs \
            src-tauri/tests/web_fetch/http_compatibility.rs \
            src-tauri/tests/web_fetch/tls_server.rs \
            src-tauri/src/external_link/opener.rs \
            src-tauri/tests/external_link/opener.rs \
            src-tauri/tests/external_link_opener_platform.rs \
            src-tauri/src/external_link/validation.rs \
            src-tauri/tests/external_link/command_validation.rs \
            src-tauri/src/local_file/mod.rs \
            src-tauri/src/local_file/commands.rs \
            src-tauri/src/local_file/operations.rs \
            src-tauri/src/local_file/types.rs \
            src-tauri/src/local_file/atomic_writer.rs \
            src-tauri/tests/local_file/atomic_writer.rs \
            src-tauri/src/local_file/binary_writer.rs \
            src-tauri/src/local_file/directory_tree.rs \
            src-tauri/src/local_file/file_kind.rs \
            src-tauri/src/local_file/image_reader.rs \
            src-tauri/src/local_file/path_policy.rs \
            src-tauri/src/local_file/text_reader.rs \
            src-tauri/src/local_file/text_writer.rs \
            src-tauri/src/local_file/tree_limits.rs \
            src-tauri/tests/local_file/legacy.rs \
            src-tauri/tests/local_file/stage_12.rs \
            src-tauri/tests/local_file/commands.rs \
            src-tauri/tests/stage_12_security_compatibility.rs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rustfmt.log"
      - name: R12-21 shared safe writer Windows failures 18 of 18
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor local_file::atomic_writer::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/r12-14/safe-user-writer.log"
          grep -Fq 'test result: ok. 18 passed; 0 failed' "$RUNNER_TEMP/r12-14/safe-user-writer.log"
      - name: R12-19 save cache and disk failures
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor document_store::store::save_commit_tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/r12-14/save-commit-rust.log"
      - name: R12-16 extracted lifecycle 6 of 6
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor performance_log::lifecycle_contract_tests 2>&1 | tee "$RUNNER_TEMP/r12-14/lifecycle-after.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-14/lifecycle-after.log"
      - name: R12-16 release lifecycle creates no logs
        if: ${{ !cancelled() }}
        run: node scripts/ci/verify-release-log-lifecycle.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/release-lifecycle.log"
      - name: R12-15 extracted real log writer 9 of 9
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor performance_log::writer_contract_tests 2>&1 | tee "$RUNNER_TEMP/r12-14/writer-after.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$RUNNER_TEMP/r12-14/writer-after.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor performance_log::paths::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/log-paths.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/r12-14/log-paths.log"
      - name: R12-15 release writer creates no log files
        if: ${{ !cancelled() }}
        run: node scripts/ci/verify-release-log-writer.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/release-writer.log"
      - name: R12-14 direct recursive redaction 14 of 14
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor performance_log::redaction::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/log-redaction.log"
          grep -Fq 'test result: ok. 14 passed; 0 failed' "$RUNNER_TEMP/r12-14/log-redaction.log"
      - name: R12-14 actual frontend payload to Rust JSONL
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-12-log-payload.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/frontend-payload.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor performance_log::redaction_pipeline_tests 2>&1 | tee "$RUNNER_TEMP/r12-14/redaction-pipeline.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/r12-14/redaction-pipeline.log"
      - name: R12-13 extracted real HTTP response behavior 9 of 9
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor web_fetch::http_compatibility_tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/web-response.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$RUNNER_TEMP/r12-14/web-response.log"
      - name: R12-12 direct client ownership tests 2 of 2
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor web_fetch::client::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/web-client-unit.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed' "$RUNNER_TEMP/r12-14/web-client-unit.log"
      - name: R12-11 extracted URL and real HTTP behavior 17 of 17
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor web_fetch::validation_tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/web-url.log"
          grep -Fq 'test result: ok. 8 passed; 0 failed' "$RUNNER_TEMP/r12-14/web-url.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor web_fetch::http_compatibility_tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/web-http.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$RUNNER_TEMP/r12-14/web-http.log"
      - name: R12-09 direct URL validation 8 of 8
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor external_link::validation::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rust-url-validation.log"
          grep -Fq 'test result: ok. 8 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-url-validation.log"
      - name: R12-09 real backend command rejection 2 of 2
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor external_link::validation_command_tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rust-url-command.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-url-command.log"
      - name: R12-08 real command tests 12 of 12
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::command_tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-commands.log"
          grep -Fq 'test result: ok. 12 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-commands.log"
      - name: Preserved local-file legacy regression 4 of 4
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-legacy.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-legacy.log"
      - name: R12-07 direct Tree Limits tests 6 of 6
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::tree_limits::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-tree-limits.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-tree-limits.log"
      - name: R12-06 direct Windows Directory Tree regression 5 of 5
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::directory_tree::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-directory-tree.log"
          grep -Fq 'test result: ok. 5 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-directory-tree.log"
      - name: R12-05 direct Writer regression 10 of 10
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::text_writer::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-text-writer.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-text-writer.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::binary_writer::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-binary-writer.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-binary-writer.log"
      - name: R12-04 direct Reader regression 10 of 10
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::text_reader::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-text-reader.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-text-reader.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::image_reader::tests 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-image-reader.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-image-reader.log"
      - name: R12-03 direct File Kind regression 6 of 6
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor file_kind::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rust-file-kind.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-file-kind.log"
      - name: R12-02 direct Windows Path Policy regression 9 of 9
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor path_policy::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rust-path-policy.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-path-policy.log"
      - name: R12-01 direct Windows behavior regression 9 of 9
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor stage_12_ \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rust-production-contracts.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-production-contracts.log"
      - name: R12-01 independent compatibility fixture 6 of 6
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test stage_12_security_compatibility \
            2>&1 | tee "$RUNNER_TEMP/r12-14/rust-fixture.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-14/rust-fixture.log"
      - name: Full Rust tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-14/rust-tests.log"
      - name: Full Clippy warnings-denied gate
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/r12-14/clippy.log"
      - name: Rust check
        if: ${{ !cancelled() }}
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-14/cargo-check.log"
      - name: Validation leaves tracked sources unchanged
        if: ${{ !cancelled() }}
        run: |
          git status --short --untracked-files=all | tee "$RUNNER_TEMP/r12-14/workspace.log"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain Rust evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-14-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-14/
          if-no-files-found: error
          retention-days: 14

  native-boundary:
    name: Native opener compilation and linkage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record target and pin Rust
        run: |
          mkdir -p "$RUNNER_TEMP/r12-14-native"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-14-native/commit.txt"
          rustup toolchain install 1.88.0 --profile minimal
          rustc --version
      - name: Compile and link the production native boundary
        run: |
          rustc --edition=2021 --test -D warnings src-tauri/tests/external_link_opener_platform.rs \
            -o "$RUNNER_TEMP/r12-14-native/opener-platform.exe" \
            2>&1 | tee "$RUNNER_TEMP/r12-14-native/compile.log"
          "$RUNNER_TEMP/r12-14-native/opener-platform.exe" \
            2>&1 | tee "$RUNNER_TEMP/r12-14-native/signature.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/r12-14-native/signature.log"
      - name: Validation leaves tracked sources unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain native boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-14-native-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-14-native/
          if-no-files-found: error
          retention-days: 14

  dependency-advisories:
    name: R12-23 official RustSec and Windows dependency graph
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact source and pin Rust 1.88
        run: |
          mkdir -p "$RUNNER_TEMP/r12-23"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ccaf7afe95ff04828064232a4456a8b1fa1de65b HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-23/commit.txt"
          rustup toolchain install 1.88.0 --profile minimal
          rustc --version | tee "$RUNNER_TEMP/r12-23/rustc.txt"
      - name: Verify advisory disposition failure cases
        run: node --test tests/stage-12-dependency-advisories.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-23/contracts.log"
      - name: Official RustSec scan and actual Windows normal build graph
        run: node scripts/ci/run-windows-dependency-audit.mjs 2>&1 | tee "$RUNNER_TEMP/r12-23/verification.log"
      - name: Validation leaves tracked sources unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain advisory evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-23-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-23/
          if-no-files-found: error
          retention-days: 14

  webview-baseline:
    name: R12-22 actual Windows WebView security and content regression
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CARGO_TERM_COLOR: never
      MARKDOWN_EDITOR_BINARY: ../.cargo-target/markdown-editor-windows-driver-host/debug/markdown-editor.exe
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record exact source and install pinned Rust
        run: |
          mkdir -p "$RUNNER_TEMP/r12-22-webview"
          printf 'MARKDOWN_EDITOR_LOG_DIR=%s/r12-22-webview/performance-logs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-22-webview/commit.txt"
          rustup toolchain install 1.88.0 --profile minimal
          rustc --version
      - name: Install locked frontend and pinned transient WebDriver
        run: npm run deps:prepare -- --add selenium-webdriver@4.34.0 2>&1 | tee "$RUNNER_TEMP/r12-22-webview/dependencies.log"
      - name: Verify security harness and native host contracts
        run: node --test tests/stage-12-html-boundary.test.mjs tests/windows-window-automation.test.mjs tests/dependency-location.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-22-webview/contracts.log"
      - name: Build the exact production frontend
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/r12-22-webview/build.log"
      - name: Prepare isolated native host without changing production locked dependencies
        shell: pwsh
        run: |
          ./scripts/stage-03/windows/prepare-embedded-driver-host.ps1 -PreserveProductionLock
          Copy-Item '../.markdown-editor-windows-driver-host/driver-host.json' "$env:RUNNER_TEMP/r12-22-webview/driver-host.json"
          Copy-Item '../.markdown-editor-windows-driver-host/src-tauri/Cargo.lock' "$env:RUNNER_TEMP/r12-22-webview/driver-host-Cargo.lock"
      - name: Compile the embedded Windows WebView host
        run: cargo build --locked --target-dir ../.cargo-target/markdown-editor-windows-driver-host --manifest-path ../.markdown-editor-windows-driver-host/src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/r12-22-webview/native-build.log"
      - name: Verify actual sinks, CSP and legal content with owned-canary IPC
        run: node tests/e2e/windows/run-render-boundary-probe.mjs --verify 2>&1 | tee "$RUNNER_TEMP/r12-22-webview/probe.log"
      - name: Validation leaves tracked sources unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain security evidence even if native initialization fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-22-webview-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-22-webview/
          if-no-files-found: error
          retention-days: 14

  repository-tests:
    name: All repository Node tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        run: npm run deps:prepare
      - name: Run every tracked Node test including nested suites
        run: |
          mkdir -p "$RUNNER_TEMP/repository-audit"
          npm exec --offline --call "node scripts/ci/run-repository-tests.mjs" 2>&1 | tee "$RUNNER_TEMP/repository-audit/node.log"
      - name: Preserve complete audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-tests-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-audit/
          if-no-files-found: error
          retention-days: 14

  audit-closeout:
    name: R12-24 exact-commit Windows evidence and handoff
    if: ${{ always() }}
    needs: [frontend, rust, native-boundary, repository-tests, dependency-advisories, webview-baseline]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify closeout rejection cases
        run: node --test tests/stage-12-closeout.test.mjs
      - name: Download current-run evidence without merging files
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.sha }}-${{ github.run_attempt }}'
          path: ${{ runner.temp }}/r12-24-inputs
          merge-multiple: false
      - name: Verify all cumulative jobs and actual same-commit evidence
        if: ${{ !cancelled() }}
        env:
          R12_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/verify-r12-closeout.mjs
      - name: Validation leaves tracked sources unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain final admission decision even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-24-closeout-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-24/
          if-no-files-found: error
          retention-days: 14
