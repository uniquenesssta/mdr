name: Windows Rewrite Revalidation
run-name: R17-01 workspace and diff audit and cumulative regression · ${{ github.sha }}

on:
  push:
    branches: [agent/r14-stage, agent/r15-stage, codex/r16-stage, codex/r17-stage]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'public/app/core.js'
      - 'public/app/export.js'
      - 'src-tauri/**'
      - 'tests/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'docs/WINDOWS_VALIDATION_POLICY.md'
      - 'src-tauri/src/performance_log.rs'
      - 'src-tauri/src/performance_log/**'
      - 'src-tauri/src/web_fetch.rs'
      - 'src-tauri/src/web_fetch/**'
      - 'src-tauri/tests/web_fetch/**'
      - 'tests/stage-12-web-validation.test.mjs'
      - 'tests/stage-12-web-client.test.mjs'
      - 'tests/stage-12-web-response.test.mjs'
      - 'tests/stage-12-log-redaction.test.mjs'
      - 'tests/unit/platform/web-fetch-client.test.mjs'
      - 'src/platform/desktop/web-fetch-client.js'
      - 'docs/R12-11-DETAILS.md'
      - 'docs/R12-12-DETAILS.md'
      - 'docs/R12-13-DETAILS.md'
      - 'docs/R12-14-DETAILS.md'
      - 'docs/R12-15-DETAILS.md'
      - 'docs/R12-23-DETAILS.md'
      - 'docs/R12-24-DETAILS.md'
      - 'docs/R13-01-DETAILS.md'
      - 'docs/R15-*-DETAILS.md'
      - 'docs/R16-*-DETAILS.md'
      - 'docs/R17-*-DETAILS.md'
      - 'docs/audit/r16-*.json'
      - 'docs/audit/r17-*.json'
      - 'docs/R14-01-DETAILS.md'
      - 'docs/R14-02-DETAILS.md'
      - 'docs/R14-03-DETAILS.md'
      - 'docs/R14-04-DETAILS.md'
      - 'docs/R14-05-DETAILS.md'
      - 'docs/audit/r12-24-closeout.json'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/14-*'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/15-*'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/16-*'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/17-*'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/18-*'
      - 'docs/audit/r12-23-dependency-advisories.json'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/01-*'
      - 'src-tauri/src/external_link.rs'
      - 'src-tauri/src/external_link/**'
      - 'src-tauri/tests/external_link/**'
      - 'src-tauri/tests/external_link_opener_platform.rs'
      - 'tests/stage-12-opener.test.mjs'
      - 'docs/R12-10-DETAILS.md'
      - 'tests/stage-12-external-link-validation.test.mjs'
      - 'tests/unit/platform/link-client.test.mjs'
      - 'src/platform/desktop/link-client.js'
      - 'docs/R12-09-DETAILS.md'
      - 'src-tauri/src/local_file.rs'
      - 'src-tauri/src/local_file/**'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/tests/local_file/**'
      - 'src-tauri/src/local_file/binary_writer.rs'
      - 'src-tauri/src/local_file/directory_tree.rs'
      - 'src-tauri/src/local_file/file_kind.rs'
      - 'src-tauri/src/local_file/image_reader.rs'
      - 'src-tauri/src/local_file/path_policy.rs'
      - 'src-tauri/src/local_file/text_reader.rs'
      - 'src-tauri/src/local_file/text_writer.rs'
      - 'src-tauri/src/local_file/tree_limits.rs'
      - 'src-tauri/tests/stage_12_security_compatibility.rs'
      - 'src-tauri/tests/fixtures/stage_12_security/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src/platform/desktop/file-system-client.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/stage-12-security-contract.test.mjs'
      - 'tests/stage-12-path-policy.test.mjs'
      - 'tests/stage-12-file-kind.test.mjs'
      - 'tests/stage-12-readers.test.mjs'
      - 'tests/stage-12-writers.test.mjs'
      - 'tests/stage-12-directory-tree.test.mjs'
      - 'tests/stage-12-tree-limits.test.mjs'
      - 'tests/stage-12-local-commands.test.mjs'
      - 'tests/stage-12-validation-workspace.test.mjs'
      - 'scripts/ci/archive-tauri-schema.mjs'
      - 'tests/folder-file-tree.test.mjs'
      - 'tests/documentation-layout.test.mjs'
      - 'tests/unit/platform/file-system-client.test.mjs'
      - 'tests/historical-workflow-routing.test.mjs'
      - 'tests/architecture/**'
      - 'docs/R12-01-DETAILS.md'
      - 'docs/R12-02-DETAILS.md'
      - 'docs/R12-03-DETAILS.md'
      - 'docs/R12-04-DETAILS.md'
      - 'docs/R12-05-DETAILS.md'
      - 'docs/R12-06-DETAILS.md'
      - 'docs/R12-07-DETAILS.md'
      - 'docs/R12-08-DETAILS.md'
      - 'docs/README.md'
      - 'docs/markdown-main-full-rewrite-taskbook-18-docs/13-*'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  frontend:
    name: HTML boundary baseline and frontend regression
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Preserve repository LF bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-14"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3692eb913473a8be3a45f326f5d93656d6cf1fb2 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-14/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/r12-14/source.tar.gz" HEAD
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm run deps:prepare 2>&1 | tee "$RUNNER_TEMP/r12-14/dependencies.log"
      - name: Dependency audit hard gate
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/r12-14/npm-audit.log"
      - name: R12-08 command boundaries and R12-07 compatibility contracts
        run: |
          node --test \
            tests/stage-12-security-contract.test.mjs tests/architecture/model-kernel-contract.test.mjs tests/architecture/module-inventory.test.mjs \
            tests/stage-12-path-policy.test.mjs \
            tests/stage-12-file-kind.test.mjs \
            tests/stage-12-readers.test.mjs \
            tests/stage-12-writers.test.mjs \
            tests/stage-12-directory-tree.test.mjs \
            tests/stage-12-tree-limits.test.mjs \
            tests/stage-12-local-commands.test.mjs \
            tests/stage-12-external-link-validation.test.mjs \
            tests/stage-12-opener.test.mjs tests/stage-12-web-validation.test.mjs tests/stage-12-web-client.test.mjs tests/stage-12-web-response.test.mjs tests/stage-12-log-redaction.test.mjs tests/stage-12-log-writer.test.mjs tests/stage-12-log-lifecycle.test.mjs tests/stage-12-command-registry.test.mjs \
            tests/unit/platform/link-client.test.mjs \
            tests/unit/platform/web-fetch-client.test.mjs \
            tests/unit/platform/file-system-client.test.mjs \
            tests/historical-workflow-routing.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/tree-limits-contracts.log"
      - name: R12-19 save commit fault contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-12-save-commit.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/save-commit-js.log"
      - name: R14-01 offline export format and lifecycle characterization
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-characterization.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-characterization.log"
      - name: R14-02 export request policy and pre-task validation
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-request.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-request.log"
      - name: R14-03 export task ownership and disposal
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-task.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-task.log"
      - name: R14-04 export cancellation tokens and irreversible locks
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-cancellation.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-cancellation.log"
      - name: R14-05 progress projection, modal lifecycle and disposal
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-progress.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-progress.log"
      - name: R14-06 detached document builder, stale source and frame disposal
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-document.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-document.log"
      - name: R14-06 cumulative Settings changes preserve theme-only Preview identity
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-settings-effects.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/settings-effects.log"
      - name: R14-07 cancellable document enhancement and late-result isolation
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-enhancement.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-enhancement.log"
      - name: R14-07 A10 patched direct and transitive math renderer
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-renderer-security.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/renderer-security.log"
      - name: R14-08 shared Export Styles contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-styles.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-styles.log"
      - name: R14-09 raw Markdown exporter and guarded file boundaries
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-markdown-exporter.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/markdown-exporter.log"
      - name: R14-10 standalone HTML exporter contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-html-exporter.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/html-exporter.log"
      - name: R14-11 shared Word exporter contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-word-exporter.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/word-exporter.log"
      - name: R14-12 isolated PDF exporter contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-pdf-exporter.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/pdf-exporter.log"
      - name: R14-13 image geometry and layout disposal contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-image-layout.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/image-layout.log"
      - name: R14-14 anonymous image assets, inline pixels and bounded failure contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-image-assets.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-image-assets.log"
      - name: R14-15 exact Data URL bytes, Unicode and binary output contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-image-data.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-image-data.log"
      - name: R14-16 final image owner, source barriers and irreversible lifecycle
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-image-exporter.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/image-exporter.log"
      - name: R14-17 unified File Writer contracts
        run: node --test tests/stage-14-file-writer.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/file-writer.log"
      - name: R14-18 command ownership and image dialog lifecycle
        if: ${{ !cancelled() }}
        run: node --test tests/stage-14-export-controller.test.mjs tests/stage-14-image-dialog-view.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/export-controller-view.log"
      - name: R15-01 telemetry event catalogue and original-runtime contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-event-catalogue.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-catalogue.log"

      - name: R15-02 public Recorder inputs, measurement and disposal
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-recorder.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-recorder.log"

      - name: R15-03 recursive frontend redaction and actual native payload
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-redaction.test.mjs tests/stage-12-log-payload.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-redaction.log"

      - name: R15-04 bounded Buffer, cumulative acknowledgement and retry disposal
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-aggregation-buffer.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-buffer.log"

      - name: R15-05 public LongTaskObserver lifecycle and actual Runtime collection
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-long-task-observer.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-long-task.log"

      - name: R15-06 public Runtime Snapshot limits, failures and timer disposal
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-runtime-snapshot.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-snapshot.log"

      - name: R15-07 Native Sink receipts, timeout recovery and retry limits
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-native-log-sink.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-native-sink.log"

      - name: R15-08 unified telemetry lifecycle and owned resource disposal
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-telemetry-lifecycle.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/telemetry-lifecycle.log"

      - name: R15-09 public E2E query DTOs, stale actions and wait disposal
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-e2e-query-api.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/e2e-query-api.log"

      - name: R15-10 explicit E2E installation, descriptor ownership and rollback
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-e2e-installation.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/e2e-installation.log"

      - name: R15-11 public runner actions and trusted CDP input contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-e2e-runner.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/e2e-runner.log"

      - name: R15-12 source and built-output fingerprint rejection and recovery
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-stale-dist.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/stale-dist.log"

      - name: R15-13 runtime log retirement and non-exemptible generated-file guard
        if: ${{ !cancelled() }}
        shell: bash
        run: node --test tests/stage-15-log-cleanup.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/log-cleanup.log"

      - name: R16-13 retired inputs, runtime ownership and exact-run admission contracts
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-16-single-implementation.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/single-implementation-tests.log"
          grep -Eq 'tests 12$' "$RUNNER_TEMP/r12-14/single-implementation-tests.log"
          grep -Eq 'pass 12$' "$RUNNER_TEMP/r12-14/single-implementation-tests.log"
          grep -Eq 'fail 0$' "$RUNNER_TEMP/r12-14/single-implementation-tests.log"
      - name: R16-12 complete production graph and dependency admission
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-16-dependency-graph.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/dependency-graph-tests.log"
          grep -Eq 'tests 24$' "$RUNNER_TEMP/r12-14/dependency-graph-tests.log"
          grep -Eq 'pass 24$' "$RUNNER_TEMP/r12-14/dependency-graph-tests.log"
          grep -Eq 'fail 0$' "$RUNNER_TEMP/r12-14/dependency-graph-tests.log"
          node scripts/architecture/dependency-graph.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/dependency-graph.log"
      - name: R16-11 migration names, duplicate modules and scoped ownership decisions
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-16-module-naming.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/module-naming-tests.log"
          grep -Eq 'tests 14$' "$RUNNER_TEMP/r12-14/module-naming-tests.log"
          grep -Eq 'pass 14$' "$RUNNER_TEMP/r12-14/module-naming-tests.log"
          grep -Eq 'fail 0$' "$RUNNER_TEMP/r12-14/module-naming-tests.log"
          node scripts/architecture/module-naming.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/module-naming-audit.log"
      - name: R16-10 source migration ledger and retained assertion contracts
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-16-test-cleanup.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/test-cleanup-tests.log"
          grep -Eq 'tests 4$' "$RUNNER_TEMP/r12-14/test-cleanup-tests.log"
          grep -Eq 'pass 4$' "$RUNNER_TEMP/r12-14/test-cleanup-tests.log"
          grep -Eq 'fail 0$' "$RUNNER_TEMP/r12-14/test-cleanup-tests.log"
      - name: R16-09 non-exemptible generated outputs and actual clean-cache startup
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-16-generated-cleanup.test.mjs tests/e2e/generated-cleanup.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/generated-cleanup-tests.log"
          grep -Eq 'tests 23$' "$RUNNER_TEMP/r12-14/generated-cleanup-tests.log"
          grep -Eq 'pass 23$' "$RUNNER_TEMP/r12-14/generated-cleanup-tests.log"
          grep -Eq 'fail 0$' "$RUNNER_TEMP/r12-14/generated-cleanup-tests.log"
      - name: R16-08 retired compatibility, model binding and actual UI ownership
        if: ${{ !cancelled() }}
        run: |
          node --test tests/stage-16-compatibility-retirement.test.mjs tests/e2e/compatibility-retirement.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/compatibility-retirement-tests.log"
          grep -Eq 'tests 6' "$RUNNER_TEMP/r12-14/compatibility-retirement-tests.log"
          grep -Eq 'pass 6' "$RUNNER_TEMP/r12-14/compatibility-retirement-tests.log"
          grep -Eq 'fail 0' "$RUNNER_TEMP/r12-14/compatibility-retirement-tests.log"
      - name: R16-07 feature-owned browser telemetry, E2E and link lifetimes
        if: ${{ !cancelled() }}
        run: node --test tests/stage-16-runtime-cleanup.test.mjs tests/stage-15-telemetry-lifecycle.test.mjs tests/stage-15-e2e-installation.test.mjs tests/stage-16-global-api.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/runtime-cleanup-tests.log"
      - name: R16-07 actual Vite DEV telemetry mount and terminal disposal
        if: ${{ !cancelled() }}
        run: node --test tests/e2e/telemetry-mount.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/dev-telemetry-tests.log"
      - name: R16-06 retired aggregates and directory public API contracts
        if: ${{ !cancelled() }}
        run: node --test tests/stage-16-directory-api.test.mjs tests/stage-10-native-save-session.test.mjs tests/stage-10-native-save-queue.test.mjs tests/stage-10-native-segmented-loader.test.mjs tests/stage-10-native-snapshot-uploader.test.mjs tests/stage-10-native-search-adapter.test.mjs tests/architecture/stage-08-hybrid-editor-controller.test.mjs tests/unit/editor/codemirror-adapter.test.mjs tests/unit/editor/codemirror-extension-registry.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/directory-api-tests.log"
      - name: R16-05 CSS ownership, canonical layout states and Preview visibility
        if: ${{ !cancelled() }}
        run: |
          node --test tests/ui/app-shell.test.mjs tests/ui/css-tokens.test.mjs tests/ui/style-layering.test.mjs \
            tests/unit/layout/*.test.mjs tests/unit/preview/preview-layout-stability.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/css-cleanup-tests.log"
      - name: R16-04 minimal HTML, zero inline events and explicit Menu commands
        if: ${{ !cancelled() }}
        run: |
          node --test tests/ui/minimal-index.test.mjs tests/unit/menu/menu-view.test.mjs tests/architecture/no-inline-events.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-14/html-cleanup-tests.log"
      - name: R16-03 no business globals and owned widget capabilities
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-16-global-api.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/global-api-tests.log"
          grep -Eq 'tests 16' "$RUNNER_TEMP/r12-14/global-api-tests.log"
          grep -Eq 'fail 0' "$RUNNER_TEMP/r12-14/global-api-tests.log"
      - name: R16-03 actual link preview focus owner retirement
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/e2e/link-preview.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/link-preview-focus-tests.log"
          grep -Eq 'tests 1' "$RUNNER_TEMP/r12-14/link-preview-focus-tests.log"
          grep -Eq 'fail 0' "$RUNNER_TEMP/r12-14/link-preview-focus-tests.log"
      - name: R16-02 explicit ESM startup and feature lifetime
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/stage-16-esm-application.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/esm-application-tests.log"
          grep -Eq 'tests 12' "$RUNNER_TEMP/r12-14/esm-application-tests.log"
          grep -Eq 'pass 12' "$RUNNER_TEMP/r12-14/esm-application-tests.log"
          grep -Eq 'fail 0' "$RUNNER_TEMP/r12-14/esm-application-tests.log"
      - name: R16-01 conservative deletion evidence and drift rejection
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --test tests/stage-16-deletion-inventory.test.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/deletion-inventory-tests.log"
          node scripts/stage-16/deletion-inventory.mjs 2>&1 | tee "$RUNNER_TEMP/r12-14/deletion-inventory.log"

      - name: Full Node regression
        if: ${{ !cancelled() }}
        run: npm test 2>&1 | tee "$RUNNER_TEMP/r12-14/node.log"
      - name: Architecture and documentation hard gates
        if: ${{ !cancelled() }}
        run: |
