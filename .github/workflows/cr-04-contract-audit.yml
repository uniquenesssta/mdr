name: CR-04 Stage 4 Contract Audit

on:
  push:
    branches:
      - agent/cr-04-stage4-conformance

permissions:
  contents: write

jobs:
  taskbook-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply missing Stage 4 module contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function prependHeader(path, lines) {
            const source = fs.readFileSync(path, 'utf8');
            if (/Responsibility:/.test(source.slice(0, 1200))) return;
            const header = ['/**', ...lines.map(line => ` * ${line}`), ' */', ''].join('\n');
            fs.writeFileSync(path, header + source, 'utf8');
          }

          function addLifecycle(path, lifecycle) {
            let source = fs.readFileSync(path, 'utf8');
            const headerEnd = source.indexOf('*/');
            if (headerEnd < 0) throw new Error(`${path}: missing module header`);
            if (/Lifecycle:/.test(source.slice(0, headerEnd))) return;
            source = source.slice(0, headerEnd) + ` * Lifecycle: ${lifecycle}\n ` + source.slice(headerEnd);
            fs.writeFileSync(path, source, 'utf8');
          }

          prependHeader('src/i18n/i18n-service.js', [
            'Responsibility: Own the active locale, translation lookup, placeholder formatting, fallback and locale-change subscriptions.',
            'Imports: Locale registry contract is injected; DOM, Settings persistence and platform APIs are forbidden.',
            'Exports: createI18nService().',
            'State/side effects: Owns only locale state and listener membership; it performs no DOM or storage writes.',
            'Lifecycle: Explicit destroyable service; destroy clears listeners and makes stateful operations terminal.'
          ]);
          prependHeader('src/i18n/locale-registry.js', [
            'Responsibility: Validate and expose the immutable short-text locale dictionaries and their canonical key/placeholder contract.',
            'Imports: Short-text locale data modules only; DOM, Help content, persistence and runtime services are forbidden.',
            'Exports: createLocaleRegistry(), localeRegistry and LOCALE_IDS.',
            'State/side effects: Immutable registry data only; no runtime mutation or side effects.',
            'Lifecycle: Import-only data/validation module; no runtime lifecycle.'
          ]);
          prependHeader('src/i18n/translation-bindings.js', [
            'Responsibility: Bind explicit View text/title/placeholder/alt/aria-label targets to the injected I18n service.',
            'Imports: I18n service and explicit View roots are injected; locale dictionaries, Settings state and persistence are forbidden.',
            'Exports: createTranslationBindings().',
            'State/side effects: Owns only bounded DOM translation updates plus locale/observer subscriptions.',
            'Lifecycle: Explicit destroyable binding set; destroy releases subscriptions/observers before becoming terminal.'
          ]);

          for (const locale of ['zh-CN', 'zh-TW', 'en', 'ja', 'ko', 'fr', 'de', 'es', 'ru', 'pt']) {
            prependHeader(`src/i18n/locales/${locale}.js`, [
              `Responsibility: Immutable short-text translations for ${locale}.`,
              'Imports: None; Help content, DOM, Settings persistence and runtime services are forbidden.',
              'Exports: One frozen short-text locale dictionary.',
              'State/side effects: None; the module contains data only.',
              'Lifecycle: Import-only data module; no runtime lifecycle.'
            ]);
          }

          const lifecycleContracts = {
            'src/features/settings/index.js': 'Import-only public facade; no runtime lifecycle or state ownership.',
            'src/features/settings/application/settings-controller.js': 'Explicit destroyable controller; destroy releases listeners, draft session, coordinator and View resources.',
            'src/features/settings/application/settings-apply-coordinator.js': 'Explicit destroyable coordinator; destroy prevents further commits/publications.',
            'src/features/settings/domain/settings-schema.js': 'Import-only immutable schema module; no runtime lifecycle.',
            'src/features/settings/domain/settings-defaults.js': 'Import-only immutable defaults module; no runtime lifecycle.',
            'src/features/settings/domain/settings-validation.js': 'Pure validation module; no runtime lifecycle or owned state.',
            'src/features/settings/state/settings-store.js': 'Explicit destroyable Store; destroy discards draft state without persistence and makes operations terminal.',
            'src/features/settings/infrastructure/settings-repository.js': 'Stateless repository instance; no start/destroy lifecycle is required.',
            'src/features/settings/sections/general-settings.js': 'Import-only immutable section descriptor; no runtime lifecycle.',
            'src/features/settings/sections/editor-settings.js': 'Import-only immutable section descriptor; no runtime lifecycle.',
            'src/features/settings/sections/save-settings.js': 'Import-only immutable section descriptor; no runtime lifecycle.',
            'src/features/settings/sections/toolbar-settings.js': 'Import-only immutable section descriptor; no runtime lifecycle.',
            'src/features/settings/sections/performance-settings.js': 'Import-only immutable section descriptor; no runtime lifecycle.',
            'src/features/settings/ui/settings-dialog-view.js': 'Explicit destroyable View; destroy releases owned field/navigation resources and DOM listeners.',
            'src/features/settings/ui/autosave-field-view.js': 'Explicit destroyable field View; destroy releases listeners and owned DOM.',
            'src/features/settings/ui/color-field-view.js': 'Explicit destroyable field View; destroy releases listeners and owned DOM.',
            'src/features/settings/ui/directory-field-view.js': 'Explicit destroyable field View; destroy releases listeners and owned DOM.'
          };
          for (const [path, lifecycle] of Object.entries(lifecycleContracts)) addLifecycle(path, lifecycle);

          prependHeader('src/styles/themes/light.css', [
            'Responsibility: Declare light-theme semantic token values only.',
            'Imports: Foundation token semantics through the CSS cascade; component/feature implementation rules are forbidden.',
            'Exports: Light-theme CSS custom-property values consumed by shared styles.',
            'State/side effects: Declarative CSS only; no JavaScript state or persistence.',
            'Lifecycle: Stylesheet-only contract; no runtime lifecycle.'
          ]);
          prependHeader('src/styles/themes/dark.css', [
            'Responsibility: Declare dark-theme semantic token values only.',
            'Imports: Foundation token semantics through the CSS cascade; component/feature implementation rules are forbidden.',
            'Exports: Dark-theme CSS custom-property values consumed by shared styles.',
            'State/side effects: Declarative CSS only; no JavaScript state or persistence.',
            'Lifecycle: Stylesheet-only contract; no runtime lifecycle.'
          ]);
          NODE
      - name: Verify Stage 4 taskbook conformance contract
        run: node --test tests/architecture/stage-04-taskbook-conformance.test.mjs
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit contract-only repair when needed
        run: |
          if git diff --quiet; then
            echo 'No contract repair needed.'
            exit 0
          fi
          git config user.name uniquenesssta
          git config user.email uniquenesssta@live.com
          git add src/i18n src/features/settings src/styles/themes
          git diff --cached --name-only
          git commit -m 'repair Stage 4 module responsibility contracts'
          git push origin HEAD:agent/cr-04-stage4-conformance
