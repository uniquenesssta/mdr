name: R9-07 authoritative validation

on:
  push:
    branches:
      - agent/r9-07-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-07:
    if: ${{ !contains(github.event.head_commit.message, '[diag]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish clean R9-07 candidate
        shell: bash
        run: |
          set +e
          python .agent/r9_07_apply_fix.py > /tmp/r9-07-validation.log 2>&1
          fix_status=$?
          if [ "$fix_status" -eq 0 ]; then
            bash .agent/r9_07_validate.sh >> /tmp/r9-07-validation.log 2>&1
            status=$?
          else
            status=$fix_status
          fi
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 220 /tmp/r9-07-validation.log > /tmp/r9-07-failure-tail.txt
            git reset --hard "$GITHUB_SHA"
            cp /tmp/r9-07-failure-tail.txt .agent/r9_07_failure_tail.txt
            git config user.name atomic-runner
            git config user.email atomic-runner@users.noreply.github.com
            git add .agent/r9_07_failure_tail.txt
            git commit -m 'ci: [diag] capture R9-07 validation failure'
            git push origin HEAD:agent/r9-07-runner
            cat /tmp/r9-07-failure-tail.txt
            exit "$status"
          fi
          cat /tmp/r9-07-validation.log
