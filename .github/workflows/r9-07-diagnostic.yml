name: R9-07 authoritative validation

on:
  push:
    branches:
      - agent/r9-07-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-07:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish clean R9-07 candidate
        shell: bash
        run: bash .agent/r9_07_validate.sh
