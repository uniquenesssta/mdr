name: R9-07 selection read diagnostic

on:
  push:
    branches:
      - agent/r9-07-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect selection read ownership
        shell: bash
        run: |
          echo '--- selection-controller raw reads ---'
          grep -nE 'selectionStart|selectionEnd|window\.getSelection|selectionchange|previewPointerActive|previewSelectionDirty' src/sync/selection-controller.js || true
          echo '--- classic scroll-sync raw reads ---'
          grep -nE 'selectionStart|selectionEnd|window\.getSelection|document\.getSelection' public/app/scroll-sync.js || true
          echo '--- selection controller callers ---'
          grep -RInE 'createSelectionSyncController|markdownEditorSelectionController' src public tests --exclude-dir=node_modules || true
