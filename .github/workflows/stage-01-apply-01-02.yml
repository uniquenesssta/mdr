name: Apply Stage 1 Atomic Task 1.2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-apply-01-02.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply minimal composition root
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          files = {
              'src/app/application-context.js': '''
          const APPLICATION_PORT_METHODS = Object.freeze({
            commands: Object.freeze(['register', 'execute']),
            events: Object.freeze(['subscribe', 'publish']),
            lifecycle: Object.freeze(['start', 'destroy'])
          });

          function isObject(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
          }

          function assertPort(name, value, methods) {
            if (!isObject(value) || methods.some(method => typeof value[method] !== 'function')) {
              throw new TypeError(
                `Application dependency "${name}" must implement ${methods.map(method => `${method}()`).join(' and ')}.`
              );
            }
          }

          export function createApplicationContext(dependencies) {
            if (!isObject(dependencies)) {
              throw new TypeError('Application dependencies must be an object.');
            }

            const context = {};
            for (const [name, methods] of Object.entries(APPLICATION_PORT_METHODS)) {
              const port = dependencies[name];
              assertPort(name, port, methods);
              context[name] = port;
            }

            return Object.freeze(context);
          }
          ''',
              'src/app/create-application.js': '''
          import { createApplicationContext } from './application-context.js';

          export function createApplication(dependencies) {
            const context = createApplicationContext(dependencies);

            return Object.freeze({
              commands: context.commands,
              events: context.events,
              async start() {
                await context.lifecycle.start(context);
              },
              async destroy() {
                await context.lifecycle.destroy(context);
              }
            });
          }
          '''
          }

          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          manifest_path = Path('tests/architecture/fixtures/production-modules.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          additions = [
              [
                  'src/app/application-context.js',
                  'esm-module',
                  'composition',
                  'Validation and immutable assembly of the explicit application architecture ports.',
                  'none',
                  'pure',
                  'retain',
                  False
              ],
              [
                  'src/app/create-application.js',
                  'esm-module',
                  'composition',
                  'Minimal application composition root exposing lifecycle delegation and command/event ports.',
                  'none',
                  'explicit-instance',
                  'retain',
                  False
              ]
          ]
          existing = {record[0] for record in manifest['modules']}
          manifest['modules'].extend(record for record in additions if record[0] not in existing)
          manifest['modules'].sort(key=lambda record: record[0])
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit Atomic Task implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app tests/architecture/fixtures/production-modules.json
          git diff --cached --check
          git commit -m "feat(stage1): add minimal application composition root"
          git push origin "HEAD:${{ github.head_ref }}"
