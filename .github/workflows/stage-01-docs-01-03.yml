          ## 行为与兼容性

          - 当前生产应用启动、关闭、UI 和用户交互行为保持不变；
          - 未修改公共业务接口、数据格式、持久化结构、配置、错误码或权限；
          - 未修改 9 个冻结模型和数据契约文件；
          - 未新增生产依赖；
          - 生命周期错误不会被静默忽略；
          - 临时应用工作流已删除，没有遗留调试脚本、构建产物或替代实现。

          ## 已知限制

          - 新生命周期尚未接入 `src/main.js`，当前没有生产参与者；
          - 参与者超时、主动取消和强制终止不属于本节点范围；
          - 启动参与者必须自行保证失败前的局部资源原子性；
          - 命令总线、事件总线和业务模块注册仍由后续 Atomic Task 实现；
          - 完整桌面回归运行在 Ubuntu 22.04，Windows 原生窗口、文件关联和桌面拖放未在本节点验证。

          ## 节点结论

          Atomic Task 1.3 已完成并通过专项验证和完整回归。生命周期状态、启动顺序、逆序回滚、逆序销毁、异常聚合、失败恢复与并发幂等均由一个独立模块拥有。Atomic Task 1.4 尚未开始。
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          source = path.read_text(encoding='utf-8')
          original_lines = source.count('\n')
          if not source.startswith('# Markdown Editor\n'):
              raise SystemExit('README header mismatch; refusing to edit')
          if original_lines < 250:
              raise SystemExit('README is unexpectedly short; refusing to edit')

          marker = '<!-- stage-01-node:01-03 -->'
          entry = (
              f'{marker}\n'
              '- 2026-08-04：阶段 1 Atomic Task 1.3（应用生命周期状态机）完成：新增 `src/app/application-lifecycle.js`，统一拥有 `idle / starting / running / stopping / failed` 状态、并发幂等、注册顺序启动、严格逆序回滚与销毁、异常聚合和失败清理重试；生产模块清单增至 60 个。专项 run 30911793856 与完整基线 run 30911794047 全部通过，现有启动链和用户行为未切换，Atomic Task 1.4 尚未开始。\n'
          )
          source = re.sub(r'<!-- stage-01-node:01-03 -->\n- [^\n]*\n', '', source)
          heading = '## Change Log\n'
          index = source.find(heading)
          if index < 0:
              raise SystemExit('README Change Log heading missing; refusing to edit')
          insert_at = index + len(heading)
          updated = source[:insert_at] + entry + source[insert_at:]
          if updated.count('\n') < original_lines:
              raise SystemExit('README line count decreased; refusing to write')
          path.write_text(updated, encoding='utf-8')
          PY
