name: Record Stage 1 Atomic Task 1.3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/stage-01-docs-01-03.yml

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Write Atomic Task record
        shell: bash
        run: |
          mkdir -p docs/rewrite-progress/stage-01
          cat > docs/rewrite-progress/stage-01/01-03-application-lifecycle.md <<'EOF'
          # 阶段 1 / Atomic Task 1.3：应用生命周期状态机

          ## 节点状态

          - 结果：**通过**
          - 阶段状态：阶段 1 继续进行；Atomic Task 1.3 已完成，Atomic Task 1.4 尚未开始。
          - 工作分支：`rewrite/modular-rebuild`
          - 最终实现与验证提交：`ed5e7164c70e559c1b5b73ad184db65fd941bac1`
          - 阶段 1 专项验证：GitHub Actions run `30911793856`
          - 专项证据工件：`stage-01-architecture-foundation-30911793856-1`
          - 专项证据工件 ID：`8893385464`
          - 专项证据摘要：`sha256:9356b804d59e285dc2bf364218f5393e5ce44c682c3216e84aefac9f3ca789f4`
          - 完整基线回归：GitHub Actions run `30911794047`
          - 完整基线工件：`stage-00-baseline-30911794047-1`
          - 完整基线工件 ID：`8893640262`
          - 完整基线摘要：`sha256:c244ad241c328bb27d2a9a4fbec7b15619afbebf38cd78a2e5c06582b37a45b2`
          - 上一节点基线：`6260577be7e6dd71b16ccd9a941eed191851e861`

          ## 实际目标

          建立应用生命周期的唯一状态所有者，使后续模块可以通过显式参与者契约完成有序启动、严格逆序销毁、启动失败回滚、失败清理重试和并发幂等控制，同时保持当前生产启动链和用户行为不变。

          本节点明确不执行以下工作：

          - 不将新生命周期接入 `src/main.js`；
          - 不迁移任何现有业务模块、DOM 监听器、Worker、存储或 Tauri 资源；
          - 不实现命令总线或事件总线内部逻辑；
          - 不修改冻结模型、持久化格式、UI、配置或公共业务接口；
          - 不新增生产依赖。

          ## 新增模块

          ### `src/app/application-lifecycle.js`

          该模块是生命周期状态与活动资源集合的唯一所有者，导出：

          - `LIFECYCLE_STATES`；
          - `createApplicationLifecycle(participants)`。

          生命周期对象采用显式实例，不使用模块级单例。返回对象被冻结，只公开只读 `state`、`start(context)` 和 `destroy(context)`。

          ### 生命周期状态

          - `idle`：没有活动参与者，可以开始新一代生命周期；
          - `starting`：正在按注册顺序启动参与者；
          - `running`：全部参与者启动完成；
          - `stopping`：正在严格逆序销毁活动参与者；
          - `failed`：至少一个活动参与者未能完成清理，禁止直接重新启动。

          ### 参与者契约

          `participants` 必须为数组，每个参与者必须实现：

          - `start(context)`；
          - `destroy(context)`。

          参与者数组在构造时复制并冻结。生命周期不会动态注册或替换参与者，也不会持有 DOM、平台对象或业务状态。

          ## 启动语义

          1. 从 `idle` 进入 `starting`；
          2. 按参与者注册顺序调用 `start(context)`；
          3. 只有成功完成启动的参与者才进入活动栈；
          4. 全部成功后进入 `running`；
          5. `running` 状态再次调用 `start()` 为无副作用成功；
          6. `starting` 状态的并发 `start()` 返回同一个进行中 Promise，不重复启动资源；
          7. `stopping` 状态收到 `start()` 时，等待当前销毁成功后启动新一代生命周期。

          ## 启动失败与逆序回滚

          当任一参与者启动失败时：

          - 仅回滚已经成功启动的参与者；
          - 回滚顺序严格与启动顺序相反；
          - 回滚全部成功时回到 `idle`，原始启动异常不转换地向外传播；
          - 任一回滚失败时进入 `failed`；
          - 返回的 `AggregateError` 按顺序包含原始启动异常和各回滚异常；
          - `failed` 状态禁止再次 `start()`，必须先调用 `destroy()` 重试尚未完成的清理。

          启动函数在自身 Promise 成功完成前不应把部分资源视为已完成启动；若启动函数内部在抛错前产生部分副作用，该参与者必须在自身实现中保证失败原子性或完成内部清理。

          ## 销毁与异常聚合

          - 活动参与者始终严格逆序销毁；
          - 单个参与者销毁失败不会阻止其余参与者继续清理；
          - 成功销毁的参与者立即从活动栈移除；
          - 失败参与者保留在活动栈中，状态进入 `failed`；
          - 所有销毁异常通过一个 `AggregateError` 向调用者报告；
          - 后续 `destroy()` 只重试仍未清理成功的参与者；
          - 全部清理成功后回到 `idle`，支持 `start → destroy → start`。

          ## 并发与上下文语义

          - `idle` 状态调用 `destroy()` 为无副作用成功；
          - `stopping` 状态的并发 `destroy()` 返回同一个进行中 Promise；
          - 启动期间收到 `destroy()` 时，等待启动完成或回滚结束，再执行必要清理；
          - 销毁期间收到 `start()` 时，只有销毁成功才开始下一代生命周期；
          - 最近一次启动上下文会作为未显式提供销毁上下文时的清理上下文；
          - 通过 `createApplication()` 使用时，生命周期接收组合根创建的同一个冻结应用上下文。

          ## 受影响链路

          - `src/app/application-lifecycle.js`：新增生命周期唯一状态所有者；
          - `src/app/create-application.js`：代码未修改，现有生命周期端口契约已通过真实集成测试；
          - `src/app/application-context.js`：代码未修改，继续验证 `start()` / `destroy()` 端口；
          - `tests/architecture/application-lifecycle.test.mjs`：新增生命周期专项测试；
          - `tests/architecture/fixtures/production-modules.json`：生产模块清单由 59 增加至 60；
          - `.github/workflows/stage-01-atomic.yml`：增加生命周期测试和结构化证据生成。

          当前 `src/main.js` 仍未导入新组合根或生命周期模块，因此生产应用没有被切换到新运行链。

          ## 专项测试覆盖

          `tests/architecture/application-lifecycle.test.mjs` 覆盖 9 组场景：

          1. 注册顺序启动、严格逆序销毁和 `start → destroy → start`；
          2. 已运行启动和空闲销毁的幂等无副作用行为；
          3. `starting` / `stopping` 状态以及并发调用共享进行中 Promise；
          4. 启动失败后对已启动参与者严格逆序回滚；
          5. 回滚失败进入 `failed`、聚合原始异常并通过后续销毁恢复；
          6. 销毁异常不中断其余清理、聚合异常并只重试失败参与者；
          7. 启动期间请求销毁的串行化行为；
          8. 销毁期间请求重启的新生命周期代次行为；
          9. 与 `createApplication()` 最小组合根的真实端口集成。

          ## 阶段 1 专项验证

          GitHub Actions run `30911793856`：**通过**。

