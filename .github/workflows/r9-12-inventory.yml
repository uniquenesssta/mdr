name: R9-12 impact inventory

on:
  push:
    branches:
      - agent/r9-12-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect R9-12 impact boundary
        shell: bash
        run: |
          set -euo pipefail
          bash .agent/r9_12_inventory.sh
          git add -f .agent/r9_12_inventory.log
          GIT_AUTHOR_NAME='atomic-runner' GIT_AUTHOR_EMAIL='atomic-runner@users.noreply.github.com' \
          GIT_COMMITTER_NAME='atomic-runner' GIT_COMMITTER_EMAIL='atomic-runner@users.noreply.github.com' \
            git commit -m 'ci: capture R9-12 impact inventory [skip ci]'
          git push origin HEAD:refs/heads/agent/r9-12-runner
