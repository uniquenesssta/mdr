name: R9-04 validation

on:
  push:
    branches:
      - agent/r9-04-runner3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-04:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate R9-04
        shell: bash
        run: bash .agent/r9_04_validate_corrected.sh
