name: R9-04 authoritative validation

on:
  push:
    branches:
      - agent/r9-04-runner4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-r9-04:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch concise README validator
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python .agent/r9_04_readme_validator_fix.py
      - name: Validate and publish clean R9-04 candidate
        shell: bash
        run: bash .agent/r9_04_validate_final.sh
