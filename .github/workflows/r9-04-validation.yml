name: R9-04 startup diagnostic

on:
  push:
    branches:
      - agent/r9-04-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-r9-04:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose built app startup
        shell: bash
        run: bash .agent/r9_04_diagnose_startup.sh
