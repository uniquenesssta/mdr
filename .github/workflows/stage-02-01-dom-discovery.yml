name: Stage 2 Atomic Task 2.1 DOM Discovery

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/stage-02-01-dom-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
      - name: Collect DOM assets and repository references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage-02-discovery
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from collections import defaultdict
          from html.parser import HTMLParser
          from pathlib import Path

          ROOT = Path('.')
          HTML_PATH = ROOT / 'index.html'
          OUTPUT = ROOT / 'artifacts/stage-02-discovery/dom-discovery.json'
          SUMMARY = ROOT / 'artifacts/stage-02-discovery/dom-discovery.md'

          VOID_TAGS = {
              'area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
              'link', 'meta', 'param', 'source', 'track', 'wbr'
          }

          class InventoryParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.nodes = []
                  self.child_counts = defaultdict(lambda: defaultdict(int))

              def _add(self, tag, attrs, self_closing=False):
                  parent_index = self.stack[-1] if self.stack else None
                  parent_path = self.nodes[parent_index]['path'] if parent_index is not None else ''
                  sibling_key = parent_path or '__root__'
                  self.child_counts[sibling_key][tag] += 1
                  ordinal = self.child_counts[sibling_key][tag]
                  path = f'{parent_path}/{tag}[{ordinal}]' if parent_path else f'/{tag}[{ordinal}]'
                  attr_map = {name: (value if value is not None else '') for name, value in attrs}
                  classes = [token for token in attr_map.get('class', '').split() if token]
                  inline_events = {
                      name: value for name, value in attr_map.items()
                      if name.lower().startswith('on') and len(name) > 2
                  }
                  aria = {
                      name: value for name, value in attr_map.items()
                      if name == 'role' or name.startswith('aria-')
                  }
                  data_attrs = {
                      name: value for name, value in attr_map.items()
                      if name.startswith('data-')
                  }
                  node = {
                      'index': len(self.nodes),
                      'tag': tag,
                      'path': path,
                      'parentPath': parent_path or None,
                      'depth': len(self.stack),
                      'id': attr_map.get('id') or None,
                      'classes': classes,
                      'aria': aria,
                      'dataAttributes': data_attrs,
                      'inlineEvents': inline_events,
                      'inlineStyle': attr_map.get('style') or None,
                      'attributes': dict(sorted(attr_map.items())),
                      'startLine': self.getpos()[0],
                      'selfClosing': self_closing or tag in VOID_TAGS,
                  }
                  self.nodes.append(node)
                  if not node['selfClosing']:
                      self.stack.append(node['index'])

              def handle_starttag(self, tag, attrs):
                  self._add(tag, attrs)

              def handle_startendtag(self, tag, attrs):
                  self._add(tag, attrs, True)

              def handle_endtag(self, tag):
                  for position in range(len(self.stack) - 1, -1, -1):
                      node_index = self.stack[position]
                      if self.nodes[node_index]['tag'] == tag:
                          self.nodes[node_index]['endLine'] = self.getpos()[0]
                          del self.stack[position:]
                          return

          html_text = HTML_PATH.read_text(encoding='utf-8')
          parser = InventoryParser()
          parser.feed(html_text)
          parser.close()
          for node_index in parser.stack:
              parser.nodes[node_index]['endLine'] = None

          source_files = []
          excluded_parts = {'.git', 'node_modules', 'dist', 'target', '.cargo-target', 'artifacts'}
          for path in ROOT.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in excluded_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in {'.js', '.mjs', '.css', '.html', '.md', '.json'}:
                  continue
              source_files.append(path)

          file_lines = {}
          for path in source_files:
              try:
                  file_lines[path.as_posix()] = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue

          ids = sorted({node['id'] for node in parser.nodes if node['id']})
          classes = sorted({name for node in parser.nodes for name in node['classes']})

          def find_literal_references(token, file_filter=None):
              results = []
              quoted = re.compile(rf"(['\"])\s*[^'\"]*{re.escape(token)}[^'\"]*\1")
              plain = re.compile(re.escape(token))
              for file_name, lines in file_lines.items():
                  if file_filter and not file_filter(file_name):
                      continue
                  for line_number, line in enumerate(lines, start=1):
                      if plain.search(line):
                          results.append({
                              'file': file_name,
                              'line': line_number,
                              'text': line.strip()[:500],
                              'insideQuotedLiteral': bool(quoted.search(line)),
                          })
              return results

          id_references = {token: find_literal_references(token) for token in ids}
          class_references = {token: find_literal_references(token) for token in classes}

          selector_patterns = [
              re.compile(r"getElementById\(\s*(['\"])(?P<selector>[^'\"]+)\1\s*\)"),
              re.compile(r"(?:querySelector|querySelectorAll|closest|matches)\(\s*(['\"])(?P<selector>[^'\"]+)\1\s*\)"),
          ]
          selector_calls = []
          for file_name, lines in file_lines.items():
              if not file_name.endswith(('.js', '.mjs')):
                  continue
              for line_number, line in enumerate(lines, start=1):
                  for pattern in selector_patterns:
                      for match in pattern.finditer(line):
                          selector_calls.append({
                              'file': file_name,
                              'line': line_number,
                              'selector': match.group('selector'),
                              'text': line.strip()[:500],
                              'isTest': file_name.startswith('tests/'),
                          })

          class_mutation_patterns = [
              re.compile(r"classList\.(?:add|remove|toggle|replace)\((?P<args>[^)]*)\)"),
              re.compile(r"\.className\s*=\s*(?P<args>.+)$"),
              re.compile(r"setAttribute\(\s*(['\"])class\1\s*,\s*(?P<args>[^)]*)\)"),
          ]
          quoted_token = re.compile(r"['\"]([^'\"]+)['\"]")
          class_mutations = []
          dynamic_class_names = set()
          for file_name, lines in file_lines.items():
              if not file_name.endswith(('.js', '.mjs')):
                  continue
              for line_number, line in enumerate(lines, start=1):
                  for pattern in class_mutation_patterns:
                      for match in pattern.finditer(line):
                          args = match.group('args')
                          literals = []
                          for literal in quoted_token.findall(args):
                              for token in literal.split():
                                  if token:
                                      literals.append(token)
                                      dynamic_class_names.add(token)
                          class_mutations.append({
                              'file': file_name,
                              'line': line_number,
                              'literals': sorted(set(literals)),
                              'text': line.strip()[:500],
                          })

          event_attributes = []
          for node in parser.nodes:
              for attribute, handler in node['inlineEvents'].items():
                  event_attributes.append({
                      'path': node['path'],
                      'line': node['startLine'],
                      'tag': node['tag'],
                      'id': node['id'],
                      'attribute': attribute,
                      'handler': handler,
                  })

          test_selector_calls = [item for item in selector_calls if item['isTest']]
          runtime_selector_calls = [item for item in selector_calls if not item['isTest']]

          script_nodes = [
              {
                  'path': node['path'],
                  'line': node['startLine'],
                  'src': node['attributes'].get('src'),
                  'type': node['attributes'].get('type'),
                  'defer': 'defer' in node['attributes'],
              }
              for node in parser.nodes if node['tag'] == 'script'
          ]
          stylesheet_nodes = [
              {
                  'path': node['path'],
                  'line': node['startLine'],
                  'href': node['attributes'].get('href'),
                  'rel': node['attributes'].get('rel'),
              }
              for node in parser.nodes if node['tag'] == 'link'
          ]

          direct_body_children = [node for node in parser.nodes if node['parentPath'] == '/html[1]/body[1]']
          top_level_regions = [
              {
                  'path': node['path'],
                  'line': node['startLine'],
                  'tag': node['tag'],
                  'id': node['id'],
                  'classes': node['classes'],
                  'aria': node['aria'],
                  'dataAttributes': node['dataAttributes'],
              }
              for node in direct_body_children
          ]

          report = {
              'schemaVersion': 1,
              'source': {
                  'path': 'index.html',
                  'sha256': hashlib.sha256(html_text.encode('utf-8')).hexdigest(),
                  'lineCount': len(html_text.splitlines()),
              },
              'summary': {
                  'elementCount': len(parser.nodes),
                  'idCount': len(ids),
                  'classCount': len(classes),
                  'inlineEventCount': len(event_attributes),
                  'inlineStyleCount': sum(1 for node in parser.nodes if node['inlineStyle']),
                  'ariaNodeCount': sum(1 for node in parser.nodes if node['aria']),
                  'dataAttributeNodeCount': sum(1 for node in parser.nodes if node['dataAttributes']),
                  'scriptCount': len(script_nodes),
                  'stylesheetLinkCount': len(stylesheet_nodes),
                  'selectorCallCount': len(selector_calls),
                  'runtimeSelectorCallCount': len(runtime_selector_calls),
                  'testSelectorCallCount': len(test_selector_calls),
                  'classMutationCallCount': len(class_mutations),
                  'dynamicClassLiteralCount': len(dynamic_class_names),
              },
              'topLevelRegions': top_level_regions,
              'nodes': parser.nodes,
              'ids': ids,
              'classes': classes,
              'inlineEvents': event_attributes,
              'scripts': script_nodes,
              'stylesheets': stylesheet_nodes,
              'runtimeSelectorCalls': runtime_selector_calls,
              'testSelectorCalls': test_selector_calls,
              'classMutations': class_mutations,
              'dynamicClassNames': sorted(dynamic_class_names),
              'idReferences': id_references,
              'classReferences': class_references,
          }
          OUTPUT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          summary_lines = [
              '# Stage 2.1 DOM discovery',
              '',
              f"- elements: {report['summary']['elementCount']}",
              f"- ids: {report['summary']['idCount']}",
              f"- classes: {report['summary']['classCount']}",
              f"- inline events: {report['summary']['inlineEventCount']}",
              f"- inline styles: {report['summary']['inlineStyleCount']}",
              f"- runtime selector calls: {report['summary']['runtimeSelectorCallCount']}",
              f"- test selector calls: {report['summary']['testSelectorCallCount']}",
              f"- class mutation calls: {report['summary']['classMutationCallCount']}",
              '',
              '## Direct body children',
              '',
          ]
          for item in top_level_regions:
              summary_lines.append(
                  f"- line {item['line']}: `{item['tag']}` id={item['id']!r} classes={item['classes']!r} aria={item['aria']!r}"
              )
          SUMMARY.write_text('\n'.join(summary_lines) + '\n', encoding='utf-8')
          PY
      - name: Upload DOM discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-01-dom-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stage-02-discovery
          if-no-files-found: error
          retention-days: 7
