name: R12-08 Local Commands and R12-07 Regression
run-name: R12-08 local commands and R12-07 regression · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  frontend:
    name: Local Commands and Tree Limits frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-08"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 9405ab44d6bb5f05eb755a2341e3ba76b4831ed8 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-08/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/r12-08/source.tar.gz" HEAD
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm run deps:prepare 2>&1 | tee "$RUNNER_TEMP/r12-08/dependencies.log"
      - name: Dependency audit hard gate
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/r12-08/npm-audit.log"
      - name: R12-08 command boundaries and R12-07 compatibility contracts
        run: |
          node --test \
            tests/stage-12-security-contract.test.mjs \
            tests/stage-12-path-policy.test.mjs \
            tests/stage-12-file-kind.test.mjs \
            tests/stage-12-readers.test.mjs \
            tests/stage-12-writers.test.mjs \
            tests/stage-12-directory-tree.test.mjs \
            tests/stage-12-tree-limits.test.mjs \
            tests/stage-12-local-commands.test.mjs \
            tests/unit/platform/file-system-client.test.mjs \
            tests/historical-workflow-routing.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-08/tree-limits-contracts.log"
      - name: Full Node regression
        run: npm test 2>&1 | tee "$RUNNER_TEMP/r12-08/node.log"
      - name: Architecture and documentation hard gates
        run: |
          npm run verify:architecture 2>&1 | tee "$RUNNER_TEMP/r12-08/architecture.log"
          npm run verify:no-legacy-runtime 2>&1 | tee "$RUNNER_TEMP/r12-08/no-legacy.log"
          npm run verify:generated-files 2>&1 | tee "$RUNNER_TEMP/r12-08/generated.log"
          npm run verify:readme-record 2>&1 | tee "$RUNNER_TEMP/r12-08/readme.log"
      - name: Browser preview contract
        run: npm run test:browser:contract 2>&1 | tee "$RUNNER_TEMP/r12-08/browser-contract.log"
      - name: Production build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/r12-08/build.log"
      - name: Built-app browser regression
        run: npm run test:browser 2>&1 | tee "$RUNNER_TEMP/r12-08/browser-app.log"
      - name: Validation leaves tracked sources unchanged
        run: |
          git status --short --untracked-files=all | tee "$RUNNER_TEMP/r12-08/workspace.log"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain frontend evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-08-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-08/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Real Rust Local Commands, Tree Limits and hard gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record validation target
        run: |
          mkdir -p "$RUNNER_TEMP/r12-08"
          test -z "$(git status --porcelain)"
          test ! -e src-tauri/gen/schemas/linux-schema.json
          printf 'MARKDOWN_EDITOR_LOG_DIR=%s/r12-08/performance-logs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 9405ab44d6bb5f05eb755a2341e3ba76b4831ed8 HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/r12-08/commit.txt"
      - name: Guard R12-08 scope and frozen policies
        run: |
          base='9405ab44d6bb5f05eb755a2341e3ba76b4831ed8'
          git diff --quiet "$base"...HEAD -- \
            src-tauri/Cargo.toml src-tauri/Cargo.lock package.json package-lock.json \
            src-tauri/src/external_link.rs src-tauri/src/web_fetch.rs \
            src-tauri/src/performance_log.rs src-tauri/src/document_store \
            src-tauri/src/local_file/path_policy.rs src-tauri/src/local_file/file_kind.rs \
            src-tauri/src/local_file/text_reader.rs src-tauri/src/local_file/image_reader.rs \
            src-tauri/src/local_file/text_writer.rs src-tauri/src/local_file/binary_writer.rs \
            src-tauri/src/local_file/directory_tree.rs src-tauri/src/local_file/tree_limits.rs \
            src/platform/desktop/file-system-client.js
          test ! -e src-tauri/src/local_file.rs
          test ! -e .github/workflows/r12-source-snapshot.yml
          node --test tests/stage-12-local-commands.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/r12-08/command-scope.log"
          git diff --check
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pin Rust 1.88 with Clippy and rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustc --version
          cargo --version
      - name: Rust formatting
        run: |
          rustfmt --edition 2021 --check --config max_width=120 \
            src-tauri/src/local_file/mod.rs \
            src-tauri/src/local_file/commands.rs \
            src-tauri/src/local_file/operations.rs \
            src-tauri/src/local_file/types.rs \
            src-tauri/src/local_file/binary_writer.rs \
            src-tauri/src/local_file/directory_tree.rs \
            src-tauri/src/local_file/file_kind.rs \
            src-tauri/src/local_file/image_reader.rs \
            src-tauri/src/local_file/path_policy.rs \
            src-tauri/src/local_file/text_reader.rs \
            src-tauri/src/local_file/text_writer.rs \
            src-tauri/src/local_file/tree_limits.rs \
            src-tauri/tests/local_file/legacy.rs \
            src-tauri/tests/local_file/stage_12.rs \
            src-tauri/tests/local_file/commands.rs \
            src-tauri/tests/stage_12_security_compatibility.rs \
            2>&1 | tee "$RUNNER_TEMP/r12-08/rustfmt.log"
      - name: R12-08 real command tests 12 of 12
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::command_tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-commands.log"
          grep -Fq 'test result: ok. 12 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-commands.log"
      - name: Preserved local-file legacy regression 4 of 4
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-legacy.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-legacy.log"
      - name: R12-07 direct Tree Limits tests 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::tree_limits::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-tree-limits.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-tree-limits.log"
      - name: R12-06 direct Directory Tree regression 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::directory_tree::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-directory-tree.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-directory-tree.log"
      - name: R12-05 direct Writer regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::text_writer::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-text-writer.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-text-writer.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::binary_writer::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-binary-writer.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-binary-writer.log"
      - name: R12-04 direct Reader regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::text_reader::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-text-reader.log"
          grep -Fq 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-text-reader.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor \
            local_file::image_reader::tests 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-image-reader.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-image-reader.log"
      - name: R12-03 direct File Kind regression 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor file_kind::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-08/rust-file-kind.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-file-kind.log"
      - name: R12-02 direct Path Policy regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor path_policy::tests \
            2>&1 | tee "$RUNNER_TEMP/r12-08/rust-path-policy.log"
          grep -Fq 'test result: ok. 10 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-path-policy.log"
      - name: R12-01 direct behavior regression 10 of 10
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --bin markdown-editor stage_12_ \
            2>&1 | tee "$RUNNER_TEMP/r12-08/rust-production-contracts.log"
          grep -Fq 'test result: ok. 10 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-production-contracts.log"
      - name: R12-01 independent compatibility fixture 6 of 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test stage_12_security_compatibility \
            2>&1 | tee "$RUNNER_TEMP/r12-08/rust-fixture.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed' "$RUNNER_TEMP/r12-08/rust-fixture.log"
      - name: Full Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-08/rust-tests.log"
      - name: Full Clippy warnings-denied gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/r12-08/clippy.log"
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/r12-08/cargo-check.log"
      - name: Preserve newly generated Linux schema as evidence
        run: |
          git status --short --untracked-files=all | tee "$RUNNER_TEMP/r12-08/worktree-before-cleanup.log"
          node scripts/ci/archive-tauri-schema.mjs
      - name: Validation leaves tracked sources unchanged
        run: |
          git status --short --untracked-files=all | tee "$RUNNER_TEMP/r12-08/workspace.log"
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain Rust evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-08-rust-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-08/
          if-no-files-found: error
          retention-days: 14
