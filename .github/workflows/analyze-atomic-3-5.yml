name: Analyze Atomic 3.5

on:
  push:
    branches:
      - rewrite/modular-rebuild
    paths:
      - .github/workflows/analyze-atomic-3-5.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/modular-rebuild
          fetch-depth: 0
      - name: Inspect repository state and complete window call chain
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HEAD ==='
          git rev-parse HEAD
          git status --short
          echo '=== BROAD WINDOW REFERENCES ==='
          grep -RInEi 'getCurrentWindow|startDragging|onResized|onCloseRequested|window dragging|window resize|close request|minimi[sz]e|maximi[sz]e|restore window|preventDefault\(\)|requestClose|forceClose|destroyWindow|closeWindow' src tests scripts || true
          echo '=== WINDOW-RELATED PRODUCTION FILES ==='
          grep -RIlEi 'getCurrentWindow|startDragging|onResized|onCloseRequested|window dragging|window resize|close request|minimi[sz]e|maximi[sz]e|restore window|preventDefault\(\)|requestClose|forceClose|destroyWindow|closeWindow' src | sort || true
          echo '=== FILE CONTENTS ==='
          for file in $(grep -RIlEi 'getCurrentWindow|startDragging|onResized|onCloseRequested|window dragging|window resize|close request|minimi[sz]e|maximi[sz]e|restore window|preventDefault\(\)|requestClose|forceClose|destroyWindow|closeWindow' src tests scripts | sort || true); do
            echo "--- $file ---"
            sed -n '1,360p' "$file"
          done
          echo '=== APPLICATION LIFECYCLE ==='
          sed -n '1,320p' src/app/application-lifecycle.js
          echo '=== ALL CONTROLLER FILES ==='
          find src -type f | sort | grep -Ei 'controller|window|title|lifecycle' || true
