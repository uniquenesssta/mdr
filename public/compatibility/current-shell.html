            <p>应用采用 Tauri、Rust 和原生前端技术构建，支持离线编辑、实时预览与超大文档虚拟化。</p>
          </section>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeHelp()" class="primary" data-i18n="helpOk">知道了</button>
      </div>
    </div>
  </div>

  <!-- 插入链接模态框 -->
  <div class="modal-overlay" id="link-modal">
    <div class="modal c-modal c-modal--narrow" role="dialog" aria-modal="true" aria-labelledby="link-modal-title">
      <div class="modal-header">
        <h3 id="link-modal-title"><svg class="icon icon-lg"><use href="/assets/icons.svg#icon-link"></use></svg> <span data-i18n="link">链接</span></h3>
        <button onclick="closeLinkModal()" aria-label="关闭"><svg class="icon"><use href="/assets/icons.svg#icon-close"></use></svg></button>
      </div>
      <div class="modal-body">
        <label for="link-url-input" data-i18n="promptLinkUrl">请输入链接地址</label>
        <input type="url" id="link-url-input" autocomplete="url" spellcheck="false" placeholder="https://">
      </div>
      <div class="modal-footer">
        <button onclick="closeLinkModal()" data-i18n="cancel">取消</button>
        <button onclick="confirmLinkInsert()" class="primary" data-i18n="insert">插入</button>
      </div>
    </div>
  </div>

  <!-- 网页转 Markdown 模态框 -->
  <div class="modal-overlay" id="url-modal">
    <div class="modal">
      <div class="modal-header">
        <h3><svg class="icon icon-lg"><use href="/assets/icons.svg#icon-globe"></use></svg> <span data-i18n="urlTitle">网页转 Markdown</span></h3>
        <button onclick="closeUrlModal()"><svg class="icon"><use href="/assets/icons.svg#icon-close"></use></svg></button>
      </div>
      <div class="modal-body">
        <label for="url-input" data-i18n="urlLabel">网页地址</label>
        <input type="url" id="url-input" data-i18n-placeholder="urlPlaceholder" placeholder="https://example.com/article">
        <div class="c-form-inline-option">
          <input type="checkbox" id="use-local-proxy" class="c-inline-checkbox" onchange="toggleProxyInput()">
          <label for="use-local-proxy" class="c-inline-label" data-i18n="useProxy">使用 Rust 本地后端（桌面版默认）</label>
        </div>
        <input type="url" id="proxy-url" value="http://localhost:8765/fetch" data-i18n-placeholder="proxyPlaceholder" placeholder="浏览器预览代理地址" class="c-proxy-input is-hidden">
        <button onclick="fetchUrl()" class="primary" data-i18n="fetchBtn">尝试获取</button>
        <div id="url-status" class="c-form-status"></div>
        <div id="manual-area" class="c-manual-input is-hidden">
          <label for="manual-html" data-i18n="manualLabel">网页 HTML 源码（手动粘贴）</label>
          <textarea id="manual-html" rows="6" data-i18n-placeholder="manualPlaceholder" placeholder="在浏览器中打开目标网页 → 右键「查看网页源代码」→ 全选复制 → 粘贴到此处"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeUrlModal()" data-i18n="cancel">取消</button>
        <button onclick="convertAndInsert()" class="primary" data-i18n="convertInsert">转换并插入</button>
      </div>
    </div>
  </div>

  <!-- 查找与替换模态框 -->
  <div class="modal-overlay" id="find-modal">
    <div class="modal c-modal c-modal--narrow">
      <div class="modal-header">
        <h3><svg class="icon icon-lg"><use href="/assets/icons.svg#icon-search"></use></svg> <span data-i18n="findTitle">查找与替换</span></h3>
        <button onclick="closeFindModal()"><svg class="icon"><use href="/assets/icons.svg#icon-close"></use></svg></button>
      </div>
      <div class="modal-body">
        <label for="find-input" data-i18n="findLabel">查找</label>
        <input type="text" id="find-input" data-i18n-placeholder="findPlaceholder" placeholder="要查找的内容">
        <label for="replace-input" data-i18n="replaceLabel">替换为</label>
        <input type="text" id="replace-input" data-i18n-placeholder="replacePlaceholder" placeholder="替换后的内容">
        <div id="find-status" class="c-form-status"></div>
      </div>
      <div class="modal-footer">
        <button onclick="closeFindModal()" data-i18n="cancel">关闭</button>
        <button onclick="replaceAll()" data-i18n="replaceAll">全部替换</button>
        <button onclick="replaceOne()" data-i18n="replaceOne">替换</button>
        <button onclick="findNext()" class="primary" data-i18n="findNext">查找下一个</button>
      </div>
    </div>
  </div>

  <!-- 导出图片模态框 -->
  <div class="modal-overlay export-progress-overlay" id="export-progress-modal" aria-live="polite">
    <div class="modal export-progress-modal" role="dialog" aria-modal="true" aria-labelledby="export-progress-title">
      <div class="modal-header">
        <h3 id="export-progress-title">正在准备导出</h3>
      </div>
      <div class="modal-body">
        <div class="export-progress-track" aria-hidden="true">
          <div class="export-progress-value" id="export-progress-value"></div>
        </div>
        <p class="export-progress-status" id="export-progress-status">正在准备文档…</p>
        <p class="hint">超大文档会分批构建导出内容，编辑器不会长时间无响应。</p>
      </div>
      <div class="modal-footer">
        <button id="export-progress-cancel" onclick="cancelActiveExport()">取消导出</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="export-image-modal">
    <div class="modal c-modal c-modal--preview">
      <div class="modal-header">
        <h3><svg class="icon icon-lg"><use href="/assets/icons.svg#icon-image"></use></svg> <span data-i18n="exportImageTitle">导出图片</span></h3>
        <button onclick="closeExportImageModal()"><svg class="icon"><use href="/assets/icons.svg#icon-close"></use></svg></button>
      </div>
      <div class="modal-body">
        <label data-i18n="ratioLabel">分享比例</label>
        <div class="ratio-grid">
          <button class="ratio-btn active" data-ratio="9:16" onclick="selectImageRatio('9:16')">9:16<br><small data-i18n="ratio9_16">手机竖屏/故事</small></button>
          <button class="ratio-btn" data-ratio="4:5" onclick="selectImageRatio('4:5')">4:5<br><small data-i18n="ratio4_5">小红书/IG</small></button>
          <button class="ratio-btn" data-ratio="3:4" onclick="selectImageRatio('3:4')">3:4<br><small data-i18n="ratio3_4">竖图</small></button>
          <button class="ratio-btn" data-ratio="1:1" onclick="selectImageRatio('1:1')">1:1<br><small data-i18n="ratio1_1">方形</small></button>
          <button class="ratio-btn" data-ratio="16:9" onclick="selectImageRatio('16:9')">16:9<br><small data-i18n="ratio16_9">横图</small></button>
        </div>
        <div class="option-row">
          <input type="checkbox" id="image-crop-fit" onchange="renderExportImagePreview()">
          <label for="image-crop-fit" data-i18n="cropLabel">过长时裁剪为固定比例（默认生成长图）</label>
        </div>
        <label data-i18n="previewLabel">预览</label>
        <div id="export-image-preview-wrap" class="f-export-image-preview-wrap">
          <img id="export-image-preview" alt="导出预览" data-i18n-alt="exportImagePreviewAlt" class="f-export-image-preview is-hidden">
        </div>
        <p class="hint" data-i18n="exportImageHint">内容较长时将按内容高度生成长图，方便手机阅读。</p>
      </div>
      <div class="modal-footer">
        <button onclick="closeExportImageModal()" data-i18n="cancel">取消</button>
        <button onclick="renderExportImagePreview()" data-i18n="refreshPreview">刷新预览</button>
        <button onclick="downloadExportImage()" class="primary" data-i18n="downloadPng">下载 PNG</button>
      </div>
    </div>
  </div>

  <!-- 插入图片模态框 -->
  <div class="modal-overlay" id="image-modal">
    <div class="modal c-modal c-modal--medium">
      <div class="modal-header">
        <h3><svg class="icon icon-lg"><use href="/assets/icons.svg#icon-image"></use></svg> <span data-i18n="imageTitle">插入图片</span></h3>
        <button onclick="closeImageModal()"><svg class="icon"><use href="/assets/icons.svg#icon-close"></use></svg></button>
      </div>
      <div class="modal-body">
        <div class="image-modal-tabs">
          <button type="button" class="image-tab active" data-tab="url" onclick="switchImageTab('url')" data-i18n="imageTabUrl">链接</button>
          <button type="button" class="image-tab" data-tab="upload" onclick="switchImageTab('upload')" data-i18n="imageTabUpload">本地上传</button>
        </div>
        <div class="image-tab-panel active" id="image-tab-url">
          <label for="image-url-input" data-i18n="imageUrlLabel">图片链接</label>
          <input type="url" id="image-url-input" data-i18n-placeholder="imageUrlPlaceholder" placeholder="https://example.com/image.png">
          <label for="image-url-alt" data-i18n="imageAltLabel">描述文字</label>
          <input type="text" id="image-url-alt" data-i18n-placeholder="imageAltPlaceholder" placeholder="图片描述">
        </div>
        <div class="image-tab-panel" id="image-tab-upload">
          <div class="upload-area" id="image-upload-area">
            <p data-i18n="uploadArea">点击选择或拖拽图片到此处</p>
            <input type="file" id="image-file-input" accept="image/*" onchange="handleImageFileSelect(this)">
          </div>
          <div id="image-upload-preview" class="upload-preview"></div>
          <label for="image-upload-alt" data-i18n="imageAltLabel">描述文字</label>
          <input type="text" id="image-upload-alt" data-i18n-placeholder="imageAltPlaceholder" placeholder="图片描述">
        </div>
        <p class="hint" data-i18n="imageHint">本地图片将以 Base64 嵌入文档，文件过大可能影响性能和保存。</p>
      </div>
      <div class="modal-footer">
        <button onclick="closeImageModal()" data-i18n="cancel">取消</button>
        <button onclick="confirmImageInsert()" class="primary" data-i18n="insert">插入</button>
      </div>
    </div>
  </div>

  <!-- 插入 Mermaid 模态框 -->
  <div class="modal-overlay" id="mermaid-modal">
    <div class="modal c-modal c-modal--wide">
      <div class="modal-header">
        <h3><svg class="icon icon-lg"><use href="/assets/icons.svg#icon-mermaid"></use></svg> <span data-i18n="mermaidTitle">插入 Mermaid 图表</span></h3>
        <button onclick="closeMermaidModal()"><svg class="icon"><use href="/assets/icons.svg#icon-close"></use></svg></button>
      </div>
      <div class="modal-body">
        <label for="mermaid-type" data-i18n="mermaidTypeLabel">图表类型</label>
        <select id="mermaid-type" onchange="updateMermaidTemplate()">
          <option value="mindmap" data-i18n="mermaidTypeMindmap">思维导图</option>
          <option value="flowchart" data-i18n="mermaidTypeFlowchart">流程图</option>
        </select>
        <label for="mermaid-code" data-i18n="mermaidCodeLabel">Mermaid 源码</label>
        <textarea id="mermaid-code" rows="10" data-i18n-placeholder="mermaidCodePlaceholder" placeholder="mindmap\n  root((主题))\n    子主题 A\n    子主题 B"></textarea>
        <p class="hint" data-i18n="mermaidHint">支持 Mermaid 语法，插入后将在预览区自动渲染。</p>
      </div>
      <div class="modal-footer">
        <button onclick="closeMermaidModal()" data-i18n="cancel">取消</button>
        <button onclick="confirmMermaidInsert()" class="primary" data-i18n="insert">插入</button>
      </div>
    </div>
  </div>
